[pytest]
# TEST-HARNESS D0 (2026-10-17). Run the suite ONLY as:
#   PYTHONPATH=quality .venv-ha/bin/python -m pytest quality/tests/ -q
# quality/tests/conftest.py aborts with "wrong interpreter" under any other
# interpreter (bare python3 is 3.9 without pytest-homeassistant-custom-component).
#
# This file pins behaviour that previously came from defaults; it deliberately
# changes nothing measured on 2026-10-17:
#   - rootdir stays the repo root (node ids keep the `quality/tests/...` prefix
#     that scripts/suite_namediff.py baselines use);
#   - asyncio mode was STRICT by default (pytest-asyncio 1.3.0) — pinned here.
testpaths = quality/tests
asyncio_mode = strict
