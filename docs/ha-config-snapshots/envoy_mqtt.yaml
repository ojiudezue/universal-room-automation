# Envoy live telemetry via MQTT
#
# Producer: add-on "Stream mqtt from Enphase Envoy" (13e68335_envoy_to_mqtt_json)
#   - reads the Envoy local endpoint /ivp/livedata/status over HTTPS
#   - publishes the raw JSON to topic /envoy/json roughly once per second
#   - runs in its own container using synchronous `requests`, so it is NOT
#     affected by the aiohttp "Session is closed" bug (home-assistant/core
#     #181243) that makes the enphase_envoy integration flap.
#
# UNITS: the meters.*.agg_p_mw fields are MILLIWATTS. (x / 1000) -> watts.
#   Verified against a live payload 2026-09-25: pv 12487416 -> 12487 W, with
#   pv = load + battery_charge - grid balancing to ~0.05 kW.
#
# SIGNS (live payload, split-phase US, phase_count 2):
#   storage.agg_p_mw  negative = battery CHARGING, positive = DISCHARGING
#   grid.agg_p_mw     positive = IMPORTING,        negative = EXPORTING
#
# expire_after IS LOAD-BEARING. MQTT holds the last message indefinitely, so
# without it a dead add-on would leave these sensors showing a frozen SOC that
# LOOKS live — strictly worse than the flapping we are trying to escape,
# because a stale number is silently wrong while `unavailable` is honest.
# 60s against a ~1s cadence means 60 consecutive missed messages before we
# declare it stale.
#
# NOTE ON THE TEMPLATES: the upstream README writes `x/1000 | round(0)`, which
# only works by an accident of Jinja precedence (filters bind tighter than
# arithmetic, so it parses as x / (1000|round(0))). Parenthesised here so the
# intent is explicit and cannot break if a filter is ever changed.

mqtt:
  sensor:
    # --- Battery ------------------------------------------------------------
    - name: "Envoy Live Battery SOC"
      unique_id: envoy_live_battery_soc
      state_topic: "/envoy/json"
      value_template: "{{ value_json['meters']['enc_agg_soc'] }}"
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement
      expire_after: 60
      qos: 0

    - name: "Envoy Live Battery Energy"
      unique_id: envoy_live_battery_energy
      state_topic: "/envoy/json"
      value_template: "{{ value_json['meters']['enc_agg_energy'] }}"
      unit_of_measurement: "Wh"
      device_class: energy_storage
      state_class: measurement
      expire_after: 60
      qos: 0

    # Positive = discharging, negative = charging.
    - name: "Envoy Live Battery Power"
      unique_id: envoy_live_battery_power
      state_topic: "/envoy/json"
      value_template: "{{ ((value_json['meters']['storage']['agg_p_mw'] / 1000) | round(0)) | int(0) }}"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 60
      qos: 0

    # --- Solar / grid / house ----------------------------------------------
    - name: "Envoy Live Solar Production"
      unique_id: envoy_live_solar_production
      state_topic: "/envoy/json"
      value_template: "{{ ((value_json['meters']['pv']['agg_p_mw'] / 1000) | round(0)) | int(0) }}"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 60
      qos: 0

    # Positive = importing from grid, negative = exporting.
    - name: "Envoy Live Grid Power"
      unique_id: envoy_live_grid_power
      state_topic: "/envoy/json"
      value_template: "{{ ((value_json['meters']['grid']['agg_p_mw'] / 1000) | round(0)) | int(0) }}"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 60
      qos: 0

    - name: "Envoy Live House Load"
      unique_id: envoy_live_house_load
      state_topic: "/envoy/json"
      value_template: "{{ ((value_json['meters']['load']['agg_p_mw'] / 1000) | round(0)) | int(0) }}"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 60
      qos: 0

    # --- Health -------------------------------------------------------------
    # The Envoy's own view of whether the livedata stream is armed. If this
    # ever reads "disabled", the add-on will try to re-arm it on its next loop.
    - name: "Envoy Live Stream State"
      unique_id: envoy_live_stream_state
      state_topic: "/envoy/json"
      value_template: "{{ value_json['connection']['sc_stream'] }}"
      entity_category: diagnostic
      expire_after: 60
      qos: 0

  binary_sensor:
    # Explicit liveness: ON while messages are arriving, unavailable when the
    # producer stops. Gives automations/URA something to gate trust on rather
    # than inferring freshness from a value that may be retained.
    - name: "Envoy Live Stream Publishing"
      unique_id: envoy_live_stream_publishing
      state_topic: "/envoy/json"
      value_template: >-
        {{ 'ON' if value_json['connection']['mqtt_state'] == 'connected' else 'OFF' }}
      payload_on: "ON"
      payload_off: "OFF"
      device_class: connectivity
      entity_category: diagnostic
      expire_after: 60
      qos: 0
