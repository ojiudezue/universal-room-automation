- id: '1743736255653'
  alias: Office Leave Automation
  description: Turn off office devices after leaving for 5 minutes (works 24/7)
  triggers:
  - entity_id:
    - binary_sensor.study_a_occupied
    to:
    - 'off'
    for:
      minutes: 5
    trigger: state
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: light.smart_light_23031714641167590a0248e1e9c00955
      state: 'on'
    - condition: state
      entity_id: fan.polyfan_dreo704s_wifi_studya
      state:
      - 'on'
    - condition: state
      entity_id: switch.usp_strip_outlet_5
      state: 'on'
  actions:
  - target:
      entity_id: light.smart_light_23031714641167590a0248e1e9c00955
    action: light.turn_off
    data: {}
  - target:
      entity_id:
      - fan.polyfan_dreo704s_wifi_studya
    action: fan.turn_off
    data: {}
  - target:
      entity_id:
      - switch.usp_strip_outlet_5
    action: switch.turn_off
    data: {}
  - data:
      title: Office Devices
      message: Office devices have been turned off due to inactivity
      notification_id: office_devices_off
    action: persistent_notification.create
  mode: single
- id: '1743736795940'
  alias: Office Arrive Automation
  description: Turn on office devices when arriving
  triggers:
  - entity_id:
    - binary_sensor.study_a_occupied
    to:
    - 'on'
    trigger: state
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: light.smart_light_23031714641167590a0248e1e9c00955
      state: 'off'
    - condition: state
      entity_id: switch.usp_strip_outlet_5
      state: 'off'
  actions:
  - choose:
    - conditions:
      - condition: time
        after: '22:00:00'
        before: 06:00:00
      sequence:
      - target:
          entity_id: light.smart_light_23031714641167590a0248e1e9c00955
        data:
          brightness_pct: 50
        action: light.turn_on
    - conditions: []
      sequence:
      - target:
          entity_id: light.smart_light_23031714641167590a0248e1e9c00955
        action: light.turn_on
  - target:
      entity_id:
      - switch.usp_strip_outlet_5
    action: switch.turn_on
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.office_b_zone_1_temperature
        above: 72
      sequence:
      - target:
          entity_id: fan.polyfan_dreo704s_wifi_studya
        data:
          percentage: 50
        action: fan.turn_on
    - conditions:
      - condition: numeric_state
        entity_id: sensor.office_b_zone_1_temperature
        below: 68
      sequence:
      - target:
          entity_id: fan.polyfan_dreo704s_wifi_studya
        action: fan.turn_off
  mode: single
  max_exceeded: silent
