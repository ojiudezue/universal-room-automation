- id: '1766974833049'
  alias: Garage Hallway Night light Automation
  description: 'The automation will help you spot unexpected activity while providing
    perfect staircase lighting for daily use. The security notifications will be most
    valuable during those evening/night hours when you''d want to know about any unexpected
    movement!


    Lighting Logic:


    Night (10pm-6am): Red tones at 60% (10pm-2am) or 40% (2am-6am)

    Dark daytime: Cool white, brighter when darker (50-80% based on lux)

    Smart thresholds: <20 lux at night, <30 lux during day

    2-minute timeout with smooth 1-2 second transitions


    Security Notifications:


    Active 4pm-6am daily - covers evening through early morning

    Contextual info: Shows lux level and time indicator

    Non-intrusive: Priority 0 with gentle sound

    Only when light activates - no spam from bright-condition motion


    Smart Behaviors:


    No daytime activation unless genuinely dark

    Inverted day brightness - darker conditions = brighter light

    Two-tier night dimming - accommodates natural sleep cycle

    Fail-safe design - defaults to safe operation if sensors fail


    Edge Cases Handled:


