          value: '{{ names[trigger.id[5:]] ~ '' done'' }}'
        action: input_text.set_value
    - conditions:
      - condition: trigger
        id: clear
      sequence:
      - target:
          entity_id: input_text.wallpanel_alert_laundry
        data:
          value: ''
        action: input_text.set_value
