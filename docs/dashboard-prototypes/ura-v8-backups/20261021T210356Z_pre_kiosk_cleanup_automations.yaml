- id: '1745467979555'
  alias: Master Toilet Closet - Adaptive Lighting
  description: Controls toilet closet's built-in RGBW light based on motion, time
    of day, and ambient light
  triggers:
  - entity_id: binary_sensor.rgbw_motion_lux_3rdr_wifi_matter_mastertoilet_occupancy
    to: 'on'
    trigger: state
  - entity_id: binary_sensor.rgbw_motion_lux_3rdr_wifi_matter_mastertoilet_occupancy
    to: 'off'
    for:
      minutes: 5
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.state == ''on'' }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ is_night }}'
          sequence:
          - target:
              entity_id: light.rgbw_motion_lux_3rdr_wifi_matter_mastertoilet
            data:
              brightness_pct: 40
              rgb_color:
              - 255
              - 30
              - 10
              transition: 1
            action: light.turn_on
        - conditions:
          - condition: template
            value_template: '{{ not is_night }}'
          sequence:
          - if:
            - condition: template
              value_template: '{{ current_lux < 30 }}'
            then:
            - target:
                entity_id: light.rgbw_motion_lux_3rdr_wifi_matter_mastertoilet
              data:
                brightness_pct: 80
                color_temp: 320
                transition: 1
              action: light.turn_on
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.state == ''off'' }}'
      sequence:
      - target:
          entity_id: light.rgbw_motion_lux_3rdr_wifi_matter_mastertoilet
        data:
          transition: 2
        action: light.turn_off
  variables:
    current_lux: '{{ states(''sensor.rgbw_motion_lux_3rdr_wifi_matter_mastertoilet_illuminance'')|float(0)
      }}'
    is_night: '{{ now().hour >= 22 or now().hour < 6 }}'
  mode: restart
  max_exceeded: silent
