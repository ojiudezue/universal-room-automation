      'preset_mode') %} {% set hvac_mode_now = state_attr('climate.back_hallway_zone_3',
      'hvac_mode') %}\n{% set still_hvac_violation = hvac_mode_now != 'heat_cool'
      %} {% set still_severe_violation = false %} {% set still_normal_violation =
