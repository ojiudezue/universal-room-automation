- id: '1756872301649'
  alias: Smart Staircase Night Light
  description: 'The automation will help you spot unexpected activity while providing
    perfect staircase lighting for daily use.


    [Updated 2026-03-09: color_temp mireds -> color_temp_kelvin for HA 2026.3]'
  triggers:
  - entity_id: binary_sensor.rgbw_motion_lux_3rdr_wifi_matter_stairs_occupancy
    to: 'on'
    id: motion_on
    platform: state
  - entity_id: binary_sensor.rgbw_motion_lux_3rdr_wifi_matter_stairs_occupancy
    to: 'off'
    for:
      minutes: 2
    id: motion_off
    platform: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''motion_on'' }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ is_security_alert_time and is_dark_enough }}'
        then:
        - data:
            message: "Staircase motion detected ({{ current_lux }} lux) {% if is_night_hours
              %}\U0001F319{% else %}☁️{% endif %}"
            title: "\U0001F3E0 Staircase Alert"
            target: PhalanxIphone15ProMax
            data:
              priority: 0
              sound: intermission
          action: notify.madronehapushover
      - if:
        - condition: template
          value_template: '{{ is_dark_enough }}'
        then:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ is_night_hours }}'
            sequence:
            - target:
                entity_id: light.rgbw_motion_lux_3rdr_wifi_matter_stairs
              data:
                brightness_pct: '{{ night_brightness }}'
                rgb_color:
                - 255
                - 153
                - 157
                transition: 1
              action: light.turn_on
          - conditions:
            - condition: template
              value_template: '{{ not is_night_hours }}'
            sequence:
            - target:
                entity_id: light.rgbw_motion_lux_3rdr_wifi_matter_stairs
              data:
                brightness_pct: '{{ day_brightness }}'
                color_temp_kelvin: 4000
                transition: 1
              action: light.turn_on
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''motion_off'' }}'
      sequence:
      - target:
          entity_id: light.rgbw_motion_lux_3rdr_wifi_matter_stairs
        data:
          transition: 2
        action: light.turn_off
  variables:
    current_lux: '{{ states(''sensor.rgbw_motion_lux_3rdr_wifi_matter_stairs_illuminance'')|float(0)
      }}'
    current_hour: '{{ now().hour }}'
    is_night_hours: '{{ current_hour >= 22 or current_hour < 6 }}'
    is_security_alert_time: '{{ current_hour >= 16 or current_hour < 6 }}'
    night_dark_threshold: 20
    day_dark_threshold: 30
    is_dark_enough: "{% if is_night_hours %}\n  {{ current_lux < night_dark_threshold
      }}\n{% else %}\n  {{ current_lux < day_dark_threshold }}\n{% endif %}"
    night_brightness: "{% if current_hour >= 22 or current_hour <= 2 %}\n  60\n{%
      else %}\n  40\n{% endif %}"
    day_brightness: "{% if current_lux < 15 %}\n  80\n{% elif current_lux < 25 %}\n
      \ 65\n{% else %}\n  50\n{% endif %}"
  mode: restart
  max_exceeded: silent
- id: '1757819142634'
  alias: Back Hallway - HVAC Arrester v10
  description: 'Manage manual temperature overrides with ±1°F tolerance from preset
    effective temps Smart Severity Detection Normal violations ±1°F tolerance (5-min
    delay → 30-min compromise → preset) Severe violations >3°F from effective temp
    (2-min delay → immediate preset) HVAC mode Always corrected to heat_cool Variable
    Response Times

    Severe 2-minute delay, immediate correction Normal 5-minute delay, 30-minute compromise
    period Mode issues Immediate correction after delay

    Unified Decision Tree Trigger → Calculate severity in variables Variable delay
    → 2min (severe) or 5min (normal) Re-check → Confirm violation still exists Fix
    HVAC mode → If needed Choose temp strategy → Severe vs normal handling Execute
    → With appropriate notifications'
  triggers:
  - entity_id: climate.back_hallway_zone_3
    attribute: temperature
    platform: state
  - entity_id: climate.back_hallway_zone_3
    attribute: hvac_mode
    platform: state
  - entity_id: climate.back_hallway_zone_3
    attribute: preset_mode
    to: manual
    platform: state
  conditions:
  - condition: template
    value_template: '{{ is_severe_temp_violation or is_normal_temp_violation or is_hvac_mode_violation
      }}'
  actions:
  - data:
      name: Back Hallway HVAC Arrester
      message: 'TRIGGER: Current {{ current_temp }}°F, Effective {{ effective_temp
        }}°F, Preset {{ preset_mode }}, HVAC {{ hvac_mode }}, Time preset {{ time_based_preset
        }}'
    action: logbook.log
  - delay:
      minutes: "{% if is_severe_temp_violation %}\n  2\n{% else %}\n  5\n{% endif
        %}\n"
  - condition: template
    value_template: "{% set current_temp_now = state_attr('climate.back_hallway_zone_3',
      'temperature') | float %} {% set preset_mode_now = state_attr('climate.back_hallway_zone_3',
      'preset_mode') %} {% set hvac_mode_now = state_attr('climate.back_hallway_zone_3',
      'hvac_mode') %}\n{% set still_hvac_violation = hvac_mode_now != 'heat_cool'
      %} {% set still_severe_violation = false %} {% set still_normal_violation =
      false %}\n{% if preset_mode_now == 'manual' %}\n  {% set still_severe_violation
      = current_temp_now < (effective_temp - 3) or current_temp_now > (effective_temp
      + 3) %}\n  {% if not still_severe_violation %}\n    {% set tolerance_min = effective_temp
      - 1 %}\n    {% set tolerance_max = effective_temp + 1 %}\n    {% set still_normal_violation
      = current_temp_now < tolerance_min or current_temp_now > tolerance_max %}\n
      \ {% endif %}\n{% endif %}\n{{ still_hvac_violation or still_severe_violation
      or still_normal_violation }}\n"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ state_attr(''climate.back_hallway_zone_3'', ''hvac_mode'')
          != ''heat_cool'' }}'
      sequence:
      - target:
          entity_id: climate.back_hallway_zone_3
        data:
          hvac_mode: heat_cool
        action: climate.set_hvac_mode
      - data:
          name: Back Hallway HVAC Arrester
          message: Fixed HVAC mode from {{ state_attr('climate.back_hallway_zone_3',
            'hvac_mode') }} to heat_cool
        action: logbook.log
  - variables:
      current_temp_final: '{{ state_attr(''climate.back_hallway_zone_3'', ''temperature'')
        | float }}'
      preset_mode_final: '{{ state_attr(''climate.back_hallway_zone_3'', ''preset_mode'')
        }}'
      current_time_preset: "{% set hour = now().hour %} {% if hour >= 6 and hour <
        8 %}\n  wake\n{% elif hour >= 8 and hour < 22 %}\n  home\n{% else %}\n  sleep\n{%
        endif %}\n"
      is_severe_final: "{% if preset_mode_final == 'manual' %}\n  {{ current_temp_final
        < (effective_temp - 3) or current_temp_final > (effective_temp + 3) }}\n{%
        else %}\n  false\n{% endif %}\n"
      is_normal_final: "{% if preset_mode_final == 'manual' and not is_severe_final
        %}\n  {% set tolerance_min = effective_temp - 1 %}\n  {% set tolerance_max
        = effective_temp + 1 %}\n  {{ current_temp_final < tolerance_min or current_temp_final
        > tolerance_max }}\n{% else %}\n  false\n{% endif %}\n"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ is_severe_final }}'
      sequence:
      - target:
          entity_id: climate.back_hallway_zone_3
        data:
          preset_mode: '{{ current_time_preset }}'
        action: climate.set_preset_mode
      - data:
          name: Back Hallway HVAC Arrester
          message: 'SEVERE: {{ current_temp_final }}°F vs {{ effective_temp }}°F effective
            - Reverted to {{ current_time_preset }} preset'
        action: logbook.log
    - conditions:
      - condition: template
        value_template: '{{ is_normal_final }}'
      sequence:
      - variables:
          compromise_temp: "{% if current_temp_final > effective_temp %}\n  {{ effective_temp
            + 1 }}\n{% else %}\n  {{ effective_temp - 1 }}\n{% endif %}\n"
          direction: "{% if current_temp_final > effective_temp %}\n  warmer\n{% else
            %}\n  cooler\n{% endif %}\n"
      - target:
          entity_id: climate.back_hallway_zone_3
        data:
          temperature: '{{ compromise_temp | float }}'
        action: climate.set_temperature
      - data:
          name: Back Hallway HVAC Arrester
          message: 'NORMAL: {{ current_temp_final }}°F vs {{ effective_temp }}°F effective
            - Compromise {{ compromise_temp }}°F for 30min'
        action: logbook.log
      - delay:
          minutes: 30
      - target:
          entity_id: climate.back_hallway_zone_3
        data:
          preset_mode: '{{ current_time_preset }}'
        action: climate.set_preset_mode
      - data:
          name: Back Hallway HVAC Arrester
          message: 30-min compromise ended - Reverted to {{ current_time_preset }}
            preset
        action: logbook.log
  variables:
    current_temp: '{{ state_attr(''climate.back_hallway_zone_3'', ''temperature'')
      | float }}'
    preset_mode: '{{ state_attr(''climate.back_hallway_zone_3'', ''preset_mode'')
      }}'
    hvac_mode: '{{ state_attr(''climate.back_hallway_zone_3'', ''hvac_mode'') }}'
    time_based_preset: "{% set hour = now().hour %} {% if hour >= 6 and hour < 8 %}\n
      \ wake\n{% elif hour >= 8 and hour < 22 %}\n  home\n{% else %}\n  sleep\n{%
      endif %}\n"
    effective_temp: "{% set current_preset_mode = state_attr('climate.back_hallway_zone_3',
      'preset_mode') %} {% if current_preset_mode == 'away' %}\n  80\n{% else %}\n
      \ 78\n{% endif %}\n"
    is_severe_temp_violation: "{% if preset_mode == 'manual' %}\n  {{ current_temp
      < (effective_temp - 3) or current_temp > (effective_temp + 3) }}\n{% else %}\n
      \ false\n{% endif %}\n"
    is_normal_temp_violation: "{% if preset_mode == 'manual' %}\n  {% set tolerance_min
      = effective_temp - 1 %}\n  {% set tolerance_max = effective_temp + 1 %}\n  {{
      current_temp < tolerance_min or current_temp > tolerance_max }}\n{% else %}\n
      \ false\n{% endif %}\n"
    is_hvac_mode_violation: '{{ hvac_mode != ''heat_cool'' }}'
  mode: restart
