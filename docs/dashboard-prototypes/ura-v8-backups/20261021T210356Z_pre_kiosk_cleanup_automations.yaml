- id: '1748644430451'
  alias: Front Door – Auto-Relock (test)
  description: 'Relock the Kwikset 916 two minutes after it is unlocked from the outside
    (fingerprint, keypad, or app) once the door is confirmed closed.  Skips relock
    when the inside thumb-turn is used.  Sends a phone alert if battery is low or
    tamper is active.

    '
  triggers:
  - event_type: zwave_js_notification
    event_data:
      entity_id: '{{ lock_entity }}'
      label: Access Control
      event_label: Keypad unlock operation
    trigger: event
  - event_type: zwave_js_notification
    event_data:
      entity_id: '{{ lock_entity }}'
      label: Access Control
      event_label: RF unlock operation
    trigger: event
  actions:
  - wait_template: '{{ is_state(door_sensor, ''normal'') }}'
    timeout: 00:05:00
    continue_on_timeout: false
  - delay: '{{ relock_delay }}'
  - target:
      entity_id: '{{ lock_entity }}'
    action: lock.lock
  - variables:
      battery: '{{ states(battery_sensor) | int(101) }}'
      tamper: '{{ states(tamper_sensor) }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ battery <= low_battery_threshold or tamper == ''on'' }}'
      sequence:
      - data:
          title: ⚠️ Front-door lock needs attention
          message: '{% if battery <= low_battery_threshold %} Battery {{ battery }}
            %. {% endif %} {% if tamper == ''on'' %} Tamper detected. {% endif %}
            ({{ state_attr(lock_entity,''friendly_name'') }})'
        action: '{{ notify_target }}'
  mode: restart
  variables:
    relock_delay: 00:02:00
    low_battery_threshold: 30
    door_sensor: sensor.elkm1_front_door
    lock_entity: lock.doorlock_kwikset_zwave_frontentry
    battery_sensor: sensor.doorlock_kwikset_zwave_frontentry_battery_level
    tamper_sensor: binary_sensor.doorlock_kwikset_zwave_frontentry_tampering_product_cover_removed
    notify_target: notify.mobile_app_phalanxiphone15promax
- id: '1749618987557'
