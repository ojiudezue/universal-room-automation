    to: 'off'
    for: 00:03:00
    platform: state
    entity_id: binary_sensor.outlet_lux_pir_mmwave_temp_voc_pressure_invisoutet_mqtt_masterbath_occupancy
  - id: humidity_fan_on
    platform: state
    entity_id: sensor.outlet_lux_pir_mmwave_temp_voc_pressure_invisoutet_mqtt_masterbath_humidity
  - id: fan_manual_off
    to: 'off'
    platform: state
    entity_id: switch.shelly1pmminig3_34b7daca4214_switch_0
  actions:
  - choose:
    - sequence:
      - target:
          entity_id:
          - switch.switch_shelly1pmgen3_wifi_ojivanity
          - switch.shelly2pmg3_34cdb07765dc_switch_1
        action: switch.turn_on
      conditions:
      - id: oji_vanity_on
        condition: trigger
    - sequence:
      - target:
          entity_id:
          - switch.switch_shelly1pmgen3_wifi_ojivanity
          - switch.shelly2pmg3_34cdb07765dc_switch_1
        action: switch.turn_off
      conditions:
