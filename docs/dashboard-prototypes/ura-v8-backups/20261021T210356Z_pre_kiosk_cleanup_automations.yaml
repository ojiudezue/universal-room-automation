- id: '1749975305732'
  alias: Living Room Smart Climate and Light Control
  description: Controls fan and lights based on occupancy with mmWave sensor management
  triggers:
  - entity_id: binary_sensor.screek_human_sensor_l13_2412s_presence
    to: 'on'
    id: initial_occupancy
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ states(presence_sensor) != ''unavailable'' }}'
  - condition: template
    value_template: '{{ states(fan_temp_sensor) != ''unavailable'' }}'
  actions:
  - delay:
      seconds: 90
  - condition: template
    value_template: '{{ is_occupied }}'
  - if:
    - condition: template
      value_template: '{{ current_temp >= 75 }}'
    then:
    - target:
        entity_id: '{{ fan_entity }}'
      data:
        percentage: 83
      action: fan.turn_on
    - target:
        entity_id: '{{ oscillation_control }}'
      data:
        value: 60
      action: number.set_value
    - target:
        entity_id: '{{ fan_entity }}'
      data:
        oscillating: true
      action: fan.oscillate
  - repeat:
      while:
      - condition: template
        value_template: '{{ true }}'
      sequence:
      - delay:
          minutes: 30
      - target:
          entity_id: '{{ fan_entity }}'
        action: fan.turn_off
      - delay:
          seconds: 95
      - variables:
          recheck_temp: '{{ states(fan_temp_sensor) | float(70) }}'
          recheck_occupied: '{{ is_state(presence_sensor, ''on'') and (is_state(still_target,
            ''on'') or is_state(moving_target, ''on'')) }}'
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ recheck_occupied and recheck_temp >= 75 }}'
          sequence:
          - target:
              entity_id: '{{ fan_entity }}'
            data:
              percentage: 83
            action: fan.turn_on
          - target:
              entity_id: '{{ oscillation_control }}'
            data:
              value: 60
            action: number.set_value
          - target:
              entity_id: '{{ fan_entity }}'
            data:
              oscillating: true
            action: fan.oscillate
        - conditions:
          - condition: template
            value_template: '{{ recheck_occupied and recheck_temp < 72 }}'
          sequence:
          - target:
              entity_id: '{{ fan_entity }}'
            action: fan.turn_off
        - conditions:
          - condition: template
            value_template: '{{ not recheck_occupied }}'
          sequence:
          - target:
              entity_id: '{{ fan_entity }}'
            action: fan.turn_off
          - stop: Room unoccupied - automation complete
  variables:
    presence_sensor: binary_sensor.screek_human_sensor_l13_2412s_presence
    still_target: binary_sensor.screek_human_sensor_l13_2412s_still_target
    moving_target: binary_sensor.screek_human_sensor_l13_2412s_moving_target
    illuminance_sensor: sensor.screek_human_sensor_l13_2412s_bh1750_illuminance
    fan_entity: fan.towerfan_dreopilotmaxs_wifi_livingroom
    fan_temp_sensor: sensor.towerfandreowifilivingroom_temperature
    oscillation_control: number.towerfandreowifilivingroom_oscillation_angle
    current_temp: '{{ states(fan_temp_sensor) | float(70) }}'
    current_lux: '{{ states(illuminance_sensor) | float(100) }}'
    is_night: '{{ now().hour >= 22 or now().hour < 6 }}'
    is_dark: '{{ current_lux < 50 }}'
    needs_lighting: '{{ is_night or is_dark }}'
    is_occupied: '{{ is_state(presence_sensor, ''on'') and (is_state(still_target,
      ''on'') or is_state(moving_target, ''on'')) }}'
  mode: restart
- id: '1750030971233'
  alias: Master Bedroom Light + Energy Management (Auto Overhead lights)
  description: Robust occupancy-based control with multi-layer sensor validation and
    energy averaging
  triggers:
  - entity_id: binary_sensor.screek_human_sensor_l13_b38b24_presence
    to: 'on'
    id: initial_occupancy
    trigger: state
  - entity_id: binary_sensor.screek_human_sensor_l13_b38b24_presence
    to: 'off'
    for:
      minutes: 5
    id: lights_fan_timeout
    trigger: state
  - entity_id: binary_sensor.screek_human_sensor_l13_b38b24_presence
    to: 'off'
    for:
      minutes: 10
    id: tv_timeout_day
    trigger: state
  - entity_id: binary_sensor.screek_human_sensor_l13_b38b24_presence
    to: 'off'
    for:
      minutes: 5
    id: tv_timeout_sleep
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ states(presence_sensor) != ''unavailable'' }}'
  - condition: template
    value_template: '{{ states(temp_sensor) != ''unavailable'' }}'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: initial_occupancy
      sequence:
      - delay:
          seconds: 60
      - condition: template
        value_template: '{{ is_occupied }}'
      - if:
        - condition: template
          value_template: '{{ is_dark or is_sleep_hours }}'
        then:
        - target:
            entity_id: '{{ inovelli_switch }}'
          data:
            brightness_pct: '{{ 30 if is_sleep_hours else 80 }}'
          action: light.turn_on
        - target:
            entity_id: '{{ rgbw_lights }}'
          data:
            brightness_pct: '{{ 20 if is_sleep_hours else 80 }}'
            color_temp: 3000
          action: light.turn_on
      - if:
        - condition: template
          value_template: '{{ current_temp >= 74 }}'
        then:
        - target:
            entity_id: '{{ bedroom_fan }}'
          data:
            percentage: '{{ 66 if current_temp < 77 else 100 }}'
          action: fan.turn_on
      - data:
          title: Master Bedroom - Occupancy Detected
          message: 'Temp: {{ current_temp }}°F | Lux: {{ current_lux }} Fan: {{ ''ON-''
            + (66 if current_temp < 77 else 100)|string + ''%'' if current_temp >=
            74 else ''OFF'' }} Inovelli: {{ ''ON-'' + (30 if is_sleep_hours else 80)|string
            + ''%'' if (is_dark or is_sleep_hours) else ''OFF'' }} RGBW Lights: {{
            ''ON-'' + (20 if is_sleep_hours else 80)|string + ''%'' if (is_dark or
            is_sleep_hours) else ''OFF'' }} Sleep Mode: {{ is_sleep_hours }}

            '
        action: notify.mobile_app_phalanxiphone15promax
    - conditions:
      - condition: trigger
        id: lights_fan_timeout
      sequence:
      - repeat:
          count: 6
          sequence:
          - delay:
              seconds: 30
          - variables:
              sample_still: '{{ states(still_energy) | float(0) }}'
              sample_move: '{{ states(move_energy) | float(0) }}'
      - variables:
          final_still_energy: '{{ states(still_energy) | float(0) }}'
          final_move_energy: '{{ states(move_energy) | float(0) }}'
          presence_state: '{{ states(presence_sensor) }}'
          energy_confirms_empty: '{{ final_still_energy < 7 and final_move_energy
            < 7 }}'
      - if:
        - condition: template
          value_template: '{{ presence_state == ''off'' and energy_confirms_empty
            }}'
        then:
        - target:
            entity_id: '{{ rgbw_lights }}'
          action: light.turn_off
        - target:
            entity_id: '{{ inovelli_switch }}'
          action: light.turn_off
        - target:
            entity_id: '{{ bedroom_fan }}'
          action: fan.turn_off
        - data:
            title: Master Bedroom - Lights/Fan OFF
            message: 'UNOCCUPIED CONFIRMED: Presence: {{ presence_state }} Still Energy:
              {{ final_still_energy }}% Move Energy: {{ final_move_energy }}% Temp:
              {{ current_temp }}°F Action: RGBW Lights, Inovelli Switch & Fan turned
              off after 5min + 3min validation

              '
          action: notify.mobile_app_phalanxiphone15promax
        else:
        - data:
            title: Master Bedroom - Shutdown Prevented
            message: 'OCCUPANCY DETECTED: Presence: {{ presence_state }} Still Energy:
              {{ final_still_energy }}% Move Energy: {{ final_move_energy }}% Energy
              confirms empty: {{ energy_confirms_empty }} Action: Devices kept on
              due to occupancy signals

              '
          action: notify.mobile_app_phalanxiphone15promax
    - conditions:
      - condition: trigger
        id: tv_timeout_day
      - condition: template
        value_template: '{{ not is_sleep_hours }}'
      sequence:
      - repeat:
          count: 6
          sequence:
          - delay:
              seconds: 30
      - variables:
          final_still_energy: '{{ states(still_energy) | float(0) }}'
          final_move_energy: '{{ states(move_energy) | float(0) }}'
          presence_state: '{{ states(presence_sensor) }}'
          energy_confirms_empty: '{{ final_still_energy < 7 and final_move_energy
            < 7 }}'
      - if:
        - condition: template
          value_template: '{{ presence_state == ''off'' and energy_confirms_empty
            }}'
        then:
        - target:
            entity_id: '{{ bedroom_tv }}'
          action: switch.turn_off
        - data:
            title: Master Bedroom - TV OFF (Day)
            message: 'TV SHUTDOWN: Presence: {{ presence_state }} Still Energy: {{
              final_still_energy }}% Move Energy: {{ final_move_energy }}% Timeout:
              10 minutes (day mode) Action: TV turned off

              '
          action: notify.mobile_app_phalanxiphone15promax
    - conditions:
      - condition: trigger
        id: tv_timeout_sleep
      - condition: template
        value_template: '{{ is_sleep_hours }}'
      sequence:
      - repeat:
          count: 6
          sequence:
          - delay:
              seconds: 30
      - variables:
          final_still_energy: '{{ states(still_energy) | float(0) }}'
          final_move_energy: '{{ states(move_energy) | float(0) }}'
          presence_state: '{{ states(presence_sensor) }}'
          energy_confirms_empty: '{{ final_still_energy < 7 and final_move_energy
            < 7 }}'
      - if:
        - condition: template
          value_template: '{{ presence_state == ''off'' and energy_confirms_empty
            }}'
        then:
        - target:
            entity_id: '{{ bedroom_tv }}'
          action: switch.turn_off
        - data:
            title: Master Bedroom - TV OFF (Sleep)
            message: 'TV SHUTDOWN (SLEEP MODE): Presence: {{ presence_state }} Still
              Energy: {{ final_still_energy }}% Move Energy: {{ final_move_energy
              }}% Timeout: 5 minutes (sleep mode) Sleep Hours: {{ is_sleep_hours }}
              Action: TV turned off

              '
          action: notify.mobile_app_phalanxiphone15promax
  - if:
    - condition: template
      value_template: '{{ current_move_energy > 7 or current_still_energy > 7 }}'
    then:
    - data:
        title: Master Bedroom - Activity Detected
