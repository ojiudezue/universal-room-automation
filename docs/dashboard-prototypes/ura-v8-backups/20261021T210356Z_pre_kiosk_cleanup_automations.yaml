- id: '1750032140488'
  alias: Master Bedroom Energy Management - Manual Lights
  description: Robust occupancy-based control focused on turning off devices when
    leaving (manual light control)
  triggers:
  - entity_id: binary_sensor.screek_human_sensor_l13_b38b24_presence
    to: 'off'
    for:
      minutes: 5
    id: lights_fan_timeout
    trigger: state
  - entity_id: binary_sensor.screek_human_sensor_l13_b38b24_presence
    to: 'off'
    for:
      minutes: 10
    id: tv_timeout_day
    trigger: state
  - entity_id: binary_sensor.screek_human_sensor_l13_b38b24_presence
    to: 'off'
    for:
      minutes: 5
    id: tv_timeout_sleep
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ states(presence_sensor) != ''unavailable'' }}'
  - condition: template
    value_template: '{{ states(temp_sensor) != ''unavailable'' }}'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: lights_fan_timeout
      sequence:
      - repeat:
          count: 6
          sequence:
          - delay:
              seconds: 30
          - variables:
              sample_still: '{{ states(still_energy) | float(0) }}'
              sample_move: '{{ states(move_energy) | float(0) }}'
      - variables:
          final_still_energy: '{{ states(still_energy) | float(0) }}'
          final_move_energy: '{{ states(move_energy) | float(0) }}'
          presence_state: '{{ states(presence_sensor) }}'
          energy_confirms_empty: '{{ final_still_energy < 7 and final_move_energy
            < 7 }}'
          inovelli_state: '{{ states(inovelli_switch) }}'
          any_rgbw_on: '{{ rgbw_lights | select(''is_state'', ''on'') | list | count
            > 0 }}'
          fan_state: '{{ states(bedroom_fan) }}'
      - if:
        - condition: template
          value_template: '{{ presence_state == ''off'' and energy_confirms_empty
            }}'
        then:
        - if:
          - condition: template
            value_template: '{{ any_rgbw_on }}'
          then:
          - target:
              entity_id: '{{ rgbw_lights }}'
            action: light.turn_off
        - if:
          - condition: template
            value_template: '{{ inovelli_state == ''on'' }}'
          then:
          - target:
              entity_id: '{{ inovelli_switch }}'
            action: light.turn_off
        - target:
            entity_id: '{{ bedroom_fan }}'
          action: fan.turn_off
        - data:
            title: Master Bedroom - Devices OFF
            message: 'UNOCCUPIED CONFIRMED: Presence: {{ presence_state }} Still Energy:
              {{ final_still_energy }}% Move Energy: {{ final_move_energy }}% Temp:
              {{ current_temp }}°F Devices Turned Off: - RGBW Lights: {{ ''YES'' if
              any_rgbw_on else ''Already OFF'' }} - Inovelli Switch: {{ ''YES'' if
              inovelli_state == ''on'' else ''Already OFF'' }} - Fan: ALWAYS ATTEMPTED
              (RF state unreliable) Action: All lights & fan turned off after 5min
              + 3min validation

              '
          action: notify.mobile_app_phalanxiphone15promax
        else:
        - data:
            title: Master Bedroom - Shutdown Prevented
            message: 'OCCUPANCY DETECTED: Presence: {{ presence_state }} Still Energy:
              {{ final_still_energy }}% Move Energy: {{ final_move_energy }}% Energy
              confirms empty: {{ energy_confirms_empty }} Action: Devices kept on
              due to occupancy signals

              '
          action: notify.mobile_app_phalanxiphone15promax
    - conditions:
      - condition: trigger
        id: tv_timeout_day
      - condition: template
        value_template: '{{ not is_sleep_hours }}'
      sequence:
      - repeat:
          count: 6
          sequence:
          - delay:
              seconds: 30
      - variables:
          final_still_energy: '{{ states(still_energy) | float(0) }}'
          final_move_energy: '{{ states(move_energy) | float(0) }}'
          presence_state: '{{ states(presence_sensor) }}'
          energy_confirms_empty: '{{ final_still_energy < 7 and final_move_energy
            < 7 }}'
          tv_state: '{{ states(bedroom_tv) }}'
      - if:
        - condition: template
          value_template: '{{ presence_state == ''off'' and energy_confirms_empty
            }}'
        then:
        - if:
          - condition: template
            value_template: '{{ tv_state == ''on'' }}'
          then:
          - target:
              entity_id: '{{ bedroom_tv }}'
            action: switch.turn_off
        - data:
            title: Master Bedroom - TV OFF (Day)
            message: 'TV SHUTDOWN: Presence: {{ presence_state }} Still Energy: {{
              final_still_energy }}% Move Energy: {{ final_move_energy }}% TV was:
              {{ tv_state }} Timeout: 10 minutes (day mode) Action: {{ ''TV turned
              off'' if tv_state == ''on'' else ''TV already off'' }}

              '
          action: notify.mobile_app_phalanxiphone15promax
    - conditions:
      - condition: trigger
        id: tv_timeout_sleep
      - condition: template
        value_template: '{{ is_sleep_hours }}'
      sequence:
      - repeat:
          count: 6
          sequence:
          - delay:
              seconds: 30
      - variables:
          final_still_energy: '{{ states(still_energy) | float(0) }}'
          final_move_energy: '{{ states(move_energy) | float(0) }}'
          presence_state: '{{ states(presence_sensor) }}'
          energy_confirms_empty: '{{ final_still_energy < 7 and final_move_energy
            < 7 }}'
          tv_state: '{{ states(bedroom_tv) }}'
      - if:
        - condition: template
          value_template: '{{ presence_state == ''off'' and energy_confirms_empty
            }}'
        then:
        - if:
          - condition: template
            value_template: '{{ tv_state == ''on'' }}'
          then:
          - target:
              entity_id: '{{ bedroom_tv }}'
            action: switch.turn_off
        - data:
            title: Master Bedroom - TV OFF (Sleep)
            message: 'TV SHUTDOWN (SLEEP MODE): Presence: {{ presence_state }} Still
              Energy: {{ final_still_energy }}% Move Energy: {{ final_move_energy
              }}% TV was: {{ tv_state }} Timeout: 5 minutes (sleep mode) Sleep Hours:
              {{ is_sleep_hours }} Action: {{ ''TV turned off'' if tv_state == ''on''
              else ''TV already off'' }}

              '
          action: notify.mobile_app_phalanxiphone15promax
  - if:
    - condition: template
      value_template: '{{ current_move_energy > 7 or current_still_energy > 7 }}'
    then:
    - data:
        title: Master Bedroom - Activity Detected
        message: 'TIMER RESET: Still Energy: {{ current_still_energy }}% Move Energy:
          {{ current_move_energy }}% All device timers reset due to activity

          '
      action: notify.mobile_app_phalanxiphone15promax
  variables:
    presence_sensor: binary_sensor.screek_human_sensor_l13_b38b24_presence
    still_target: binary_sensor.screek_human_sensor_l13_b38b24_still_target
    moving_target: binary_sensor.screek_human_sensor_l13_b38b24_moving_target
    still_energy: sensor.screek_human_sensor_l13_b38b24_still_energy
    move_energy: sensor.screek_human_sensor_l13_b38b24_move_energy
    illuminance_sensor: sensor.screek_human_sensor_l13_b38b24_bh1750_illuminance
    inovelli_switch: light.switch_inovelli_thread_masterbedroom_light_1
    bedroom_fan: fan.ceilingfan_fanimaton_rf304_25_masterbedroom
    bedroom_tv: switch.master_bedroom_television
    temp_sensor: sensor.office_b_zone_1_temperature
    rgbw_lights:
    - light.rgb_white_light_jullison_wifi_master1
    - light.rgb_white_light_jullison_wifi_master2
    - light.rgb_white_light_jullison_wifi_master3
    - light.rgb_white_light_jullison_wifi_master4
    - light.rgb_white_light_jullison_wifi_master5
    - light.rgb_white_light_jullison_wifi_master8
    current_temp: '{{ states(temp_sensor) | float(70) }}'
    current_lux: '{{ states(illuminance_sensor) | float(100) }}'
    is_sleep_hours: '{{ now().hour >= 22 or now().hour < 6 }}'
    is_occupied: '{{ is_state(presence_sensor, ''on'') and (is_state(still_target,
      ''on'') or is_state(moving_target, ''on'')) }}'
    current_still_energy: '{{ states(still_energy) | float(0) }}'
    current_move_energy: '{{ states(move_energy) | float(0) }}'
  mode: restart
- id: '1750070811993'
  alias: Guest Bathroom night light
  description: 'Guest Bathroom built-in RGBW light based on motion, time of day, and
    ambient light


    [Updated 2026-03-09: color_temp mireds -> color_temp_kelvin for HA 2026.3]'
  triggers:
  - entity_id:
    - binary_sensor.rgbw_lux_motion_3rdr_wifi_matter_guestroom1bath_occupancy
    to: 'on'
    trigger: state
  - entity_id:
    - binary_sensor.rgbw_lux_motion_3rdr_wifi_matter_guestroom1bath_occupancy
    to:
    - 'off'
    for:
      hours: 0
      minutes: 10
      seconds: 0
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.state == ''on'' }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ is_night }}'
          sequence:
          - target:
              entity_id: light.rgbw_lux_motion_3rdr_wifi_matter_guestroom1bath
            data:
              brightness_pct: 40
              rgb_color:
              - 255
              - 30
              - 10
              transition: 1
            action: light.turn_on
        - conditions:
          - condition: template
            value_template: '{{ not is_night }}'
          sequence:
          - if:
            - condition: template
              value_template: '{{ current_lux < 30 }}'
            then:
            - target:
                entity_id: light.rgbw_lux_motion_3rdr_wifi_matter_guestroom1bath
              data:
                brightness_pct: 80
                color_temp_kelvin: 3125
                transition: 1
              action: light.turn_on
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.state == ''off'' }}'
      sequence:
      - target:
          entity_id: light.rgbw_lux_motion_3rdr_wifi_matter_guestroom1bath
        data:
          transition: 2
        action: light.turn_off
  mode: restart
  variables:
    current_lux: '{{ states(''sensor.rgbw_lux_motion_3rdr_wifi_matter_guestroom1bath_illuminance'')|float(0)
      }}'
    is_night: '{{ now().hour >= 22 or now().hour < 6 }}'
  max_exceeded: silent
- id: '1750820778098'
  alias: Powder fan by occupancy (interim, lights moved to URA)
  description: Fan-only remnant of Guest Toilet Automation2 (2026-10-14). Lights now
    run in URA (room Powder). Remove once URA has occupancy-triggered exhaust (HUMIDITY-FAN-ON-RESEND-SPAM-1
    cycle). Fan on after 20 s occupied; off after 7 min vacant plus 60 s + 30 s per
    minute of use, capped at 600 s. Phone notifications and the stray guestroom1bath
    light call were dropped.
  triggers:
  - trigger: state
    entity_id: binary_sensor.rgbw_motion_lux_3rdr_wifi_matter_powder_occupancy
    to: 'on'
    for:
      seconds: 20
    id: occupied
  - trigger: state
    entity_id: binary_sensor.rgbw_motion_lux_3rdr_wifi_matter_powder_occupancy
    from: 'on'
    to: 'off'
    for:
      minutes: 7
    id: vacant
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: occupied
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.switch_shelly2pmgen3_wifi_guesttoilet2_sw2
    - conditions:
      - condition: trigger
        id: vacant
      sequence:
      - delay:
          seconds: '{% set used_min = ((as_timestamp(trigger.to_state.last_changed)
            - as_timestamp(trigger.from_state.last_changed)) / 60) | int %}{{ [60
            + used_min * 30, 600] | min }}'
      - action: switch.turn_off
        target:
          entity_id: switch.switch_shelly2pmgen3_wifi_guesttoilet2_sw2
  mode: restart
