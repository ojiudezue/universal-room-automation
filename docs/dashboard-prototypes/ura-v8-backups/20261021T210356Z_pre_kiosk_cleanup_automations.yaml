- id: '1771474549011'
  alias: 'Garage EV Charger: Smart Charging Schedule'
  description: 'Controls the garage Level 1 EV charger outlet on a smart schedule.
    Standard window: ON at midnight, OFF at 9am daily. Solar bonus window: if Enphase
    battery is at 100% AND Solcast forecasts >10 kWh remaining at 3pm, charger turns
    ON from 3-6pm before the standard overnight cycle resumes. Outlet starts OFF by
    default so plugging in after a trip does not immediately begin charging.'
  triggers:
  - at: 00:00:00
    id: midnight_on
    trigger: time
  - at: 09:00:00
    id: morning_off
    trigger: time
  - at: '15:00:00'
    id: solar_check
    trigger: time
  - at: '18:00:00'
    id: evening_off
    trigger: time
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: midnight_on
      sequence:
      - target:
          entity_id:
          - switch.smartplug_moes_wifi_garagealeftfront_socket_1
          - switch.smartplug_moes_wifi_garagealeftfront_socket_2
        action: switch.turn_on
    - conditions:
      - condition: trigger
