- id: '1760930812814'
  alias: Back Hallway - Guest Detection System v1
  description: "Combined guest arrival and departure detection with night protection\n\nGuest
    Room Motion (9AM-9PM)\n  ↓\nUpdate timestamp\n  ↓\nIf 6+ hours since last motion\n
    \ → Notify: \"[Guest Detect] \U0001F6CF️ Guest Activity\"\n---\nNo Motion for
    6h (8AM-10PM only)\n  ↓\nBinary sensor goes off\n  ↓\nNotify: \"[Guest Detect]
    \U0001F6AA Guest Departed\""
  triggers:
  - entity_id: binary_sensor.occupancy_lux_temp_humidity_hobeian_downguestroom_presence
    to: 'on'
    id: guest_motion
    trigger: state
  - entity_id: binary_sensor.back_hallway_guest_detected
    from: 'on'
    to: 'off'
    id: guest_departed
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: guest_motion
      - condition: time
        after: 09:00:00
        before: '21:00:00'
      sequence:
      - target:
          entity_id: input_datetime.back_hallway_last_guest_motion
        data:
          datetime: '{{ now().isoformat() }}'
        action: input_datetime.set_datetime
      - data:
          name: Back Hallway Guest Detection
          message: Guest room motion at {{ now().strftime('%I:%M %p') }} - Guest presence
            recorded ({{ hours_since_last_motion }}h since last)
        action: logbook.log
      - condition: template
        value_template: '{{ hours_since_last_motion >= 6 }}'
      - data:
          title: "[Guest Detect] \U0001F6CF️ Guest Activity"
          message: Guest room motion detected - Auto-enabled guest mode for better
            comfort
          data:
            sound: intermission
            device: PhalanxIphone15ProMax
        action: notify.MadroneHAPushover
    - conditions:
      - condition: trigger
        id: guest_departed
      - condition: time
        after: 08:00:00
        before: '22:00:00'
      sequence:
      - data:
          name: Back Hallway Guest Detection
          message: Guest mode auto-cleared - No motion for 6+ hours during daytime
        action: logbook.log
      - data:
          title: "[Guest Detect] \U0001F6AA Guest Departed"
          message: No guest room activity for 6 hours - Resumed normal energy saving
          data:
            sound: cashregister
            device: PhalanxIphone15ProMax
        action: notify.MadroneHAPushover
  variables:
    hours_since_last_motion: "{% set guest_motion_time = states('input_datetime.back_hallway_last_guest_motion')
      %} {% if guest_motion_time != 'unknown' %}\n  {{ ((now() - as_datetime(guest_motion_time)).total_seconds()
      / 3600) | round(1) }}\n{% else %}\n  999\n{% endif %}\n"
  mode: restart
