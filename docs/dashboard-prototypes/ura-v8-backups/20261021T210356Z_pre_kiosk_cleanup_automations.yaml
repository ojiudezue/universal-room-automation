          | float(0) %}

          {% set start = fan_start_humidity | float(0) %}

          {{ current <= (start - 8) }}'
        timeout: 00:45:00
      - target:
          entity_id: switch.shelly1pmminig3_34b7daca4214_switch_0
        action: switch.turn_off
      conditions:
      - id: humidity_fan_on
        condition: trigger
      - condition: not
        conditions:
        - after: '22:00:00'
          before: 06:00:00
          condition: time
      - condition: template
        value_template: "{% if states('input_datetime.master_bath_fan_manual_off_time')
          == 'unknown' %}\n  true\n{% else %}\n  {% set manual_off = states('input_datetime.master_bath_fan_manual_off_time')
          | as_datetime %}\n  {% if manual_off %}\n    {{ (now() - manual_off).total_seconds()
          > 14400 }}\n  {% else %}\n    true\n  {% endif %}\n{% endif %}"
      - state: 'off'
        condition: state
        entity_id: switch.shelly1pmminig3_34b7daca4214_switch_0
      - condition: or
        conditions:
        - condition: template
          value_template: "{% if trigger.from_state and trigger.to_state %}\n  {%
            set from_val = trigger.from_state.state | float(0) %}\n  {% set to_val
            = trigger.to_state.state | float(0) %}\n  {% set change = to_val - from_val
            %}\n  {% set time_diff = (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds()
            / 60 %}\n  {% if time_diff > 0 and time_diff <= 15 %}\n    {{ change >=
            15 }}\n  {% else %}\n    false\n  {% endif %}\n{% else %}\n  false\n{%
            endif %}"
        - above: 70
          condition: numeric_state
          entity_id: sensor.outlet_lux_pir_mmwave_temp_voc_pressure_invisoutet_mqtt_masterbath_humidity
    - sequence:
      - target:
          entity_id: input_datetime.master_bath_fan_manual_off_time
        data:
          datetime: '{{ now().isoformat() }}'
        action: input_datetime.set_datetime
      conditions:
      - id: fan_manual_off
        condition: trigger
  max: 10
  mode: queued
  variables:
    humidity_spike_threshold: 15
    humidity_absolute_threshold: 70
    humidity_drop_threshold: 8
- id: '1768710437405'
  alias: Garage Buttons - All Controls
  description: 'Control both garage doors with MOES 4-button: Button 1=Open A, 2=Close
    A, 3=Open B, 4=Close B. Uses event entity trigger pattern for Zigbee2MQTT. Z2M
    now reports button + event_type separately; conditions match ''<button>_<type>''.'
  triggers:
  - to:
    trigger: state
    entity_id: event.4button_moes_zigbee_garageopen_close_action
  actions:
  - choose:
    - sequence:
      - target:
          entity_id: cover.konnected_f0f5bd523b00_garage_door
        action: cover.open_cover
      conditions:
      - value_template: '{{ (trigger.to_state.attributes.button | string) ~ ''_''
          ~ trigger.to_state.attributes.event_type == ''1_single'' }}'
        condition: template
    - sequence:
      - target:
          entity_id: cover.konnected_f0f5bd523b00_garage_door
        action: cover.close_cover
      conditions:
      - value_template: '{{ (trigger.to_state.attributes.button | string) ~ ''_''
          ~ trigger.to_state.attributes.event_type == ''2_single'' }}'
        condition: template
    - sequence:
      - target:
          entity_id: cover.ratgdov25i_dbfe2a_door
        action: cover.open_cover
      conditions:
      - value_template: '{{ (trigger.to_state.attributes.button | string) ~ ''_''
          ~ trigger.to_state.attributes.event_type == ''3_single'' }}'
        condition: template
    - sequence:
      - target:
          entity_id: cover.ratgdov25i_dbfe2a_door
        action: cover.close_cover
      conditions:
      - value_template: '{{ (trigger.to_state.attributes.button | string) ~ ''_''
          ~ trigger.to_state.attributes.event_type == ''4_single'' }}'
        condition: template
  mode: restart
- id: '1770938962914'
  alias: Doorbell Detection WhatsApp Alert
  description: Sends WhatsApp notification with image and AI description when person/animal/vehicle
    is detected on doorbell cameras
  triggers:
  - entity_id:
    - binary_sensor.doorbell_lite_person_detected
    - binary_sensor.doorbell_lite_vehicle_detected
    - binary_sensor.doorbell_lite_animal_detected
    - binary_sensor.front_door_aerial_person_detected
    - binary_sensor.front_door_aerial_vehicle_detected
    - binary_sensor.front_door_aerial_animal_detected
    to: 'on'
    trigger: state
  actions:
  - target:
      entity_id: '{{ camera_entity }}'
    data:
      filename: '{{ snapshot_path }}'
    action: camera.snapshot
  - delay:
      seconds: 2
  - data:
      provider: 01KHB0EV5AP8ANWQ7RWT30M2CC
      model: gpt-4o-mini
      message: Describe what you see in this image. What type of detection is this
        (person, vehicle, or animal)? Provide a brief, clear description.
      image_file: '{{ snapshot_path }}'
      max_tokens: 300
    response_variable: image_analysis
    action: llmvision.image_analyzer
    note: 'model pinned to gpt-4o-mini 2026-08-11: provider default gpt-5-mini is
      a reasoning model whose reasoning consumed the 300-token budget, returning empty
      response_text since the 02-13 provider switch (CONSOL-1 D0 probe).'
  - data:
      number: '14258299520'
      message: "\U0001F6A8 {{ detection_type }} Detected at {{ camera_name }}\n\n\U0001F4F8
        {{ image_analysis.response_text }}"
      media_path: '{{ snapshot_path }}'
    action: whatsapp.send_message
  mode: queued
  max: 10
  variables:
    camera_entity: '{% if ''doorbell_lite'' in trigger.entity_id %}camera.doorbell_lite{%
      else %}camera.front_door_aerial{% endif %}'
    camera_name: '{% if ''doorbell_lite'' in trigger.entity_id %}Garage Doorbell{%
      else %}Front Door{% endif %}'
    detection_type: '{% if ''person'' in trigger.entity_id %}Person{% elif ''vehicle''
      in trigger.entity_id %}Vehicle{% else %}Animal{% endif %}'
    timestamp: '{{ now().strftime(''%Y%m%d_%H%M%S'') }}'
    snapshot_path: /config/www/doorbell_alerts/{{ camera_name | replace(' ', '_')
