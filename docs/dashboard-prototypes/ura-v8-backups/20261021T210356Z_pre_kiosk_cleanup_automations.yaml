        washer2: Washer 2
        dryer: Dryer
      running: '{{ states(''input_text.wallpanel_laundry_running'').split('','') |
        reject(''eq'', '''') | list }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id.startswith(''start_'') }}'
      sequence:
      - target:
          entity_id: input_text.wallpanel_laundry_running
        data:
          value: '{{ (running + [trigger.id[6:]]) | unique | join('','') }}'
        action: input_text.set_value
    - conditions:
      - condition: template
        value_template: '{{ trigger.id.startswith(''stop_'') and trigger.id[5:] in
          running }}'
      sequence:
      - target:
          entity_id: input_text.wallpanel_laundry_running
        data:
          value: '{{ running | reject(''eq'', trigger.id[5:]) | join('','') }}'
        action: input_text.set_value
      - target:
          entity_id: input_text.wallpanel_alert_laundry
