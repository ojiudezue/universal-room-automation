- id: '1747787482976'
  alias: Hourly Power Cycle PowerView 3 Hubs at 15 Minutes Past the Hour
  description: 'Turns off the specified switches at 15 past every hour, then turns
    them back on after a delay.

    '
  triggers:
  - minutes: 15
    seconds: 0
    trigger: time_pattern
  conditions: []
  actions:
  - repeat:
      count: '{{ switches | length }}'
      sequence:
      - data:
          entity_id: '{{ switches[repeat.index - 1] }}'
        action: switch.turn_off
  - delay:
      seconds: '{{ off_duration }}'
  - repeat:
      count: '{{ switches | length }}'
      sequence:
      - data:
          entity_id: '{{ switches[repeat.index - 1] }}'
        action: switch.turn_on
  variables:
    switches:
    - switch.powerplug_meross_matter_staircloset
    - switch.smart_switch_2303229034853451080648e1e9c0eefa_outlet
    - switch.smart_switch_2104294046913090850248e1e96ee5b6_outlet_1
    - switch.smart_switch_2104294046913090850248e1e96ee5b6_outlet_2
    off_duration: 60
  mode: single
