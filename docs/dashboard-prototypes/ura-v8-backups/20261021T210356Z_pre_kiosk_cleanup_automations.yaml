  - entity_id: binary_sensor.camera_protect_garagehallway_person_detected
    to: 'on'
    id: person_detected
    platform: state
  - entity_id: binary_sensor.mmwave_looponunity2_wifi_2_has_human_target
    to: 'on'
    id: human_detected
    platform: state
  - entity_id: binary_sensor.mmwave_looponunity2_wifi_2_has_still_human_target
    to: 'on'
    for:
      minutes: 1
    id: still_human
    platform: state
  - value_template: "{% set active_zones = [\n  is_state('binary_sensor.motiontempluxhum_protect_blu_kitchen_motion',
      'on'),\n  is_state('binary_sensor.rgbw_lux_motion_3rdr_wifi_matter_laundry_occupancy',
      'on'),\n  is_state('binary_sensor.rgbw_lux_motion_3rdr_wifi_matter_guestroom1bath_occupancy',
      'on')\n] | select | list | count %} {{ active_zones >= 2 and is_state('input_select.back_hallway_occupancy_state',
      'entry_detected') }}\n"
    id: multiple_zones
    platform: template
  - value_template: "{% set all_clear = [\n  is_state('binary_sensor.motiontempluxhum_protect_blu_kitchen_motion',
      'off'),\n  is_state('binary_sensor.mmwave_looponunity2_wifi_2_has_human_target',
      'off'),\n  is_state('binary_sensor.rgbw_lux_motion_3rdr_wifi_matter_laundry_occupancy',
      'off'),\n  is_state('binary_sensor.rgbw_lux_motion_3rdr_wifi_matter_guestroom1bath_occupancy',
      'off'),\n  is_state('binary_sensor.camera_protect_garagehallway_motion', 'off'),\n
      \ is_state('binary_sensor.camera_protect_garagehallway_person_detected', 'off')\n]
      | min %} {{ all_clear }}\n"
    for:
      minutes: 2
    id: fast_away
    platform: template
  - entity_id: binary_sensor.back_hallway_motion_group
    to: 'off'
    for:
      minutes: 5
    id: confirmed_away
    platform: state
  - entity_id: input_select.back_hallway_occupancy_state
    to: garage_opened
    for:
      minutes: 10
    id: garage_timeout
    platform: state
  - entity_id: input_select.back_hallway_occupancy_state
    to: entry_detected
    for:
      minutes: 10
    id: entry_timeout
    platform: state
  - entity_id: input_select.back_hallway_occupancy_state
    to: entry_detected
    for:
      minutes: 3
    id: dwell_timer
    platform: state
  - at: 00:00:00
    id: daily_reset
    platform: time
  conditions:
  - condition: or
    conditions:
    - condition: template
      value_template: '{{ trigger.id == ''daily_reset'' }}'
    - condition: template
      value_template: '{{ automation_enabled }}'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''garage_opened'' and current_state == ''vacant''
          }}'
      sequence:
      - target:
          entity_id: input_select.back_hallway_occupancy_state
        data:
          option: garage_opened
        action: input_select.select_option
      - target:
          entity_id: counter.back_hallway_garage_entries
        action: counter.increment
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ needs_preconditioning }}'
          sequence:
          - target:
              entity_id: climate.back_hallway_zone_3
            data:
              temperature: 79
            action: climate.set_temperature
          - data:
              name: Back Hallway HVAC
              message: 'DEBUG GARAGE: Pre-conditioning to 79°F, outdoor={{ outdoor_temp
                }}°F, needs_preconditioning={{ needs_preconditioning }}, current_state={{
                current_state }}'
            action: logbook.log
          - data:
              name: Back Hallway HVAC
              message: 'Garage opened - Pre-conditioning to 79°F (outdoor: {{ outdoor_temp
                }}°F)'
            action: logbook.log
        default:
        - data:
            name: Back Hallway HVAC
            message: 'Garage opened - No pre-conditioning needed (outdoor: {{ outdoor_temp
              }}°F)'
          action: logbook.log
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''motion_detected'', ''person_detected'',
          ''human_detected''] }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ current_state == ''vacant'' }}'
          sequence:
          - target:
              entity_id: input_select.back_hallway_occupancy_state
            data:
              option: entry_detected
            action: input_select.select_option
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ needs_preconditioning }}'
              sequence:
              - target:
                  entity_id: climate.back_hallway_zone_3
                data:
                  temperature: 79
                action: climate.set_temperature
              - data:
                  name: Back Hallway HVAC
                  message: 'DEBUG ENTRY: Pre-conditioning to 79°F from vacant state,
                    outdoor={{ outdoor_temp }}°F'
                action: logbook.log
              - data:
                  name: Back Hallway HVAC
                  message: Entry detected - Pre-conditioning to 79°F
                action: logbook.log
            default:
            - target:
                entity_id: climate.back_hallway_zone_3
              data:
                preset_mode: '{{ current_preset }}'
              action: climate.set_preset_mode
            - data:
                name: Back Hallway HVAC
                message: Entry detected - Setting to {{ current_preset }} preset
              action: logbook.log
        - conditions:
          - condition: template
            value_template: '{{ current_state == ''garage_opened'' }}'
          sequence:
          - target:
              entity_id: input_select.back_hallway_occupancy_state
            data:
              option: entry_detected
            action: input_select.select_option
          - data:
              name: Back Hallway HVAC
              message: Entry confirmed after garage opening
            action: logbook.log
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''dwell_timer'', ''multiple_zones'', ''still_human'']
          and current_state == ''entry_detected'' }}'
      sequence:
      - target:
          entity_id: input_select.back_hallway_occupancy_state
        data:
          option: dwelling
        action: input_select.select_option
      - target:
          entity_id: climate.back_hallway_zone_3
        data:
          preset_mode: '{{ current_preset }}'
        action: climate.set_preset_mode
      - data:
          name: Back Hallway HVAC
          message: 'DEBUG DWELL: Setting to {{ current_preset }} preset, time {{ now().hour
            }}:{{ now().minute }}, vars current_state={{ current_state }}, current_preset={{
            current_preset }}'
        action: logbook.log
      - data:
          name: Back Hallway HVAC
          message: Dwelling confirmed - Setting to {{ current_preset }} preset
        action: logbook.log
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''fast_away'', ''confirmed_away''] and
          current_state != ''vacant'' }}'
      sequence:
      - target:
          entity_id: input_select.back_hallway_occupancy_state
        data:
          option: vacant
        action: input_select.select_option
      - target:
          entity_id: climate.back_hallway_zone_3
        data:
          preset_mode: away
        action: climate.set_preset_mode
      - data:
          name: Back Hallway HVAC
          message: Zone vacant - Away mode activated
        action: logbook.log
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''garage_timeout'', ''entry_timeout'']
          }}'
      sequence:
      - target:
          entity_id: input_select.back_hallway_occupancy_state
        data:
          option: vacant
        action: input_select.select_option
      - target:
          entity_id: climate.back_hallway_zone_3
        data:
          preset_mode: away
        action: climate.set_preset_mode
      - data:
          name: Back Hallway HVAC
          message: Pre-conditioning timeout - No dwelling detected, returning to away
            preset
        action: logbook.log
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''daily_reset'' }}'
      sequence:
      - target:
          entity_id: counter.back_hallway_garage_entries
        action: counter.reset
  variables:
    current_state: '{{ states(''input_select.back_hallway_occupancy_state'') }}'
    current_preset: "{% set hour = now().hour %} {% if hour >= 6 and hour < 8 %}\n
      \ wake\n{% elif hour >= 8 and hour < 22 %}\n  home\n{% else %}\n  sleep\n{%
      endif %}\n"
    outdoor_temp: '{{ states(''sensor.phalanxmadrone_temperature'') | float }}'
    needs_preconditioning: '{{ outdoor_temp > 78 }}'
    automation_enabled: '{{ is_state(''input_boolean.back_hallway_automation_enabled'',
      ''on'') }}'
  mode: restart
- id: '1757826206465'
  alias: Upstairs Zone - HVAC Arrester
  description: "Manage manual temperature overrides with ±1°F tolerance from preset
    effective temps\n\nSmart Temperature Management:\nHome/Sleep/Wake (effective 77°F)
    → Allows manual 76°F-78°F\nAway (effective 80°F) → Allows manual 79°F-81°F\nHeat_Cool
    Mode: Always enforces heat_cool mode\n\nTolerance System:\n\n±1°F Forgiveness:
    76°F request during Home hours = Allowed\nCompromise Period: 74°F request → Adjusted
    to 76°F for 30min → Home preset\nSevere Override: 70°F request → Immediate revert
    to Home preset\n\nTime-Based Logic (Hardcoded):\n6AM-8AM: Wake preset (effectively
    77°F)\n8AM-5PM: Away preset (effectively 80°F)  \n5PM-10PM: Home preset (effectively
    77°F)\n10PM-6AM: Sleep preset (effectively 77°F)\nHeat/Cool System Support:\n\nHandles
    both target_temp_high and target_temp_low\nProvides meaningful violation messages
    (\"more aggressive cooling\", etc.)\nCompromises both high/low temps appropriately"
  triggers:
  - entity_id: climate.up_hallway_zone_2
    attribute: target_temp_high
    platform: state
  - entity_id: climate.up_hallway_zone_2
    attribute: target_temp_low
    platform: state
  - entity_id: climate.up_hallway_zone_2
    attribute: hvac_mode
    platform: state
  - entity_id: climate.up_hallway_zone_2
    attribute: preset_mode
    to: manual
    platform: state
  conditions:
  - condition: template
    value_template: '{{ is_severe_high_violation or is_normal_high_violation or is_severe_low_violation
      or is_normal_low_violation or is_hvac_mode_violation }}'
  actions:
  - delay:
      minutes: "{% if is_severe_high_violation or is_severe_low_violation %}\n  2\n{%
        else %}\n  5\n{% endif %}\n"
  - condition: template
    value_template: "{% set current_temp_high_now = state_attr('climate.up_hallway_zone_2',
      'target_temp_high') | float %} {% set current_temp_low_now = state_attr('climate.up_hallway_zone_2',
      'target_temp_low') | float %} {% set preset_mode_now = state_attr('climate.up_hallway_zone_2',
      'preset_mode') %} {% set hvac_mode_now = state_attr('climate.up_hallway_zone_2',
      'hvac_mode') %}\n{% set still_hvac_violation = hvac_mode_now != 'heat_cool'
      %} {% set still_severe_high_violation = false %} {% set still_normal_high_violation
      = false %} {% set still_severe_low_violation = false %} {% set still_normal_low_violation
      = false %}\n{% if preset_mode_now == 'manual' %}\n  {% set still_severe_high_violation
      = current_temp_high_now < (effective_temp_high - 3) or current_temp_high_now
      > (effective_temp_high + 3) %}\n  {% set still_severe_low_violation = current_temp_low_now
      < (effective_temp_low - 3) or current_temp_low_now > (effective_temp_low + 3)
      %}\n  {% if not (still_severe_high_violation or still_severe_low_violation)
      %}\n    {% set tolerance_high_min = effective_temp_high - 1 %}\n    {% set tolerance_high_max
      = effective_temp_high + 1 %}\n    {% set tolerance_low_min = effective_temp_low
      - 1 %}\n    {% set tolerance_low_max = effective_temp_low + 1 %}\n    {% set
      still_normal_high_violation = current_temp_high_now < tolerance_high_min or
      current_temp_high_now > tolerance_high_max %}\n    {% set still_normal_low_violation
      = current_temp_low_now < tolerance_low_min or current_temp_low_now > tolerance_low_max
      %}\n  {% endif %}\n{% endif %}\n{{ still_hvac_violation or still_severe_high_violation
      or still_normal_high_violation or still_severe_low_violation or still_normal_low_violation
      }}\n"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ state_attr(''climate.up_hallway_zone_2'', ''hvac_mode'')
          != ''heat_cool'' }}'
      sequence:
      - target:
          entity_id: climate.up_hallway_zone_2
        data:
          hvac_mode: heat_cool
        action: climate.set_hvac_mode
      - data:
          name: Upstairs HVAC Arrester
          message: 'Reverted HVAC mode to heat_cool (was: {{ state_attr(''climate.up_hallway_zone_2'',
            ''hvac_mode'') }})'
        action: logbook.log
  - variables:
      current_temp_high_final: '{{ state_attr(''climate.up_hallway_zone_2'', ''target_temp_high'')
        | float }}'
      current_temp_low_final: '{{ state_attr(''climate.up_hallway_zone_2'', ''target_temp_low'')
        | float }}'
      preset_mode_final: '{{ state_attr(''climate.up_hallway_zone_2'', ''preset_mode'')
        }}'
      is_severe_high_final: "{% if preset_mode_final == 'manual' %}\n  {{ current_temp_high_final
        < (effective_temp_high - 3) or current_temp_high_final > (effective_temp_high
        + 3) }}\n{% else %}\n  false\n{% endif %}\n"
      is_severe_low_final: "{% if preset_mode_final == 'manual' %}\n  {{ current_temp_low_final
        < (effective_temp_low - 3) or current_temp_low_final > (effective_temp_low
        + 3) }}\n{% else %}\n  false\n{% endif %}\n"
      is_normal_high_final: "{% if preset_mode_final == 'manual' and not (is_severe_high_final
        or is_severe_low_final) %}\n  {% set tolerance_min = effective_temp_high -
        1 %}\n  {% set tolerance_max = effective_temp_high + 1 %}\n  {{ current_temp_high_final
        < tolerance_min or current_temp_high_final > tolerance_max }}\n{% else %}\n
        \ false\n{% endif %}\n"
      is_normal_low_final: "{% if preset_mode_final == 'manual' and not (is_severe_high_final
        or is_severe_low_final) %}\n  {% set tolerance_min = effective_temp_low -
        1 %}\n  {% set tolerance_max = effective_temp_low + 1 %}\n  {{ current_temp_low_final
        < tolerance_min or current_temp_low_final > tolerance_max }}\n{% else %}\n
        \ false\n{% endif %}\n"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ is_severe_high_final or is_severe_low_final }}'
      sequence:
      - target:
          entity_id: climate.up_hallway_zone_2
        data:
          preset_mode: '{{ current_time_preset }}'
        action: climate.set_preset_mode
      - data:
          name: Upstairs HVAC Arrester
          message: Severe violation High:{{ current_temp_high_final }}°F Low:{{ current_temp_low_final
            }}°F - Immediately reverted to {{ current_time_preset }} preset
        action: logbook.log
    - conditions:
      - condition: template
        value_template: '{{ is_normal_high_final or is_normal_low_final }}'
      sequence:
      - variables:
          compromise_temp_high: "{% if current_temp_high_final > effective_temp_high
            %}\n  {{ effective_temp_high + 1 }}\n{% elif current_temp_high_final <
            effective_temp_high %}\n  {{ effective_temp_high - 1 }}\n{% else %}\n
            \ {{ current_temp_high_final }}\n{% endif %}\n"
          compromise_temp_low: "{% if current_temp_low_final > effective_temp_low
            %}\n  {{ effective_temp_low + 1 }}\n{% elif current_temp_low_final < effective_temp_low
            %}\n  {{ effective_temp_low - 1 }}\n{% else %}\n  {{ current_temp_low_final
            }}\n{% endif %}\n"
          direction: "{% if current_temp_high_final < effective_temp_high %}\n  more
            aggressive cooling\n{% elif current_temp_high_final > effective_temp_high
            %}\n  less cooling\n{% elif current_temp_low_final > effective_temp_low
            %}\n  more heating\n{% elif current_temp_low_final < effective_temp_low
            %}\n  less heating\n{% else %}\n  temperature adjustment\n{% endif %}\n"
      - target:
          entity_id: climate.up_hallway_zone_2
        data:
          preset_mode: manual
        action: climate.set_preset_mode
      - target:
          entity_id: climate.up_hallway_zone_2
        data:
          target_temp_high: '{{ compromise_temp_high | float }}'
          target_temp_low: '{{ compromise_temp_low | float }}'
        action: climate.set_temperature
      - data:
          name: Upstairs HVAC Arrester
          message: Manual temps {{ current_temp_high_final }}/{{ current_temp_low_final
            }}°F outside tolerance - Compromised to {{ compromise_temp_high }}/{{
            compromise_temp_low }}°F for 30min
        action: logbook.log
      - delay:
          minutes: 30
      - target:
          entity_id: climate.up_hallway_zone_2
        data:
          preset_mode: '{{ current_time_preset }}'
        action: climate.set_preset_mode
      - data:
          name: Upstairs HVAC Arrester
          message: 30-minute compromise ended - Reverted to {{ current_time_preset
            }} preset
        action: logbook.log
  variables:
    current_time_preset: "{% set hour = now().hour %} {% if hour >= 6 and hour < 8
      %}\n  wake\n{% elif hour >= 8 and hour < 17 %}\n  away\n{% elif hour >= 17 and
      hour < 22 %}\n  home\n{% elif hour >= 22 or hour < 6 %}\n  sleep\n{% else %}\n
      \ home\n{% endif %}\n"
    effective_temp_high: "{% set hour = now().hour %} {% if hour >= 8 and hour < 17
      %}\n  80\n{% else %}\n  77\n{% endif %}\n"
    effective_temp_low: "{% set hour = now().hour %} {% if hour >= 8 and hour < 17
      %}\n  60\n{% else %}\n  67\n{% endif %}\n"
    current_temp_high: '{{ state_attr(''climate.up_hallway_zone_2'', ''target_temp_high'')
      | float }}'
    current_temp_low: '{{ state_attr(''climate.up_hallway_zone_2'', ''target_temp_low'')
      | float }}'
    preset_mode: '{{ state_attr(''climate.up_hallway_zone_2'', ''preset_mode'') }}'
    hvac_mode: '{{ state_attr(''climate.up_hallway_zone_2'', ''hvac_mode'') }}'
    is_severe_high_violation: "{% if preset_mode == 'manual' %}\n  {{ current_temp_high
      < (effective_temp_high - 3) or current_temp_high > (effective_temp_high + 3)
      }}\n{% else %}\n  false\n{% endif %}\n"
    is_normal_high_violation: "{% if preset_mode == 'manual' %}\n  {% set tolerance_min
      = effective_temp_high - 1 %}\n  {% set tolerance_max = effective_temp_high +
      1 %}\n  {{ current_temp_high < tolerance_min or current_temp_high > tolerance_max
      }}\n{% else %}\n  false\n{% endif %}\n"
    is_severe_low_violation: "{% if preset_mode == 'manual' %}\n  {{ current_temp_low
      < (effective_temp_low - 3) or current_temp_low > (effective_temp_low + 3) }}\n{%
      else %}\n  false\n{% endif %}\n"
    is_normal_low_violation: "{% if preset_mode == 'manual' %}\n  {% set tolerance_min
      = effective_temp_low - 1 %}\n  {% set tolerance_max = effective_temp_low + 1
      %}\n  {{ current_temp_low < tolerance_min or current_temp_low > tolerance_max
      }}\n{% else %}\n  false\n{% endif %}\n"
    is_hvac_mode_violation: '{{ hvac_mode != ''heat_cool'' }}'
  mode: restart
- id: '1757888743591'
  alias: Back Hallway - HVAC Arrester v10
  description: Manage manual temperature overrides with ±1°F tolerance from preset
