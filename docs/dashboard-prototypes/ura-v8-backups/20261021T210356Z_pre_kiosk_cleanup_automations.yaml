- id: '1766774718198'
  alias: Stair Closet Night Light Automation
  description: 'Stair closet motion-activated lighting with security notifications.


    [Updated 2026-03-09: color_temp mireds -> color_temp_kelvin for HA 2026.3]

    [Updated 2026-03-14: Removed Pushover notifications]'
