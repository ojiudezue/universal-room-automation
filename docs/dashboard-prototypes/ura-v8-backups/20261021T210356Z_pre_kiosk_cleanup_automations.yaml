    full-auto 2s/5min WITH overhead vanity area light, Ezinne manual-off 15min), makeup
    light (30min timeout), main lights (15min coordinated), night light (adaptive
    lux<40, 20:00-06:30, 3min timeout), and humidity fan (15% spike in 15min OR >70%
    absolute, runs until -8% drop or 45min max, sleep hours 22:00-06:00 disabled,
