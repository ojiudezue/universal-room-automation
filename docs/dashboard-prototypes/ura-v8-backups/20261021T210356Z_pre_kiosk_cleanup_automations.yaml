- id: '1746471781950'
  alias: Bathroom - Master Toilet Automation
  triggers:
  - entity_id: binary_sensor.rgbw_motion_lux_3rdr_wifi_matter_mastertoilet_occupancy
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.rgbw_motion_lux_3rdr_wifi_matter_mastertoilet_occupancy
        state: 'on'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ is_night }}'
          sequence:
          - target:
              entity_id: light.rgbw_motion_lux_3rdr_wifi_matter_mastertoilet
            data:
              brightness_pct: 40
              rgb_color:
              - 255
              - 30
              - 10
            action: light.turn_on
        - conditions:
          - condition: template
            value_template: '{{ is_day }}'
          - condition: template
            value_template: '{{ not overhead_manual_off }}'
          sequence:
          - target:
              entity_id: switch.switch_sonoffmini4rm_matter_mastertoilet
            action: switch.turn_on
            data: {}
      - delay: 00:00:20
      - condition: state
        entity_id: binary_sensor.rgbw_motion_lux_3rdr_wifi_matter_mastertoilet_occupancy
        state: 'on'
      - target:
          entity_id: switch.switch_sonoffm4rm_matter_mastertoiletfan
        action: switch.turn_on
        data: {}
    - conditions:
      - condition: state
        entity_id: binary_sensor.rgbw_motion_lux_3rdr_wifi_matter_mastertoilet_occupancy
        state: 'off'
      sequence:
      - delay: 00:05:30
      - condition: state
        entity_id: binary_sensor.rgbw_motion_lux_3rdr_wifi_matter_mastertoilet_occupancy
        state: 'off'
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ is_night }}'
          sequence:
          - target:
              entity_id: light.rgbw_motion_lux_3rdr_wifi_matter_mastertoilet
            action: light.turn_off
            data: {}
          - target:
              entity_id: switch.switch_sonoffmini4rm_matter_mastertoilet
            action: switch.turn_off
            data: {}
        - conditions:
          - condition: template
            value_template: '{{ is_day }}'
          - condition: template
            value_template: '{{ not overhead_manual_off }}'
          sequence:
          - target:
              entity_id: switch.switch_sonoffmini4rm_matter_mastertoilet
            action: switch.turn_off
            data: {}
      - delay:
          seconds: "{% set linger = (stay_duration * 2) %} {% if linger > 600 %}\n
            \ 600\n{% else %}\n  {{ linger }}\n{% endif %}\n"
      - target:
          entity_id: switch.switch_sonoffm4rm_matter_mastertoiletfan
        action: switch.turn_off
        data: {}
  mode: restart
  variables:
    night_start: '22:00:00'
    night_end: 08:00:00
    now_time: '{{ now().strftime(''%H:%M:%S'') }}'
    is_night: '{{ now_time >= night_start or now_time <= night_end }}'
    is_day: '{{ not (now_time >= night_start or now_time <= night_end) }}'
    stay_duration: '{{ (as_timestamp(now()) - as_timestamp(state_attr(''automation.bathroom_-_light_and_fan_combo'',
      ''last_triggered'') or now())) | int }}'
    overhead_manual_off: '{{ (now().timestamp() - (state_attr(''switch.switch_sonoffmini4rm_matter_mastertoilet'',
      ''last_changed'') | as_timestamp(0))) < 900 and is_state(''sswitch.switch_sonoffmini4rm_matter_mastertoilet'',
      ''off'') }}'
- id: '1747175646517'
  alias: All Outside Lights - Sunset to Sunrise with Time Backup
  description: Turn on all external lights at sunset and off at sunrise with time-based
    backup. Use light.light.outside_lights group
  triggers:
  - id: sunset_on
    event: sunset
    offset: -00:05:00
    trigger: sun
  - id: sunrise_off
    event: sunrise
    offset: 00:05:00
    trigger: sun
  - id: evening_backup
    at: '19:30:00'
    trigger: time
  - id: morning_backup
    at: 07:30:00
    trigger: time
  conditions: []
  actions:
  - choose:
    - conditions:
      - or:
        - condition: trigger
          id: sunset_on
        - and:
          - condition: trigger
            id: evening_backup
          - condition: sun
            after: sunset
      sequence:
      - target:
          entity_id: light.outside_lights
        action: light.turn_on
        data: {}
      - data:
          message: 'Outside lights group turned ON (trigger: {{ trigger.id }})'
          level: info
        action: system_log.write
      - action: notify.mobile_app_phalanxiphone15promax
        metadata: {}
        data:
          message: Outside Light turned on
          title: Perimeter Automation
    - conditions:
      - or:
        - condition: trigger
          id: sunrise_off
        - and:
          - condition: trigger
            id: morning_backup
          - condition: sun
            before: sunset
      sequence:
      - target:
          entity_id: light.outside_lights
        action: light.turn_off
        data: {}
      - data:
          message: 'Outside lights group turned OFF (trigger: {{ trigger.id }})'
          level: info
        action: system_log.write
      - action: notify.mobile_app_phalanxiphone15promax
        metadata: {}
        data:
          message: Outside lights turned off
          title: Perimeter Automation
  mode: single
