    above: 30
    for: 00:05:00
    id: start_dryer
  - platform: numeric_state
    entity_id: sensor.washer_1_power_minute_average
    below: 3
    for: 00:03:00
    id: stop_washer1
  - platform: numeric_state
    entity_id: sensor.washer_2_power_minute_average
    below: 3
    for: 00:03:00
    id: stop_washer2
  - platform: numeric_state
    entity_id: sensor.span_panel_dryer_power
    below: 3
    for: 00:03:00
    id: stop_dryer
  - platform: state
    entity_id: binary_sensor.laundry_closet_occupied
    to: 'on'
    id: clear
  - platform: state
    entity_id: input_text.wallpanel_alert_laundry
    for: 03:00:00
    id: clear
