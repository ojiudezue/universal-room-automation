- id: wallpanel_fleet_wake
  alias: Wallpanel Fleet — wake on URA occupancy
  description: Any room's occupancy -> that room's panel wakes, brightness by house
    state (sleep=dim 15%). Proximity is app-local. Suppressed only in away/vacation.
  triggers:
  - platform: state
    entity_id:
    - binary_sensor.breakfast_nook_occupied
    - binary_sensor.foyer_fisheye_person_occupancy
    - binary_sensor.kitchen_occupied
    - binary_sensor.master_bedroom_occupied
    - binary_sensor.media_room_occupied
    - binary_sensor.occupancy_lux_temp_humidity_hobeian_entry_presence
    - binary_sensor.study_a_occupied
    - binary_sensor.study_b_occupied
    - binary_sensor.upstairs_hallway_occupied
    to: 'on'
  conditions:
  - condition: template
    value_template: '{{ states(''sensor.ura_coordinator_manager_house_state'') not
      in [''away'',''vacation''] }}'
  actions:
  - variables:
      lights: '{% set panels = [{"sensors": ["binary_sensor.master_bedroom_occupied"],
        "lights": ["light.master_panel_screen"]}, {"sensors": ["binary_sensor.study_a_occupied"],
        "lights": ["light.study_a_panel_screen"]}, {"sensors": ["binary_sensor.study_b_occupied"],
        "lights": ["light.study_b_panel_screen"]}, {"sensors": ["binary_sensor.upstairs_hallway_occupied"],
        "lights": ["light.up_hallway_panel_screen"]}, {"sensors": ["binary_sensor.media_room_occupied"],
        "lights": ["light.media_room_panel_screen"]}, {"sensors": ["binary_sensor.kitchen_occupied",
        "binary_sensor.breakfast_nook_occupied"], "lights": ["light.kitchen_panel_screen"]},
        {"sensors": ["binary_sensor.occupancy_lux_temp_humidity_hobeian_entry_presence",
        "binary_sensor.foyer_fisheye_person_occupancy"], "lights": ["light.entry_way_panel_screen"]}]
        %}{% set trg = trigger.to_state.entity_id %}{% set ns = namespace(x=[]) %}{%
        for p in panels %}{% if trg in p.sensors %}{% set ns.x = p.lights %}{% endif
        %}{% endfor %}{{ ns.x }}'
      bri: '{% set hs = states(''sensor.ura_coordinator_manager_house_state'') %}{{
        {''home_day'':100,''home_evening'':60,''home_night'':15,''sleep'':15,''arriving'':80,''waking'':70,''guest'':80}.get(hs,70)
        }}'
  - condition: template
    value_template: '{{ lights | count > 0 }}'
  - target:
      entity_id: '{{ lights }}'
    data:
      brightness_pct: '{{ bri | int }}'
    action: light.turn_on
  mode: parallel
  max: 12
- id: wallpanel_fleet_sleep_after_grace
  alias: Wallpanel Fleet — screen off after grace
  description: A panel sleeps grace-minutes after ALL its occupancy sensors clear
    (5 min at night). parallel so each room is independent.
  triggers:
  - platform: state
    entity_id:
    - binary_sensor.breakfast_nook_occupied
    - binary_sensor.foyer_fisheye_person_occupancy
    - binary_sensor.kitchen_occupied
    - binary_sensor.master_bedroom_occupied
    - binary_sensor.media_room_occupied
    - binary_sensor.occupancy_lux_temp_humidity_hobeian_entry_presence
    - binary_sensor.study_a_occupied
    - binary_sensor.study_b_occupied
    - binary_sensor.upstairs_hallway_occupied
    to: 'off'
  actions:
  - variables:
      plights: '{% set panels = [{"sensors": ["binary_sensor.master_bedroom_occupied"],
        "lights": ["light.master_panel_screen"]}, {"sensors": ["binary_sensor.study_a_occupied"],
        "lights": ["light.study_a_panel_screen"]}, {"sensors": ["binary_sensor.study_b_occupied"],
        "lights": ["light.study_b_panel_screen"]}, {"sensors": ["binary_sensor.upstairs_hallway_occupied"],
        "lights": ["light.up_hallway_panel_screen"]}, {"sensors": ["binary_sensor.media_room_occupied"],
        "lights": ["light.media_room_panel_screen"]}, {"sensors": ["binary_sensor.kitchen_occupied",
        "binary_sensor.breakfast_nook_occupied"], "lights": ["light.kitchen_panel_screen"]},
        {"sensors": ["binary_sensor.occupancy_lux_temp_humidity_hobeian_entry_presence",
        "binary_sensor.foyer_fisheye_person_occupancy"], "lights": ["light.entry_way_panel_screen"]}]
        %}{% set trg = trigger.to_state.entity_id %}{% set ns = namespace(x=[]) %}{%
        for p in panels %}{% if trg in p.sensors %}{% set ns.x = p.lights %}{% endif
        %}{% endfor %}{{ ns.x }}'
      psensors: '{% set panels = [{"sensors": ["binary_sensor.master_bedroom_occupied"],
        "lights": ["light.master_panel_screen"]}, {"sensors": ["binary_sensor.study_a_occupied"],
        "lights": ["light.study_a_panel_screen"]}, {"sensors": ["binary_sensor.study_b_occupied"],
        "lights": ["light.study_b_panel_screen"]}, {"sensors": ["binary_sensor.upstairs_hallway_occupied"],
        "lights": ["light.up_hallway_panel_screen"]}, {"sensors": ["binary_sensor.media_room_occupied"],
        "lights": ["light.media_room_panel_screen"]}, {"sensors": ["binary_sensor.kitchen_occupied",
        "binary_sensor.breakfast_nook_occupied"], "lights": ["light.kitchen_panel_screen"]},
        {"sensors": ["binary_sensor.occupancy_lux_temp_humidity_hobeian_entry_presence",
        "binary_sensor.foyer_fisheye_person_occupancy"], "lights": ["light.entry_way_panel_screen"]}]
        %}{% set trg = trigger.to_state.entity_id %}{% set ns = namespace(x=[]) %}{%
        for p in panels %}{% if trg in p.sensors %}{% set ns.x = p.sensors %}{% endif
        %}{% endfor %}{{ ns.x }}'
      grace: '{% set hs = states(''sensor.ura_coordinator_manager_house_state'') %}{{
        5 if hs==''home_night'' else states(''input_number.wallpanel_master_grace_min'')|int(15)
        }}'
  - condition: template
    value_template: '{{ plights | count > 0 }}'
  - delay:
      minutes: '{{ grace | int }}'
  - condition: template
    value_template: '{{ (psensors | map(''states'') | select(''eq'',''on'') | list
      | count) == 0 }}'
  - target:
      entity_id: '{{ plights }}'
    action: light.turn_off
  mode: parallel
  max: 12
- id: wallpanel_fleet_force_off_secure
  alias: Wallpanel Fleet — force screen off (away/vacation/sleep)
  description: Force ALL panel screens off on entering away/vacation/sleep, regardless
    of occupancy. 3-min debounce.
  triggers:
  - platform: state
