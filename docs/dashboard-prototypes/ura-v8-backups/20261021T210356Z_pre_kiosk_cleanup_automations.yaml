- id: '1767057543693'
  alias: Garage Hallway Adaptive Lighting
  description: 'Intelligent lighting for garage-to-kitchen traversal with bidirectional
    support. Entry (door): outdoor light check only. Exit (motion): triple check (indoor<3lux
    + outdoor<400lux + after sunset) prevents daytime activation. Motion also blocked
    midnight-6AM for night light.'
  triggers:
  - id: door_entry
    to: 'on'
    trigger: state
    entity_id: binary_sensor.openclose_zigbee_garageadoor1_contact
  - id: hallway_motion
    to: 'on'
    trigger: state
    entity_id: binary_sensor.rgbw_motion_lux_3rdr_zigbee_garagehallway_occupancy_2
  conditions:
  - condition: template
    value_template: "{% if trigger.id == 'door_entry' %}\n  {{ states('sensor.phalanxmadrone_illuminance')|float(9999)
      < 400 }}\n{% elif trigger.id == 'hallway_motion' %}\n  {{ states('sensor.rgbw_motion_lux_3rdr_zigbee_garagehallway_illuminance_2')|float(9999)
      < 3 \n     and states('sensor.phalanxmadrone_illuminance')|float(9999) < 400
      \n     and state_attr('sun.sun', 'elevation') < 0 }}\n{% else %}\n  false\n{%
      endif %}"
  - state: 'off'
    condition: state
    entity_id: light.dimmer_tapo_wifi_matter_hallwaycabinet
  actions:
  - choose:
    - sequence:
      - stop: Motion trigger after midnight - night light sufficient
      conditions:
      - id: hallway_motion
        condition: trigger
      - condition: template
        value_template: '{{ now().hour >= 24 or now().hour < 6 }}'
  - variables:
      brightness_pct: "{% set hour = now().hour %}\n{% if hour >= 22 or hour < 5 %}\n
        \ 30\n{% elif hour >= 18 %}\n  60\n{% else %}\n  80\n{% endif %}"
      light_start_time: '{{ now() }}'
      triggered_by_motion: '{{ trigger.id == ''hallway_motion'' }}'
  - data:
      brightness_pct: '{{ brightness_pct }}'
    action: light.turn_on
    target:
      entity_id: light.dimmer_tapo_wifi_matter_hallwaycabinet
  - alias: Smart Auto-Off - Multiple Exit Strategies
    parallel:
    - alias: Strategy A - Standard Motion Clear Timeout
      sequence:
      - timeout:
          minutes: 3
        wait_for_trigger:
        - to: 'off'
          for:
            seconds: 45
          trigger: state
          entity_id: binary_sensor.rgbw_motion_lux_3rdr_zigbee_garagehallway_occupancy_2
      - action: light.turn_off
        target:
          entity_id: light.dimmer_tapo_wifi_matter_hallwaycabinet
    - alias: Strategy B - Quick Exit Detection (Motion->Door->Clear)
      sequence:
      - condition: template
        value_template: '{{ triggered_by_motion }}'
      - timeout:
          seconds: 30
        wait_for_trigger:
        - to: 'on'
          trigger: state
          entity_id: binary_sensor.openclose_zigbee_garageadoor1_contact
      - condition: template
        value_template: '{{ wait.trigger is not none }}'
      - timeout:
          seconds: 40
        wait_for_trigger:
        - to: 'off'
          trigger: state
          entity_id: binary_sensor.rgbw_motion_lux_3rdr_zigbee_garagehallway_occupancy_2
      - condition: template
        value_template: '{{ wait.trigger is not none }}'
      - action: light.turn_off
        target:
          entity_id: light.dimmer_tapo_wifi_matter_hallwaycabinet
    - alias: Strategy C - Garage Entry (Exit Only - Motion Triggered)
      sequence:
      - condition: template
        value_template: '{{ triggered_by_motion }}'
      - timeout:
          minutes: 3
        wait_for_trigger:
        - to: open
          from: closed
          trigger: state
          entity_id: cover.konnected_f0f5bd523b00_garage_door
        - to: closed
          from: open
          trigger: state
          entity_id: cover.konnected_f0f5bd523b00_garage_door
      - condition: template
        value_template: '{{ wait.trigger is not none }}'
      - action: light.turn_off
        target:
          entity_id: light.dimmer_tapo_wifi_matter_hallwaycabinet
  mode: restart
