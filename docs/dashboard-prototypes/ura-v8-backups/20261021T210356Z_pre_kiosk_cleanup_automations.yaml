- id: '1751569280793'
  alias: Smart Laundry Room Light Control
  description: 'Controls laundry room lighting based on time/lux and manages fan based
    on  washer/dryer cycles with automatic turn-off sequences and sparse notifications


    Complete Feature Summary:

    Smart Lighting:


    Night (11 PM-7 AM): Warm orange night light only

    Evening (9-11 PM): Under cabinet + warm night light (+overhead if very dark)

    Day (7 AM-9 PM): Lux-based lighting (high/medium/low scenarios)

    Auto turn-off: 8-minute timeout, graceful sequence


    Fan Management:


    During cycles: Auto-on when any machine runs

    Post-cycle: 60 minutes additional runtime

    Scheduled: 15-minute cycles at 6 AM, 2 PM, 10 PM

    4-hour failsafe: Automatic shutoff for safety

    Sensor failure handling: Keeps fan on when sensors offline


    Minimal Notifications:


    Sensor offline: Max once per 4 hours

    All cycles complete: Max once per 2 hours

    Critical failsafe: Only when 4-hour limit reached

    Normal operation: Silent (0 notifications)'
  triggers:
  - entity_id: binary_sensor.rgbw_lux_motion_3rdr_wifi_matter_laundry_occupancy
    to: 'on'
    id: motion_on
    trigger: state
  - entity_id: binary_sensor.rgbw_lux_motion_3rdr_wifi_matter_laundry_occupancy
    to: 'off'
    for:
      minutes: 8
    id: motion_off
    trigger: state
  - entity_id:
    - sensor.washtower_one_current_status
    - sensor.washtower_two_current_status
    - sensor.washer_current_status
    - sensor.washer1_current_status
    to: 'on'
    id: cycle_started
    trigger: state
  - entity_id:
    - sensor.washtower_one_current_status
    - sensor.washtower_two_current_status
    - sensor.washer_current_status
    - sensor.washer1_current_status
    to: 'off'
    id: cycle_ended
    trigger: state
  - at: 06:00:00
    id: morning_fan_cycle
    trigger: time
  - at: '14:00:00'
    id: afternoon_fan_cycle
    trigger: time
  - at: '22:00:00'
    id: evening_fan_cycle
    trigger: time
  - entity_id: switch.switch_shelly2pmgen3_wifi_laundry2_sw2
    to: 'on'
    for:
      hours: 2
    id: fan_max_runtime
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: motion_on
      sequence:
      - choose:
        - conditions:
          - condition: time
            after: '23:00:00'
          - condition: time
            before: 07:00:00
          sequence:
          - target:
              entity_id: light.rgbw_lux_motion_3rdr_wifi_matter_laundry
            data:
              brightness_pct: 25
              rgb_color:
              - 255
              - 80
              - 20
              transition: 2
            action: light.turn_on
        - conditions:
          - condition: time
            after: '21:00:00'
            before: '23:00:00'
          sequence:
          - target:
              entity_id: switch.switch_shelly2pmgen3_wifi_laundry1_sw2
            action: switch.turn_on
            data: {}
          - target:
              entity_id: light.rgbw_lux_motion_3rdr_wifi_matter_laundry
            data:
              brightness_pct: 40
              rgb_color:
              - 255
              - 180
              - 100
              transition: 1
            action: light.turn_on
          - if:
            - condition: numeric_state
              entity_id: sensor.rgbw_lux_motion_3rdr_wifi_matter_laundry_illuminance
              below: 10
            then:
            - target:
                entity_id: switch.switch_shelly2pmgen3_wifi_laundry1_sw1
              action: switch.turn_on
              data: {}
        - conditions:
          - condition: time
            after: 07:00:00
            before: '21:00:00'
          sequence:
          - variables:
              current_lux: '{{ states(''sensor.rgbw_lux_motion_3rdr_wifi_matter_laundry_illuminance'')
                | float(50) }}'
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ current_lux > 50 }}'
              sequence:
              - target:
                  entity_id: switch.switch_shelly2pmgen3_wifi_laundry1_sw2
                action: switch.turn_on
                data: {}
              - target:
                  entity_id: light.rgbw_lux_motion_3rdr_wifi_matter_laundry
                data:
                  brightness_pct: 20
                  rgb_color:
                  - 200
                  - 220
                  - 255
                  transition: 1
                action: light.turn_on
            - conditions:
              - condition: template
                value_template: '{{ current_lux >= 20 and current_lux <= 50 }}'
              sequence:
              - target:
                  entity_id:
                  - switch.switch_shelly2pmgen3_wifi_laundry1_sw1
                  - switch.switch_shelly2pmgen3_wifi_laundry1_sw2
                action: switch.turn_on
                data: {}
              - target:
                  entity_id: light.rgbw_lux_motion_3rdr_wifi_matter_laundry
                data:
                  brightness_pct: 30
                  rgb_color:
                  - 255
                  - 255
                  - 255
                  transition: 1
                action: light.turn_on
            default:
            - target:
                entity_id:
                - switch.switch_shelly2pmgen3_wifi_laundry1_sw1
                - switch.switch_shelly2pmgen3_wifi_laundry1_sw2
              action: switch.turn_on
              data: {}
            - target:
                entity_id: light.rgbw_lux_motion_3rdr_wifi_matter_laundry
              data:
                brightness_pct: 50
                rgb_color:
                - 255
                - 255
                - 255
                transition: 1
              action: light.turn_on
      - if:
        - condition: template
          value_template: '{% set w1 = states(''sensor.washtower_one_current_status'')
            %} {% set w2 = states(''sensor.washtower_two_current_status'') %} {% set
            w3 = states(''sensor.washer_current_status'') %} {% set w4 = states(''sensor.washer1_current_status'')
            %} {% set any_on = w1 == ''on'' or w2 == ''on'' or w3 == ''on'' or w4
            == ''on'' %} {% set any_unavailable = w1 == ''unavailable'' or w2 == ''unavailable''
            or w3 == ''unavailable'' or w4 == ''unavailable'' %} {{ any_on or any_unavailable
            }}

            '
        then:
        - target:
            entity_id: switch.switch_shelly2pmgen3_wifi_laundry2_sw2
          action: switch.turn_on
          data: {}
        - if:
          - condition: template
            value_template: '{% set w1 = states(''sensor.washtower_one_current_status'')
              %} {% set w2 = states(''sensor.washtower_two_current_status'') %} {%
              set w3 = states(''sensor.washer_current_status'') %} {% set w4 = states(''sensor.washer1_current_status'')
              %} {% set any_unavailable = w1 == ''unavailable'' or w2 == ''unavailable''
              or w3 == ''unavailable'' or w4 == ''unavailable'' %} {% set last_notif
              = states(''input_datetime.last_laundry_debug_notification'') %} {% set
              can_notify = last_notif == ''unknown'' or (now() - strptime(last_notif,
              ''%Y-%m-%d %H:%M:%S'')).total_seconds() > 14400 %} {{ any_unavailable
              and can_notify }}

              '
          then:
          - target:
              entity_id: input_datetime.last_laundry_debug_notification
            data:
              datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
            action: input_datetime.set_datetime
          - data:
              title: Laundry Sensors Offline
              message: Some sensors unavailable - fan on for safety
            action: notify.mobile_app_phalanxiphone15promax
    - conditions:
      - condition: trigger
        id: motion_off
      sequence:
      - target:
          entity_id: light.rgbw_lux_motion_3rdr_wifi_matter_laundry
        data:
          transition: 3
        action: light.turn_off
      - delay: 00:00:02
      - target:
          entity_id: switch.switch_shelly2pmgen3_wifi_laundry1_sw2
        action: switch.turn_off
        data: {}
      - delay: 00:00:01
      - target:
          entity_id: switch.switch_shelly2pmgen3_wifi_laundry1_sw1
        action: switch.turn_off
        data: {}
      - delay: 00:00:01
      - target:
          entity_id: switch.switch_shelly2pmgen3_wifi_laundry2_sw1
        action: switch.turn_off
        data: {}
      - if:
        - condition: template
          value_template: '{% set w1 = states(''sensor.washtower_one_current_status'')
            %} {% set w2 = states(''sensor.washtower_two_current_status'') %} {% set
            w3 = states(''sensor.washer_current_status'') %} {% set w4 = states(''sensor.washer1_current_status'')
            %} {% set all_off = w1 == ''off'' and w2 == ''off'' and w3 == ''off''
            and w4 == ''off'' %} {% set any_unavailable = w1 == ''unavailable'' or
            w2 == ''unavailable'' or w3 == ''unavailable'' or w4 == ''unavailable''
            %} {{ all_off and not any_unavailable }}

            '
        then:
        - delay: 00:00:05
        - target:
            entity_id: switch.switch_shelly2pmgen3_wifi_laundry2_sw2
          action: switch.turn_off
          data: {}
        else:
        - delay: 00:00:01
    - conditions:
      - condition: trigger
        id: cycle_started
      sequence:
      - target:
          entity_id: switch.switch_shelly2pmgen3_wifi_laundry2_sw2
        action: switch.turn_on
        data: {}
    - conditions:
      - condition: trigger
        id: cycle_ended
      sequence:
      - target:
          entity_id: switch.switch_shelly2pmgen3_wifi_laundry2_sw2
        action: switch.turn_on
        data: {}
      - delay: 01:00:00
      - if:
        - condition: template
          value_template: '{% set w1 = states(''sensor.washtower_one_current_status'')
            %} {% set w2 = states(''sensor.washtower_two_current_status'') %} {% set
            w3 = states(''sensor.washer_current_status'') %} {% set w4 = states(''sensor.washer1_current_status'')
            %} {% set all_off = w1 == ''off'' and w2 == ''off'' and w3 == ''off''
            and w4 == ''off'' %} {% set any_unavailable = w1 == ''unavailable'' or
            w2 == ''unavailable'' or w3 == ''unavailable'' or w4 == ''unavailable''
            %} {% set no_motion = is_state(''binary_sensor.rgbw_lux_motion_3rdr_wifi_matter_laundry_occupancy'',
            ''off'') %} {{ all_off and not any_unavailable and no_motion }}

            '
        then:
        - target:
            entity_id: switch.switch_shelly2pmgen3_wifi_laundry2_sw2
          action: switch.turn_off
          data: {}
        else:
        - delay: 00:00:01
      - if:
        - condition: template
          value_template: '{% set w1 = states(''sensor.washtower_one_current_status'')
            %} {% set w2 = states(''sensor.washtower_two_current_status'') %} {% set
            w3 = states(''sensor.washer_current_status'') %} {% set w4 = states(''sensor.washer1_current_status'')
            %} {% set all_off = w1 == ''off'' and w2 == ''off'' and w3 == ''off''
            and w4 == ''off'' %} {% set last_notif = states(''input_datetime.last_laundry_debug_notification'')
            %} {% set can_notify = last_notif == ''unknown'' or (now() - strptime(last_notif,
            ''%Y-%m-%d %H:%M:%S'')).total_seconds() > 7200 %} {{ all_off and can_notify
            }}

            '
        then:
        - target:
            entity_id: input_datetime.last_laundry_debug_notification
          data:
            datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
          action: input_datetime.set_datetime
        - data:
            title: All Laundry Complete
            message: All cycles finished - fan running 60 min
          action: notify.mobile_app_phalanxiphone15promax
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: morning_fan_cycle
        - condition: trigger
          id: afternoon_fan_cycle
        - condition: trigger
          id: evening_fan_cycle
      sequence:
      - if:
        - condition: template
          value_template: '{% set no_motion = is_state(''binary_sensor.rgbw_lux_motion_3rdr_wifi_matter_laundry_occupancy'',
            ''off'') %} {% set w1 = states(''sensor.washtower_one_current_status'')
            %} {% set w2 = states(''sensor.washtower_two_current_status'') %} {% set
            w3 = states(''sensor.washer_current_status'') %} {% set w4 = states(''sensor.washer1_current_status'')
            %} {% set no_active_cycles = w1 == ''off'' and w2 == ''off'' and w3 ==
            ''off'' and w4 == ''off'' %} {% set any_unavailable = w1 == ''unavailable''
            or w2 == ''unavailable'' or w3 == ''unavailable'' or w4 == ''unavailable''
            %} {{ no_motion and (no_active_cycles or any_unavailable) }}

            '
        then:
        - target:
            entity_id: switch.switch_shelly2pmgen3_wifi_laundry2_sw2
          action: switch.turn_on
          data: {}
        - delay: 00:15:00
        - if:
          - condition: template
            value_template: '{% set w1 = states(''sensor.washtower_one_current_status'')
              %} {% set w2 = states(''sensor.washtower_two_current_status'') %} {%
              set w3 = states(''sensor.washer_current_status'') %} {% set w4 = states(''sensor.washer1_current_status'')
              %} {% set all_off = w1 == ''off'' and w2 == ''off'' and w3 == ''off''
              and w4 == ''off'' %} {% set all_available = w1 != ''unavailable'' and
              w2 != ''unavailable'' and w3 != ''unavailable'' and w4 != ''unavailable''
              %} {{ all_off and all_available }}

              '
          then:
          - target:
              entity_id: switch.switch_shelly2pmgen3_wifi_laundry2_sw2
            action: switch.turn_off
            data: {}
          else:
          - delay: 00:00:01
    - conditions:
      - condition: trigger
        id: fan_max_runtime
      sequence:
      - target:
          entity_id: switch.switch_shelly2pmgen3_wifi_laundry2_sw2
        action: switch.turn_off
        data: {}
      - data:
          title: ⚠️ Laundry Fan Auto-Stopped
          message: 'Fan ran for 2 hours continuously and was auto-stopped for safety.
            Sensor status:  W1: {{ states(''sensor.washtower_one_current_status'')
            }},  W2: {{ states(''sensor.washtower_two_current_status'') }},  W3: {{
            states(''sensor.washer_current_status'') }},  W4: {{ states(''sensor.washer1_current_status'')
            }}

            '
          data:
            priority: high
        action: notify.mobile_app_phalanxiphone15promax
  variables:
    overhead_lights: switch.switch_shelly2pmgen3_wifi_laundry1_sw1
    under_cabinet_lights: switch.switch_shelly2pmgen3_wifi_laundry1_sw2
    closet_lights: switch.switch_shelly2pmgen3_wifi_laundry2_sw1
    exhaust_fan: switch.switch_shelly2pmgen3_wifi_laundry2_sw2
