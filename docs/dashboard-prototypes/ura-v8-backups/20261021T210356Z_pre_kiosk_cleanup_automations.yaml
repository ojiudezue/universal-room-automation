- id: '1753410739607'
  alias: Landscape Lighting
  description: 'Sunset+30 min to 01:00 landscape lights; entry spots until sunrise.
    LIFX via Matter: 62 vs 398 dropouts over 10 days compared with the native LIFX
    path (measured 2026-10-13). Retries up to 5x for Wi-Fi flakiness. Replaces Landscape
