    platform: state
    entity_id: binary_sensor.outlet_lux_pir_mmwave_temp_voc_pressure_invisoutet_mqtt_masterbath_occupancy
  - id: night_light_on
    to: 'on'
    platform: state
    entity_id:
    - binary_sensor.outlet_lux_pir_mmwave_temp_voc_pressure_invisoutet_mqtt_masterbath_occupancy
