      - light.wall_panel_entry_kiosk_wall_panel_entry_kiosk_display
      - light.wall_panel_kitchen_kiosk_wall_panel_kitchen_kiosk_display
      - light.wall_panel_studyb_kiosk_wall_panel_studyb_kiosk_display
    action: light.turn_off
  mode: single
- id: frigate2_recording_tripwire
  alias: Frigate2 Recording Tripwire (FRIGATE-RETIRE-1)
  description: Pages WhatsApp if Frigate2's Unraid recording share stops changing
    (writes frozen) or its usage sensor goes unavailable. Frigate2 is the sole recorder
    during the Frigate-1 retirement window. Frozen-value detection must be polled
    (a frozen sensor emits no state changes), hence the time_pattern trigger; mode
    single + the 6h bar keeps it to one page per episode.
  triggers:
  - trigger: time_pattern
    minutes: /30
    id: frozen_poll
  - trigger: state
    entity_id: sensor.phalanxu8_423_share_frigate2_usage
    to: unavailable
    for:
      minutes: 30
    id: gone
  conditions:
  - condition: or
    conditions:
    - condition: trigger
      id: gone
    - condition: and
      conditions:
      - condition: trigger
        id: frozen_poll
      - '{{ states(''sensor.phalanxu8_423_share_frigate2_usage'') not in [''unavailable'',''unknown'']
        and (now() - states.sensor.phalanxu8_423_share_frigate2_usage.last_changed).total_seconds()
        > 21600 }}'
  actions:
  - action: whatsapp.send_message
    data:
      number: '14258299520'
      message: ⚠️ *Frigate2 recording tripwire* — {{ 'usage sensor unavailable 30min'
        if trigger.id == 'gone' else 'share usage frozen >6h (writes stopped?)' }}.
        Frigate2 is the sole recorder during Frigate-1 retirement — check /tmp/cache
        and the Unraid CIFS mount on 192.168.13.18.
  mode: single
  max_exceeded: silent
- id: '1789357400673'
  alias: Dining Room Night Light Automation
  description: 'The automation will help you spot unexpected activity while providing
    perfect Dining room lighting for daily use. The security notifications will be
    most valuable during those evening/night hours when you''d want to know about
    any unexpected movement!


    Lighting Logic:


    Night (10pm-6am): Red tones at 60% (10pm-2am) or 40% (2am-6am)

    Dark daytime: Cool white, brighter when darker (50-80% based on lux)

    Smart thresholds: <20 lux at night, <30 lux during day

    2-minute timeout with smooth 1-2 second transitions


    Security Notifications:


    Active 4pm-6am daily - covers evening through early morning

    Contextual info: Shows lux level and time indicator

    Non-intrusive: Priority 0 with gentle sound

    Only when light activates - no spam from bright-condition motion


    Smart Behaviors:


    No daytime activation unless genuinely dark

    Inverted day brightness - darker conditions = brighter light

    Two-tier night dimming - accommodates natural sleep cycle

    Fail-safe design - defaults to safe operation if sensors fail


    Edge Cases Handled:


    Sunrise transition - automatically switches modes at 6am

    Power outage scenarios - will activate in very dark conditions

    Multiple trips - restart mode prevents timer conflicts

    Smooth overlaps - no jarring light changes during re-triggers


    [Updated 2026-03-14: Removed Pushover notifications, fixed color_temp mireds ->
    color_temp_kelvin]'
  triggers:
  - entity_id:
    - binary_sensor.rgbw_motion_lux_3rdr_wifi_matter_jayabath_occupancy_2
    to:
    - 'on'
    id: motion_on
    trigger: state
  - entity_id:
    - binary_sensor.rgbw_motion_lux_3rdr_wifi_matter_jayabath_occupancy_2
    to:
    - 'off'
    for:
      minutes: 2
    id: motion_off
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''motion_on'' }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ is_dark_enough }}'
        then:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ is_night_hours }}'
            sequence:
            - target:
                entity_id:
                - light.rgbw_motion_lux_3rdr_wifi_matter_jayabath_2
              data:
                brightness_pct: '{{ night_brightness }}'
                rgb_color:
                - 255
                - 50
                - 30
                transition: 1
              action: light.turn_on
          - conditions:
            - condition: template
              value_template: '{{ not is_night_hours }}'
            sequence:
            - target:
                entity_id:
                - light.rgbw_motion_lux_3rdr_wifi_matter_jayabath_2
              data:
                brightness_pct: '{{ day_brightness }}'
                color_temp_kelvin: 4000
                transition: 1
              action: light.turn_on
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''motion_off'' }}'
      sequence:
      - target:
          entity_id:
          - light.rgbw_motion_lux_3rdr_wifi_matter_jayabath_2
        data:
          transition: 2
        action: light.turn_off
  mode: restart
  variables:
    current_lux: '{{ states(''sensor.rgbw_motion_lux_3rdr_wifi_matter_jayabath_illuminance_2'')|float(0)
      }}'
    current_hour: '{{ now().hour }}'
    is_night_hours: '{{ current_hour >= 22 or current_hour < 6 }}'
    is_security_alert_time: '{{ current_hour >= 16 or current_hour < 6 }}'
    night_dark_threshold: 20
    day_dark_threshold: 30
    is_dark_enough: "{% if is_night_hours %}\n  {{ current_lux < night_dark_threshold
      }}\n{% else %}\n  {{ current_lux < day_dark_threshold }}\n{% endif %}"
    night_brightness: "{% if current_hour >= 22 or current_hour <= 2 %}\n  60  {#
      Earlier night hours - brighter #}\n{% else %}\n  40  {# Late night/early morning
      - dimmer #}\n{% endif %}"
    day_brightness: "{% if current_lux < 15 %}\n  80  {# Very dark during day - brightest
      #}\n{% elif current_lux < 25 %}\n  65  {# Somewhat dark - medium bright #}\n{%
      else %}\n  50  {# Just barely dark enough - dimmer #}\n{% endif %}"
  max_exceeded: silent
