      sequence:
      - target:
          entity_id:
          - switch.smartplug_moes_wifi_garagealeftfront_socket_1
          - switch.smartplug_moes_wifi_garagealeftfront_socket_2
        action: switch.turn_off
        enabled: false
    - conditions:
      - condition: trigger
        id: solar_check
      - condition: numeric_state
        entity_id: sensor.envoy_482543015950_battery
        above: 99.9
      - condition: numeric_state
        entity_id: sensor.solcast_pv_forecast_forecast_remaining_today
        above: 10
      sequence:
      - target:
          entity_id:
          - switch.smartplug_moes_wifi_garagealeftfront_socket_1
          - switch.smartplug_moes_wifi_garagealeftfront_socket_2
        action: switch.turn_on
    - conditions:
      - condition: trigger
