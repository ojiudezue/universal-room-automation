        action: switch.turn_off
      conditions:
      - id: ezinne_vanity_off
        condition: trigger
      - state: 'on'
        condition: state
        entity_id: switch.switch_shelly1pmgen3_wifi_ezinnevanity
    - sequence:
      - target:
          entity_id: switch.switch_shelly1pmgen3_wifi_ezinnemakeup
        action: switch.turn_off
      conditions:
      - id: makeup_timeout
        condition: trigger
    - sequence:
      - target:
          entity_id:
          - switch.shelly2pmg3_34cdb07765dc_switch_0
          - switch.shelly2pmg3_34cdb07765dc_switch_1
        action: switch.turn_off
      conditions:
      - id: main_lights_off
        condition: trigger
      - state: 'off'
        condition: state
        entity_id: binary_sensor.pir_zigbee_ojivanity_occupancy
      - state: 'off'
        condition: state
        entity_id: binary_sensor.pir_zigbee_ezinnevanity_occupancy
    - sequence:
      - target:
          entity_id: switch.sonoff_1002197ef7_1
        action: switch.turn_on
      conditions:
      - id: night_light_on
        condition: trigger
      - below: 40
        condition: numeric_state
        entity_id: sensor.outlet_lux_pir_mmwave_temp_voc_pressure_invisoutet_mqtt_masterbath_illuminance
      - condition: or
        conditions:
        - after: '20:00:00'
          condition: time
        - before: 06:30:00
          condition: time
    - sequence:
      - delay: 00:03:00
      - target:
          entity_id: switch.sonoff_1002197ef7_1
        action: switch.turn_off
      conditions:
