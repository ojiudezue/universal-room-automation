- id: '1749969073068'
  alias: Master Closet Smart Light Control_Enhanced
  description: Controls closet night light and overhead switch based on motion, time,
    and ambient light with smart day/night/dark detection
  triggers:
  - entity_id: binary_sensor.rgbw_lux_motion_3rdr_wifi_mastercloset_occupancy
    to: 'on'
    id: motion_on
    trigger: state
  - entity_id: binary_sensor.rgbw_lux_motion_3rdr_wifi_mastercloset_occupancy
    to: 'off'
    for:
      minutes: 5
    id: motion_off
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ states(night_light_entity) != ''unavailable'' }}'
  - condition: template
    value_template: '{{ states(main_light_switch) != ''unavailable'' }}'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: motion_on
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ is_after_midnight }}'
          sequence:
          - target:
              entity_id: '{{ night_light_entity }}'
            data:
              brightness_pct: 40
              rgb_color:
              - 255
              - 30
              - 10
              transition: 1
            action: light.turn_on
          - if:
            - condition: template
              value_template: "{% set last_notif = states('input_datetime.last_closet_debug_notification')
                %} {% if last_notif == 'unknown' %}\n  true\n{% else %}\n  {% set
                last_time = strptime(last_notif, '%Y-%m-%d %H:%M:%S') %}\n  {{ (now()
                - last_time).total_seconds() > 1800 }}\n{% endif %}\n"
            then:
            - target:
                entity_id: input_datetime.last_closet_debug_notification
              data:
                datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
              action: input_datetime.set_datetime
            - data:
                title: 'Closet: Night Mode'
                message: After midnight - night light only ({{ current_lux }} lux)
              action: notify.mobile_app_phalanxiphone15promax
        - conditions:
          - condition: template
            value_template: '{{ not is_after_midnight and is_very_dark }}'
          sequence:
          - target:
              entity_id: '{{ main_light_switch }}'
            action: switch.turn_on
          - target:
              entity_id: '{{ night_light_entity }}'
            data:
              brightness_pct: 60
              color_temp_kelvin: 3200
              transition: 1
            action: light.turn_on
          - if:
            - condition: template
              value_template: "{% set last_notif = states('input_datetime.last_closet_debug_notification')
                %} {% if last_notif == 'unknown' %}\n  true\n{% else %}\n  {% set
                last_time = strptime(last_notif, '%Y-%m-%d %H:%M:%S') %}\n  {{ (now()
                - last_time).total_seconds() > 1800 }}\n{% endif %}\n"
            then:
            - target:
                entity_id: input_datetime.last_closet_debug_notification
              data:
                datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
              action: input_datetime.set_datetime
            - data:
                title: 'Closet: Dark Mode'
                message: Dark + before midnight - overhead ON + night light ({{ current_lux
                  }} lux)
              action: notify.mobile_app_phalanxiphone15promax
        - conditions:
          - condition: template
            value_template: '{{ not is_very_dark }}'
          sequence:
          - target:
              entity_id: '{{ night_light_entity }}'
            data:
              brightness_pct: 30
              rgb_color:
              - 135
              - 206
              - 235
              transition: 1
            action: light.turn_on
          - if:
            - condition: template
              value_template: "{% set last_notif = states('input_datetime.last_closet_debug_notification')
                %} {% if last_notif == 'unknown' %}\n  true\n{% else %}\n  {% set
                last_time = strptime(last_notif, '%Y-%m-%d %H:%M:%S') %}\n  {{ (now()
                - last_time).total_seconds() > 1800 }}\n{% endif %}\n"
            then:
            - target:
                entity_id: input_datetime.last_closet_debug_notification
              data:
                datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
              action: input_datetime.set_datetime
            - data:
                title: 'Closet: Day Mode'
                message: Light enough - blue accent only ({{ current_lux }} lux)
              action: notify.mobile_app_phalanxiphone15promax
    - conditions:
      - condition: trigger
        id: motion_off
      sequence:
      - target:
          entity_id: '{{ night_light_entity }}'
        data:
          transition: 2
        action: light.turn_off
      - if:
        - condition: state
          entity_id: switch.switch_sonoffm4rm_matter_mastercloset
          state: 'on'
        then:
        - target:
            entity_id: switch.switch_sonoffm4rm_matter_mastercloset
          action: switch.turn_off
      - if:
        - condition: template
          value_template: "{% set last_notif = states('input_datetime.last_closet_debug_notification')
            %} {% if last_notif == 'unknown' %}\n  true\n{% else %}\n  {% set last_time
            = strptime(last_notif, '%Y-%m-%d %H:%M:%S') %}\n  {{ (now() - last_time).total_seconds()
            > 3600 }}\n{% endif %}\n"
        then:
        - target:
            entity_id: input_datetime.last_closet_debug_notification
          data:
            datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
          action: input_datetime.set_datetime
        - data:
            title: 'Closet: Off'
            message: Motion ended - all lights off
          action: notify.mobile_app_phalanxiphone15promax
  variables:
    night_light_entity: light.rgbw_lux_motion_3rdr_wifi_mastercloset
    main_light_switch: switch.switch_sonoffm4rm_matter_mastercloset
    lux_sensor: sensor.rgbw_lux_motion_3rdr_wifi_mastercloset_illuminance
    current_lux: '{{ states(lux_sensor) | float(50) }}'
    is_after_midnight: '{{ now().hour >= 0 and now().hour < 7 }}'
    is_very_dark: '{{ current_lux < 20 }}'
  mode: restart
