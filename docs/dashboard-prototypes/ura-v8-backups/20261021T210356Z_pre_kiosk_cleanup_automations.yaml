      - variables:
          compromise_temp: "{% if current_temp_final > effective_temp %}\n  {{ effective_temp
            + 1 }}\n{% else %}\n  {{ effective_temp - 1 }}\n{% endif %}\n"
          direction: "{% if current_temp_final > effective_temp %}\n  warmer\n{% else
            %}\n  cooler\n{% endif %}\n"
      - target:
          entity_id: climate.back_hallway_zone_3
        data:
          temperature: '{{ compromise_temp | float }}'
        action: climate.set_temperature
      - data:
          name: Back Hallway HVAC Arrester
          message: 'NORMAL: {{ current_temp_final }}°F vs {{ effective_temp }}°F effective
            - Compromise {{ compromise_temp }}°F for 30min'
        action: logbook.log
      - delay:
          minutes: 30
      - target:
          entity_id: climate.back_hallway_zone_3
        data:
          preset_mode: '{{ current_time_preset }}'
        action: climate.set_preset_mode
      - data:
          name: Back Hallway HVAC Arrester
          message: 30-min compromise ended - Reverted to {{ current_time_preset }}
            preset
        action: logbook.log
  variables:
    current_temp: '{{ state_attr(''climate.back_hallway_zone_3'', ''temperature'')
      | float }}'
    preset_mode: '{{ state_attr(''climate.back_hallway_zone_3'', ''preset_mode'')
      }}'
    hvac_mode: '{{ state_attr(''climate.back_hallway_zone_3'', ''hvac_mode'') }}'
    time_based_preset: "{% set hour = now().hour %} {% if hour >= 6 and hour < 8 %}\n
      \ wake\n{% elif hour >= 8 and hour < 22 %}\n  home\n{% else %}\n  sleep\n{%
      endif %}\n"
    effective_temp: "{% set current_preset_mode = state_attr('climate.back_hallway_zone_3',
      'preset_mode') %} {% if current_preset_mode == 'away' %}\n  80\n{% else %}\n
      \ 78\n{% endif %}\n"
    is_severe_temp_violation: "{% if preset_mode == 'manual' %}\n  {{ current_temp
      < (effective_temp - 3) or current_temp > (effective_temp + 3) }}\n{% else %}\n
      \ false\n{% endif %}\n"
    is_normal_temp_violation: "{% if preset_mode == 'manual' %}\n  {% set tolerance_min
      = effective_temp - 1 %}\n  {% set tolerance_max = effective_temp + 1 %}\n  {{
      current_temp < tolerance_min or current_temp > tolerance_max }}\n{% else %}\n
      \ false\n{% endif %}\n"
    is_hvac_mode_violation: '{{ hvac_mode != ''heat_cool'' }}'
  mode: restart
- id: '1758414348115'
  alias: Master Closet & Storage Smart Lighting v3 (Queued, 1hr Failsafe, No Notifs,
    1s Linger)
  description: 'Rebuilt 1/15/2026: Coordinated lighting for master closet and storage
    with adaptive modes, shared night light, and failsafe protection. Major improvements
    from v2: (1) Queued mode replaces restart mode for reliable turnoffs, (2) 1-hour
    failsafe auto-shutoff prevents stuck-on scenarios, (3) Removed all debug notifications
    (no spam), (4) Static lux thresholds replace circular logic, (5) Simplified sleep/awake
    time periods, (6) Direct state checks eliminate variable staleness, (7) Storage
    linger reduced to 1s. Main closet: 5min timeout. Storage: 3min timeout + 1s linger.
    Sleep hours: 22:00-06:00. [Updated 2026-03-09: color_temp mireds -> color_temp_kelvin
    for HA 2026.3]'
  triggers:
  - id: main_motion_on
    to: 'on'
    platform: state
    entity_id: binary_sensor.rgbw_lux_motion_3rdr_wifi_mastercloset_occupancy
  - id: main_motion_off
    to: 'off'
    for: 00:05:00
    platform: state
    entity_id: binary_sensor.rgbw_lux_motion_3rdr_wifi_mastercloset_occupancy
  - id: storage_motion_on
    to: 'on'
    for: 00:00:01
    platform: state
    entity_id: binary_sensor.motion_sonoff_zigbee_masterclosetstorage_occupancy
  - id: storage_motion_off
    to: 'off'
    for: 00:03:00
    platform: state
    entity_id: binary_sensor.motion_sonoff_zigbee_masterclosetstorage_occupancy
  - id: failsafe_main_switch
    to: 'on'
    for: 01:00:00
    platform: state
    entity_id: switch.switch_sonoffm4rm_matter_mastercloset
  - id: failsafe_storage_switch
    to: 'on'
    for: 01:00:00
    platform: state
    entity_id: switch.switch_sonoffm4rm_matter_masterclosetstorage
  - id: failsafe_night_light
    to: 'on'
    for: 01:00:00
    platform: state
    entity_id: light.rgbw_lux_motion_3rdr_wifi_mastercloset
  conditions:
  - condition: template
    value_template: '{{ states(''light.rgbw_lux_motion_3rdr_wifi_mastercloset'') !=
      ''unavailable'' }}'
  - condition: template
    value_template: '{{ states(''switch.switch_sonoffm4rm_matter_mastercloset'') !=
      ''unavailable'' }}'
  - condition: template
    value_template: '{{ states(''switch.switch_sonoffm4rm_matter_masterclosetstorage'')
      != ''unavailable'' }}'
  actions:
  - choose:
    - sequence:
      - choose:
        - sequence:
          - data:
              rgb_color:
              - 255
              - 50
              - 20
              transition: 1
              brightness_pct: 40
            target:
              entity_id: light.rgbw_lux_motion_3rdr_wifi_mastercloset
            action: light.turn_on
          conditions:
          - after: '22:00:00'
            before: 06:00:00
            condition: time
        - sequence:
          - data:
              color_temp_kelvin: 3333
              transition: 1
              brightness_pct: 90
            target:
              entity_id: light.rgbw_lux_motion_3rdr_wifi_mastercloset
            action: light.turn_on
          - target:
              entity_id: switch.switch_sonoffm4rm_matter_mastercloset
            action: switch.turn_on
          conditions:
          - below: 20
            condition: numeric_state
            entity_id: sensor.rgbw_lux_motion_3rdr_wifi_mastercloset_illuminance
        - sequence:
          - data:
              color_temp_kelvin: 2857
              transition: 1
              brightness_pct: 60
            target:
              entity_id: light.rgbw_lux_motion_3rdr_wifi_mastercloset
            action: light.turn_on
          conditions:
          - below: 40
            condition: numeric_state
            entity_id: sensor.rgbw_lux_motion_3rdr_wifi_mastercloset_illuminance
        default:
        - data:
            rgb_color:
            - 135
            - 206
            - 235
            transition: 1
            brightness_pct: 30
          target:
            entity_id: light.rgbw_lux_motion_3rdr_wifi_mastercloset
          action: light.turn_on
      conditions:
      - id: main_motion_on
        condition: trigger
    - sequence:
      - target:
          entity_id: switch.switch_sonoffm4rm_matter_masterclosetstorage
        action: switch.turn_on
      - if:
        - state: 'off'
          condition: state
          entity_id: light.rgbw_lux_motion_3rdr_wifi_mastercloset
        then:
        - choose:
          - sequence:
            - data:
                rgb_color:
                - 255
                - 50
                - 20
                transition: 1
                brightness_pct: 40
              target:
                entity_id: light.rgbw_lux_motion_3rdr_wifi_mastercloset
              action: light.turn_on
            conditions:
            - after: '22:00:00'
              before: 06:00:00
              condition: time
          - sequence:
            - data:
                color_temp_kelvin: 2857
                transition: 1
                brightness_pct: 50
              target:
                entity_id: light.rgbw_lux_motion_3rdr_wifi_mastercloset
              action: light.turn_on
            conditions:
            - below: 40
              condition: numeric_state
              entity_id: sensor.rgbw_lux_motion_3rdr_wifi_mastercloset_illuminance
      - if:
        - below: 20
          condition: numeric_state
          entity_id: sensor.rgbw_lux_motion_3rdr_wifi_mastercloset_illuminance
        - state: 'off'
          condition: state
          entity_id: switch.switch_sonoffm4rm_matter_mastercloset
        then:
        - target:
            entity_id: switch.switch_sonoffm4rm_matter_mastercloset
          action: switch.turn_on
      conditions:
      - id: storage_motion_on
        condition: trigger
    - sequence:
      - if:
        - state: 'off'
          condition: state
          entity_id: binary_sensor.motion_sonoff_zigbee_masterclosetstorage_occupancy
        then:
        - data:
            transition: 2
          target:
            entity_id: light.rgbw_lux_motion_3rdr_wifi_mastercloset
          action: light.turn_off
        - if:
          - state: 'on'
            condition: state
            entity_id: switch.switch_sonoffm4rm_matter_mastercloset
          then:
          - target:
              entity_id: switch.switch_sonoffm4rm_matter_mastercloset
            action: switch.turn_off
      conditions:
      - id: main_motion_off
        condition: trigger
    - sequence:
      - target:
          entity_id: switch.switch_sonoffm4rm_matter_masterclosetstorage
        action: switch.turn_off
      - if:
        - state: 'off'
          condition: state
          entity_id: binary_sensor.rgbw_lux_motion_3rdr_wifi_mastercloset_occupancy
        then:
        - data:
            transition: 2
          target:
            entity_id: light.rgbw_lux_motion_3rdr_wifi_mastercloset
          action: light.turn_off
        - if:
          - state: 'on'
            condition: state
            entity_id: switch.switch_sonoffm4rm_matter_mastercloset
          then:
          - target:
              entity_id: switch.switch_sonoffm4rm_matter_mastercloset
            action: switch.turn_off
      conditions:
      - id: storage_motion_off
        condition: trigger
    - sequence:
      - target:
          entity_id:
          - switch.switch_sonoffm4rm_matter_mastercloset
          - switch.switch_sonoffm4rm_matter_masterclosetstorage
        action: switch.turn_off
      - data:
          transition: 3
        target:
          entity_id: light.rgbw_lux_motion_3rdr_wifi_mastercloset
        action: light.turn_off
      conditions:
      - id:
        - failsafe_main_switch
        - failsafe_storage_switch
        - failsafe_night_light
        condition: trigger
  max: 5
  mode: queued
- id: '1758508383666'
  alias: Media Room Light Control v1
  description: Complete media room automation with occupancy detection, media-triggered
    scenes, time-based lighting, and coordinated blinds/fan control
  triggers:
  - entity_id: sensor.mmwave_motion_lux_meross_wifi_mediaroom_presence
    above: 1
    id: room_occupied
    platform: numeric_state
  - entity_id: sensor.mmwave_motion_lux_meross_wifi_mediaroom_presence
    below: 1
    for:
      minutes: 5
    id: room_empty
    platform: numeric_state
  - entity_id: media_player.madronels12000
    to: 'on'
    id: projector_on
    platform: state
  - entity_id: media_player.madronels12000
    to: 'off'
    id: projector_off
    platform: state
  - entity_id: sensor.mmwave_motion_lux_meross_wifi_mediaroom_presence
    below: 1
    for:
      minutes: 90
    id: room_extended_empty
    platform: numeric_state
  - entity_id: media_player.madronels12000
    to: 'off'
    id: projector_off
    platform: state
  - at: 01:00:00
    id: energy_backup_check
    platform: time
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''room_occupied'' }}'
      sequence:
      - target:
          entity_id: light.dimmer_d2lv_thread_mediaroom
        data:
          brightness: '{{ sconce_brightness }}'
        action: light.turn_on
      - if:
        - condition: template
          value_template: '{{ not projector_on }}'
        then:
        - target:
            entity_id: switch.switch_shelly_wifi_mediaroom_sw1
          action: switch.turn_on
      - target:
          entity_id: switch.switch_shelly_wifi_mediaroom_sw0
        action: switch.turn_on
      - delay:
          seconds: 4
      - target:
          entity_id: fan.media_room_ceiling_fan
        data:
          percentage: '{{ optimal_fan_speed }}'
        action: fan.set_percentage
      - if:
        - condition: template
          value_template: '{{ not is_night and not projector_on }}'
        then:
        - target:
            entity_id:
            - cover.media_left
            - cover.media_center
            - cover.media_right
          action: cover.open_cover
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''projector_on'' }}'
      sequence:
      - target:
          entity_id: light.dimmer_d2lv_thread_mediaroom
        data:
          brightness: 50
        action: light.turn_on
      - delay:
          seconds: 10
      - target:
          entity_id: light.dimmer_d2lv_thread_mediaroom
        data:
          brightness: 20
        action: light.turn_on
      - delay:
          seconds: 10
      - target:
          entity_id: light.dimmer_d2lv_thread_mediaroom
        action: light.turn_off
      - target:
          entity_id: switch.switch_shelly_wifi_mediaroom_sw1
        action: switch.turn_off
      - target:
          entity_id:
          - cover.media_left
          - cover.media_center
          - cover.media_right
        action: cover.close_cover
      - if:
        - condition: template
          value_template: '{{ current_fan_speed > 70 }}'
        then:
        - target:
            entity_id: switch.switch_shelly_wifi_mediaroom_sw0
          action: switch.turn_on
        - delay:
            seconds: 4
        - target:
            entity_id: fan.media_room_ceiling_fan
          data:
            percentage: 67
          action: fan.set_percentage
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''projector_off'' }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ room_occupied }}'
        then:
        - target:
            entity_id: light.dimmer_d2lv_thread_mediaroom
          data:
            brightness: '{{ sconce_brightness }}'
          action: light.turn_on
        - target:
            entity_id: switch.switch_shelly_wifi_mediaroom_sw1
          action: switch.turn_on
        - if:
          - condition: template
            value_template: '{{ not is_night }}'
          then:
          - target:
              entity_id:
              - cover.media_left
              - cover.media_center
              - cover.media_right
            action: cover.open_cover
        - target:
            entity_id: switch.switch_shelly_wifi_mediaroom_sw0
          action: switch.turn_on
        - delay:
            seconds: 4
        - target:
            entity_id: fan.media_room_ceiling_fan
          data:
            percentage: '{{ optimal_fan_speed }}'
          action: fan.set_percentage
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''room_empty'' }}'
      - condition: template
        value_template: '{{ not projector_on }}'
      sequence:
      - target:
          entity_id: light.dimmer_d2lv_thread_mediaroom
        action: light.turn_off
      - target:
          entity_id: switch.switch_shelly_wifi_mediaroom_sw1
        action: switch.turn_off
      - target:
          entity_id: fan.media_room_ceiling_fan
        action: fan.turn_off
      - target:
          entity_id:
          - cover.media_left
          - cover.media_center
          - cover.media_right
        action: cover.close_cover
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''projector_off'' }}'
      sequence:
      - variables:
          fan_was_on: '{{ is_state(''fan.media_room_ceiling_fan'', ''on'') }}'
          fan_previous_speed: '{{ state_attr(''fan.media_room_ceiling_fan'', ''percentage'')|int(0)
            }}'
      - delay:
          minutes: 2
      - if:
        - condition: template
          value_template: '{{ fan_was_on }}'
        then:
        - target:
            entity_id: fan.media_room_ceiling_fan
          action: fan.turn_off
      - delay:
          minutes: 5
      - if:
        - condition: template
          value_template: '{{ not room_occupied }}'
        then:
        - target:
            entity_id: light.dimmer_d2lv_thread_mediaroom
          action: light.turn_off
        - target:
            entity_id: switch.switch_shelly_wifi_mediaroom_sw1
          action: switch.turn_off
        - target:
            entity_id:
            - cover.media_left
            - cover.media_center
            - cover.media_right
          action: cover.close_cover
        else:
        - if:
          - condition: template
            value_template: '{{ fan_previous_speed > 0 }}'
          then:
          - target:
              entity_id: switch.switch_shelly_wifi_mediaroom_sw0
            action: switch.turn_on
          - delay:
              seconds: 4
          - target:
              entity_id: fan.media_room_ceiling_fan
            data:
              percentage: '{{ fan_previous_speed }}'
            action: fan.set_percentage
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''room_probe_complete'' }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ not room_occupied }}'
        then:
        - target:
            entity_id: light.dimmer_d2lv_thread_mediaroom
          action: light.turn_off
        - target:
            entity_id: switch.switch_shelly_wifi_mediaroom_sw1
          action: switch.turn_off
        - target:
            entity_id:
            - cover.media_left
            - cover.media_center
            - cover.media_right
          action: cover.close_cover
        else:
        - if:
          - condition: template
            value_template: '{{ fan_previous_speed > 0 }}'
          then:
          - target:
              entity_id: switch.switch_shelly_wifi_mediaroom_sw0
            action: switch.turn_on
          - delay:
              seconds: 4
          - target:
              entity_id: fan.media_room_ceiling_fan
            data:
              percentage: '{{ fan_previous_speed }}'
            action: fan.set_percentage
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''room_extended_empty'' }}'
      - condition: template
        value_template: '{{ not denon_on }}'
      - condition: template
        value_template: '{{ not room_occupied }}'
      sequence:
      - target:
          entity_id: media_player.madronels12000
        action: media_player.turn_off
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''energy_backup_check'' }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ not room_occupied }}'
        then:
        - target:
            entity_id: light.dimmer_d2lv_thread_mediaroom
          action: light.turn_off
        - target:
            entity_id: switch.switch_shelly_wifi_mediaroom_sw1
          action: switch.turn_off
        - target:
            entity_id: fan.media_room_ceiling_fan
          action: fan.turn_off
        - target:
            entity_id:
            - cover.media_left
            - cover.media_center
            - cover.media_right
          action: cover.close_cover
  variables:
    current_lux: '{{ states(''sensor.mmwave_motion_lux_matter_wifi_mediaroom_illuminance'')|float(50)
      }}'
    current_hour: '{{ now().hour }}'
    outside_temp: '{{ states(''sensor.phalanxmadrone_temperature'')|float(75) }}'
    mmwave_count: '{{ states(''sensor.mmwave_motion_lux_meross_wifi_mediaroom_presence'')|int(0)
      }}'
    matter_occupancy: '{{ is_state(''binary_sensor.mmwave_motion_lux_matter_wifi_mediaroom_occupancy'',
      ''on'') }}'
    motion_detected: '{{ is_state(''binary_sensor.mmwave_motion_lux_meross_wifi_mediaroom_sensor_presence_motion'',
      ''on'') }}'
    room_occupied: '{{ mmwave_count > 1 or (mmwave_count > 0 and matter_occupancy)
      }}'
    is_night: '{{ current_hour >= 22 or current_hour < 7 }}'
    is_evening: '{{ current_hour >= 18 and current_hour < 22 }}'
    is_early_morning: '{{ current_hour >= 5 and current_hour < 8 }}'
    sconce_brightness: "{% if is_night %}\n  20  # Very dim for night\n{% elif is_evening
      %}\n  60  # Moderate for evening\n{% elif current_lux < 30 %}\n  80  # Bright
      if dark during day\n{% elif current_lux < 60 %}\n  60  # Medium if moderately
      lit\n{% else %}\n  40  # Lower if naturally bright\n{% endif %}"
    optimal_fan_speed: "{% if outside_temp > 85 %}\n  83  # Speed 5/6 for very hot
      days\n{% elif outside_temp > 75 %}\n  67  # Speed 4/6 for warm days\n{% else
      %}\n  50  # Speed 3/6 for moderate temps\n{% endif %}"
    projector_on: '{{ is_state(''media_player.madronels12000'', ''on'') }}'
    denon_on: '{{ is_state(''media_player.home_theater'', ''on'') }}'
    current_fan_speed: '{{ state_attr(''fan.media_room_ceiling_fan'', ''percentage'')|int(0)
      }}'
  mode: restart
  max_exceeded: silent
- id: '1758511909487'
  alias: Smart Laundry Room Control v2
  description: 'Controls laundry room lighting based on time/lux and manages humidity-based
    fan control with intelligent triggers and safety limits


    Smart Humidity Fan Control:


    Auto-start: Fan turns on when humidity >50% (even when unoccupied)

    Smart shutoff: Fan stops when humidity <45% (hysteresis prevents flapping)

    Motion trigger: Fan starts on entry if humidity high

    Safety limit: 2-hour maximum runtime

    4-hour recheck: Auto-restart if humidity still high after safety shutoff

    15-minute monitoring: Checks humidity while running for faster shutoff


    Improved Lighting Logic:


    Night (10 PM-7 AM): Only RGBW night light (no under-cabinet)

    Evening (8-10 PM): Under-cabinet + RGBW + overhead if very dark

    Day (7 AM-8 PM): Lux-adaptive lighting (3 levels)

    5-minute timeout: Proper motion detection period

    Graceful shutdown: Staged light turn-off sequence


    Robustness Features:


    Hysteresis: 50% on / 45% off prevents fan cycling

    State validation: Checks current device states before acting

    Mode restart: Handles overlapping triggers gracefully

    Safety notifications: Clear explanations of automatic shutoffs'
  triggers:
  - entity_id: binary_sensor.rgbw_lux_motion_3rdr_wifi_matter_laundry_occupancy
    to: 'on'
    id: motion_on
    trigger: state
  - entity_id: binary_sensor.rgbw_lux_motion_3rdr_wifi_matter_laundry_occupancy
    to: 'off'
    for:
      minutes: 5
    id: motion_off
    trigger: state
  - entity_id:
    - sensor.temp_humidity_3rd_zigbee_laundry_humidity_2
    above: 50
    id: humidity_high
    trigger: numeric_state
  - entity_id:
    - sensor.temp_humidity_3rd_zigbee_laundry_humidity_2
    below: 48
    id: humidity_normal
    trigger: numeric_state
  - entity_id: switch.switch_shelly2pmgen3_wifi_laundry2_sw2
    to: 'on'
    for:
      hours: 2
    id: fan_max_runtime
    trigger: state
  - minutes: /15
    id: humidity_check
    trigger: time_pattern
  - hours: /4
    id: humidity_spike_check
    trigger: time_pattern
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''motion_on'' }}'
      sequence:
      - variables:
          lights_to_activate: []
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ is_night }}'
          sequence:
          - target:
              entity_id: '{{ night_light }}'
            data:
              brightness_pct: 25
              rgb_color:
              - 255
              - 80
              - 20
              transition: 2
            action: light.turn_on
          - variables:
              lights_activated:
              - Night Light
        - conditions:
          - condition: template
            value_template: '{{ is_evening }}'
          sequence:
          - target:
              entity_id: '{{ under_cabinet_lights }}'
            action: switch.turn_on
          - target:
              entity_id: '{{ night_light }}'
            data:
              brightness_pct: 40
              rgb_color:
              - 255
              - 180
              - 100
              transition: 1
            action: light.turn_on
          - variables:
              lights_activated:
              - Under Cabinet
              - Night Light
          - if:
            - condition: template
              value_template: '{{ current_lux < 10 }}'
            then:
            - target:
                entity_id: '{{ overhead_lights }}'
              action: switch.turn_on
            - variables:
                lights_activated: '{{ lights_activated + [''Overhead''] }}'
        - conditions:
          - condition: template
            value_template: '{{ is_day }}'
          sequence:
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ current_lux > 50 }}'
              sequence:
              - target:
                  entity_id: '{{ under_cabinet_lights }}'
                action: switch.turn_on
              - target:
                  entity_id: '{{ night_light }}'
                data:
                  brightness_pct: 20
                  rgb_color:
                  - 200
                  - 220
                  - 255
                  transition: 1
                action: light.turn_on
              - variables:
                  lights_activated:
                  - Under Cabinet
                  - Blue Accent
            - conditions:
              - condition: template
                value_template: '{{ current_lux >= 20 and current_lux <= 50 }}'
              sequence:
              - target:
                  entity_id:
                  - '{{ overhead_lights }}'
                  - '{{ under_cabinet_lights }}'
                action: switch.turn_on
              - target:
                  entity_id: '{{ night_light }}'
                data:
                  brightness_pct: 30
                  rgb_color:
                  - 255
                  - 255
                  - 255
                  transition: 1
                action: light.turn_on
              - variables:
                  lights_activated:
                  - Overhead
                  - Under Cabinet
                  - White Light
            default:
            - target:
                entity_id:
                - '{{ overhead_lights }}'
                - '{{ under_cabinet_lights }}'
              action: switch.turn_on
            - target:
                entity_id: '{{ night_light }}'
              data:
                brightness_pct: 50
                rgb_color:
                - 255
                - 255
                - 255
                transition: 1
              action: light.turn_on
            - variables:
                lights_activated:
                - All Lights (Dark)
      - if:
        - condition: template
          value_template: '{{ humidity_high and not fan_currently_on }}'
        then:
        - target:
            entity_id: '{{ exhaust_fan }}'
          action: switch.turn_on
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''motion_off'' }}'
      sequence:
      - target:
          entity_id: '{{ night_light }}'
        data:
          transition: 3
        action: light.turn_off
      - delay:
          seconds: 2
      - target:
          entity_id: '{{ under_cabinet_lights }}'
        action: switch.turn_off
      - delay:
          seconds: 1
      - target:
          entity_id: '{{ overhead_lights }}'
        action: switch.turn_off
      - delay:
          seconds: 1
      - target:
          entity_id: '{{ closet_lights }}'
        action: switch.turn_off
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''humidity_high'' }}'
      - condition: template
        value_template: '{{ not fan_currently_on }}'
      sequence:
      - target:
          entity_id: '{{ exhaust_fan }}'
        action: switch.turn_on
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''humidity_normal'' }}'
      - condition: template
        value_template: '{{ fan_currently_on }}'
      sequence:
      - target:
          entity_id: '{{ exhaust_fan }}'
        action: switch.turn_off
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''fan_max_runtime'' }}'
      sequence:
      - target:
          entity_id: '{{ exhaust_fan }}'
        action: switch.turn_off
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''humidity_check'' }}'
      - condition: template
        value_template: '{{ fan_currently_on }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ humidity_normal }}'
        then:
        - target:
            entity_id: '{{ exhaust_fan }}'
          action: switch.turn_off
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''humidity_spike_check'' }}'
      - condition: template
        value_template: '{{ not fan_currently_on }}'
      - condition: template
        value_template: '{{ humidity_high }}'
      - condition: template
        value_template: '{{ not room_occupied }}'
      sequence:
      - target:
          entity_id: '{{ exhaust_fan }}'
        action: switch.turn_on
  variables:
    overhead_lights: switch.switch_shelly2pmgen3_wifi_laundry1_sw1
    under_cabinet_lights: switch.switch_shelly2pmgen3_wifi_laundry1_sw2
    closet_lights: switch.switch_shelly2pmgen3_wifi_laundry2_sw1
    exhaust_fan: switch.switch_shelly2pmgen3_wifi_laundry2_sw2
    night_light: light.rgbw_lux_motion_3rdr_wifi_matter_laundry
    current_lux: '{{ states(''sensor.rgbw_lux_motion_3rdr_wifi_matter_laundry_illuminance'')|float(50)
      }}'
    current_humidity: '{{ states(''sensor.temp_humidity_3rd_zigbee_laundry_humidity'')|float(40)
      }}'
    current_hour: '{{ now().hour }}'
    is_night: '{{ current_hour >= 22 or current_hour < 7 }}'
    is_evening: '{{ current_hour >= 20 and current_hour < 22 }}'
    is_day: '{{ current_hour >= 7 and current_hour < 20 }}'
    fan_currently_on: '{{ is_state(exhaust_fan, ''on'') }}'
    room_occupied: '{{ is_state(''binary_sensor.rgbw_lux_motion_3rdr_wifi_matter_laundry_occupancy'',
      ''on'') }}'
    humidity_high: '{{ current_humidity > 50 }}'
    humidity_normal: '{{ current_humidity < 48 }}'
    fan_start_time: '{{ state_attr(exhaust_fan, ''last_changed'') }}'
  mode: restart
  max_exceeded: silent
