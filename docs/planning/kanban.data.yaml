  mechanism: 'Every toilet visit passes through the bathroom -> legitimate motion -> bathroom occupancy
    -> times out while operator sits in the toilet -> his BLE still resolves to the master_bathroom
    area (the toilet is inside the bathroom scanner footprint) -> Bermuda flap re-fires BLE within the
    warm window -> occupancy CREATED -> entry actions -> light on -> BLE flap clears -> off ~40s later.
    Reproducible by construction: the pass-through guarantees fresh motion, so the warm window is
    always open when it matters. v5.22.0 fixed the COLD strobe (chain broken, no recent motion); this
    is the WARM strobe it deliberately admitted.'
  daytime_light_finding: 'NOT a lux bug. sensor...masterbath_illuminance reads 8.5 lx live (cover 1
    closed, interior room) -> lux_zone=dark is CORRECT. "Only when dark" is lux-based, not sun-based;
    the room genuinely is dark at 10am. Every occupancy row today carries last_lux_zone=dark. The
    daytime complaint is the BLE create firing entry actions, not the lux gate.'
  third_writer_ruled_out: '40 HA automations enabled; none targets master bathroom lights (closet +
    ziri/jaya/guest bathrooms have their own; master bath does not). URA sole writer.'
  fix_directions_not_built:
  - '(a) NARROW the motion leg to an actual handoff: admit BLE create only within ~1 tick (30-60s) of
    the occupancy-off transition, not 2x timeout from last motion. Smallest change; kills the
    reproducible case; still covers the documented purpose.'
  - '(b) ADJACENT-ROOM ATTRIBUTION: suppress BLE create when the same person''s BLE also explains an
    ADJACENT occupied room (master_toilet occupied=on by the same person throughout). This is the
    fusion-library intent/evidence + adjacency territory — richer, heavier.'
  - '(c) ROLE SPLIT: BLE-created occupancy extends holds/HVAC but does not fire LIGHT entry actions.
    NOTE: sensor_role.RoleQuery.CREATOR_VS_EXTENDER is RESERVED for exactly this — senscap v5.65.0
    shipped the query surface unconsumed. This card may be its founding consumer.'
  OPERATOR_CHALLENGE_2026_08_10: '"Why break the extend but not create rule at all? It seems like it
    created it, no?" — CORRECT. Leg (b) mechanically IS a create (occupancy off -> on via BLE alone,
    fresh became_occupied_time). Adjudication: (1) its DOCUMENTED purpose (handoff tick) is already
    covered by the chain leg, whose prev-tick read is still True at the timeout tick; (2) its
    PROTECTIVE case (still body + BLE dropout) is mmWave''s job — and in the incident mmWave correctly
    read False because the room really was empty; leg (b) cannot distinguish flap-recovery from
