- id: STUCK-SENSOR-1
  title: Stuck-sensor detection is NOTIFY-ONLY — stuck sensors still drive occupancy
  thread: presence
  status: pre_planning
  approval: unreviewed
  tags:
  - tier-2db
  - no-fabrication-verify
  origin:
    date: '2026-08-09'
    gist: operator diagnosed a stuck Zigbee mmWave holding master occupancy; asked why I did not see it
  why: 'URA''s duty-cycle detector DOES catch stuck sensors and logs: ''Sensor <x> duty-cycle stuck (on-ratio
    exceeded over rolling window) — NOTIFY-ONLY, not excluded from occupancy''. It then KEEPS USING the
    stuck sensor for occupancy. Detection without consequence. Tonight that produced: master bedroom reported
    occupied while its inputs read off -> comfort fans ran in an empty bedroom (operator not home); Garage
    B occupied off a chattering ratgdo; Living Room and Study A both flagged stuck. Occupancy feeds HVAC,
    lighting and presence trust, so the blast radius is wide.'
  my_miss: 'I READ these exact warnings hours earlier and dismissed them as ''routine, not a crash'' —
    I was scanning for crashes, so a WARNING that was not a crash read as noise. The message named its
    own defect and I skimmed it. Rule: a warning that says STUCK is never routine; read content, not severity
    class.'
  gaps:
  - '1. NO CONSEQUENCE: stuck sensors are not excluded from the occupancy substrate.'
  - '2. NO SURFACE: the only signal is a WARNING log line — no sensor, no NM note, no dashboard. Invisible
    unless a human is tailing logs at the right moment.'
  - '3. NO PERSISTENCE: like the echo counter, any stuck-state tally resets on restart, and we restarted
    7+ times today.'
  fix:
  - exclude a sensor from occupancy after N consecutive stuck windows (with a rung-1 knob and a clear
    un-stick path)
  - expose stuck sensors on a diagnostic entity (count + which sensors + since when) so it is visible
    without log surgery
  - raise an NM note when a room's ONLY occupancy input goes stuck — that is the case that silently fabricates
    occupancy
  parsimony:
    problem: a stuck sensor silently fabricates occupancy and drives fans/HVAC/lighting in empty rooms
    verdict: BUILD
    note: detection already exists; this is wiring a consequence + a surface to it, not new inference
  next: trace the duty-cycle detector; decide exclusion policy; add the diagnostic surface
- id: TABLET-FLEET-1
  title: 'Wall tablet fleet: URA integration (sensors, wake-on-occupancy, room quick-actions)'
  thread: tablets
  status: pre_planning
  approval: unreviewed
  tags:
  - institutional-context
  - measure-before-build
  - marginal-benefit
  origin:
    date: '2026-08-08'
    gist: 'operator: master tablet upgrades tested and working (sensors, lights, all over MQTT); thinking
      house-device tablet control, wake on URA room occupancy, conditional room quick-actions. NO ACTION
      YET - thoughts requested.'
  repo: ~/Code/wall-tablet (HALedController, v1.3 versionCode 5, 2026-08-01)
  verified_capabilities:
  - 'Per-room MQTT identity already fleet-safe: clientId wall-tablet-<room>, topics home/wallpanel/<room>/{led,sensors,status};
    LWT availability; self-registers via MQTT Discovery (no YAML).'
  - 'SCREEN CONTROL ALREADY EXISTS - ScreenController.kt: screenOn(), screenOff(), setBrightness(0-255),
    isScreenOn(). MQTTManager subscribes a displayCommandTopic with a JSON payload. => wake-on-occupancy
    needs ZERO tablet-side work; it is a URA publish.'
  - 'Per-room sensors already published: temperature, humidity, ILLUMINANCE (lux).'
  - BurnInPreventionManager.kt exists; headless adb provisioning of the room slug; scripts/deploy.sh does
    deterministic fleet deploy over adb.
  orchestrator_assessment:
  - HIGHEST VALUE IS THE SENSORS, NOT THE CONTROL SURFACE. Per-room lux is a first-class input URA's lighting
    logic already consumes; a tablet in every room is a lux+temp+humidity fleet arriving for free. That
    likely beats the quick-action UI on value and is far lower risk.
  - Wake-on-occupancy is cheap because the tablet side is done - URA publishes to displayCommandTopic
    on room-occupied. Because setBrightness exists, the wake can be DIM at night instead of full-blast,
    so house-state gating (never full brightness in sleep/home_night) is achievable rather than aspirational.
    Per-room opt-in required - a bedroom tablet waking at 3am is a regression, not a feature.
  - 'Room-context detection needs NO inference: each tablet is already provisioned with its room slug,
    so point its kiosk URL at a room-scoped dashboard (/ura-v8?room=<slug>). Avoid user-agent sniffing
    or a ''current tablet'' helper - both are fragile and unnecessary.'
  - 'MANUAL-VS-AUTOMATION TENSION (the important one): ''all on''/''all off'' room buttons will fight
    URA''s occupancy/arrester intent exactly like a manual thermostat change does. Per the 2026-08-08
    ruling (''manual control should be short lived... manual is wasteful; easy to re-engage''), room quick-actions
    should create a BOUNDED manual override with a visible expiry - reuse the Temp Arrester Override pattern
    (min-life + decay + notify-before-lapse) rather than inventing an indefinite hold.'
  - '''Manual night routine'': do NOT build a new routine concept. Wire it to the existing sleep house
    state via the established HOUSE_STATE_OVERRIDE path (operator already floated this). ''Manual away''
    likewise = existing away override.'
  - 'FLEET GATE (measure-before-build): v1.3''s own README says LED control was ''on-device verify pending
    first fleet deploy'' - the operator reports master tablet now working, which satisfies that gate.
    Before fleet: confirm the pre-v1.2 shared-topic migration is done (README says delete the old manually-configured
    home/ledcontroller entities in HA once) so discovery does not leave orphans.'
  next: operator thoughts/ruling; then likely sequence = (1) consume tablet lux/temp/humidity in URA,
    (2) wake-on-occupancy with night dimming + per-room opt-in, (3) room-scoped dashboard quick-actions
    as bounded overrides
