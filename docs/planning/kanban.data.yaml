  problem: 'v5.84.0 shipped an UnboundLocalError: a function-local `from ..const import CONF_ENTRY_TYPE`
    inside _run_inference shadowed the module-level import for the WHOLE function, and a moved reference
    accessed it unbound on the startup path. This bug CLASS (local import shadows module-level name; a
