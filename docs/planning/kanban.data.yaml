    closed, interior room) -> lux_zone=dark is CORRECT. "Only when dark" is lux-based, not sun-based;
    the room genuinely is dark at 10am. Every occupancy row today carries last_lux_zone=dark. The
    daytime complaint is the BLE create firing entry actions, not the lux gate.'
