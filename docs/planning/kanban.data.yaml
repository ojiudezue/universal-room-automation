  - docs/planning/AUDIT_exterior_census_supersession.md (eb2caa3c8) — KEEP BOTH ruling
  operator_exterior_direction_2026_08_16: 'Operator ruling on the exterior work, THREE distinctions: (1)
    EXTERIOR -> HEADCOUNT is easy, do it (straight composition; sensor.universal_room_automation_persons_on_property_exterior
    is live, and a dashboard for it already exists at docs/dashboards/ura_v8_exterior_cycle2_cards.md).
    (2) EXTERIOR -> GUEST must be CAREFUL and causal, not thresholded: requires observing an UNKNOWN person
    transition OUTSIDE->INSIDE VIA AN EGRESS, then correlating with other guest signals. Never "someone
