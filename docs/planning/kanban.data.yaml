- id: FAN-MANUAL-1
  title: 'Fans have no manual-ON override: room temp logic reverts a hand-switched fan ("below threshold")'
  thread: hvac
  status: shipped_organic
  shipped_version: v5.68.0
  approval: explicit
  approved_by: 'operator 2026-08-10 ("If there is no manual override, design one after considering all
    our fan goals and touch points across room, zone, coordinators")'
  tags:
  - context-wide-scoping
  - institutional-context
  - numbers-get-knobs
  origin:
    date: '2026-08-10'
    gist: '"I cant seem to turn on the living room fan manually without it turning off by itself."'
  why: 'EVIDENCE (ura_activity_log): Living Room fan turn-offs are [room/fan_off] "Fans off (below
    threshold, 77F)" — the room-tier temperature comfort controller reconciles fan state to its own
    verdict and does not recognise a manual ON. v5.31.0 shipped a manual-OFF cooldown; the ON side was
    never built. A human switching a fan on is the canonical EVIDENCE event (fusion section 7:
    "interactions are evidence") and today it is treated as drift to correct — the same class as
    ARREST-COMFORT-1 (kids arrested at the thermostat) and the same lesson: reverting a human within
    minutes teaches them the controls are broken.'
  scope_note: 'Operator mandate: context-wide. Fan touchpoints to inventory before design: room comfort
    fan control (handle_temperature_based_fan_control + the below-threshold revert), v5.31.0 manual-off
    cooldown (the precedent + its knob), fan_recheck (pause/restore machinery), comfort-fan AWAY veto
    (v5.40.0 D3), sleep-onset bedroom fans (feature/sleep-fans), bathroom humidity exhaust unification
    (v5.6.0 — humidity fans are SOLE-OWNER exempt from the veto), fan interference gate (presence-side
    reader of fan state), zone vacancy sweep, AI-rules executor (R2: fan.turn_on unvetoed — a prior
    review residual), duty-cycle fan_assist flag in the coast constraint.'
  PLAN_2026_08_10: 'docs/planning/PLANNING_fan_manual_on_override.md. Shape: plain timed manual-ON
    hold symmetric to the v5.31.0 manual-OFF cooldown — graduated-concession REJECTED for fans (binary
    comfort, no setpoint to negotiate; margin ~0). Detection REUSES the existing OFF-side mechanism
    (_last_seen_any_fan_on baseline + self-write marker; one new symmetric _fan_on_issued_this_tick
    flag — no second manual-detection path). INV-FMH: for hold_s after an external ON, no URA path
    emits fan turn_off except four enumerated discharges (expiry, external OFF, allowlisted
    fan-recheck, safety, fan_control toggle-off). Knobs: DEFAULT_FAN_MANUAL_ON_HOLD_S=3600 (0=kill) +
    per-room CONF. Tier 2-DB. SHARPEST RISK is not the hold: hvac_fans.py already OVERLOADS
    manual_off_cooldown_until as a partial ON-marker (confused comment at :788) — the field split has
    >=3 readers and missing one ships a masked diagnostic regression; Review B must enumerate all.'
  OPERATOR_RULINGS_2026_08_10: 'Both as recommended: (1) FRESHEST WINS — a manual-ON newer than the
    sleep transition survives it; (2) fan-recheck OFF is ALLOWLISTED via trigger_path, hold
    remaining-time preserved across the pause. Build fully approved (build-implies-ship).'
  REVIEW_ROUND_2026_08_11: 'ALL THREE DO-NOT-SHIP — 1 CRIT + 6 HIGH, disjoint framings, zero overlap.
    C-CRIT-1: the HVAC chokepoint gate (the plan''s headline enforcement) had ZERO coverage — deleting
    it left 8,564 tests green, because every _set_fan_state-reaching test zeroed the hold in fixtures.
    A-HIGH-1: boot-seed guard swallows tick-1 detection → after any entry reload URA kills the fan the
    operator just turned on (the ORIGINAL complaint, resurrected). A-HIGH-2/B-HIGH-2: the reconciler in
    BOTH directions — its ON mis-detected as external (fan pinned 1h), its OFF re-asserts against a
    held fan on its own cadence. B-HIGH-1: zone-vacancy sweep (hvac.py:2418) bypasses the chokepoint
    entirely — the MISSED emission site; a one-line grep (CONF_FANS.*turn_off) would have found it and
    neither plan, build, nor dispatch brief ran it. C-H2: the discharge-(b) test asserted None==None
    (its hold was never opened). C-H1+A-MED-2: recheck extension unanchored AND buggy (mid-pause expiry
    clears the hold, losing the extension). MED-B2: room-tier restart re-adoption claim is provably
    aspirational.'
  next: 'CONSOLIDATED FIX-UP IN FLIGHT: chokepoint behavioral test (no fixture zeroing) + zone-sweep/
    pre-arrival guards + reconciler defer+marker (mark_fan_on_issued helper for ALL URA ON sites) +
    ONE coherent boot-seed policy (tick-1 ON → hold opens, conservative toward the human; restart docs
    corrected to match) + recheck extension anchored + mid-pause expiry fixed + discharge-(b) test
    rewritten + MEDs. Gate: C''s drills 1/4/5 + A''s boot-edge re-run to RED. Then re-review the fix-up
    surface, merge AFTER v5.67.0 (develop moved), ship as v5.68.0.'
  DEDUPE_2026_08_10: 'Sweep: ARREST-COMFORT-1 is the SIBLING (thermostat side of the same class) —
    linked not merged; fan-recheck cards/plans are about mmWave truth not manual intent; humidity-fan
