    (6) signal-driven kill/knob no parent-reload [B-H4]; (7) empty-tuple=kill via is-not-None + isinstance
    guard [C adv#3/A-MED-1]; (8) egress idempotency [C-M1]; (9) REAL behavioral tests driving _protect_sourced_checkpoint_entities
    + TransitValidator.async_init - every mutation drill must go red [C-H1..H4].'
  origin:
