    handling. Four framing-disjoint reviews incl. the adversarial-completeness pass.
  - CORROBORATOR ONLY — must never solo-arm guest. The guest-room gate (cycle 1 D2) stays the primary
    arm.
  - Identity must come from LOCAL sources only (Frigate-2 + UniFi Protect). Note the linker's `identified`
    is a Frigate sub_label promoted only after >=2 hops (exterior_track_linker.py:521-551) — it is NOT
    the URA person/BLE identity and there is no cross-walk today. Building that cross-walk is part of
