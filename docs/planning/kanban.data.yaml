  origin:
    date: '2026-08-10'
    gist: 'operator in the master toilet; bathroom light came on briefly, reproducibly ("when I enter
      it"), during daytime despite only-when-dark'
  why: 'MEASURED from recorder attrs, two events this morning: 09:53:32 and 10:19:35, both
    occupancy_source=ble, ble_persons=[Oji], tier1_provenance all-False, fresh became_occupied_time
    (CREATE not extend), off again 41s/37s later. NOT a v5.22.0 regression — the predicate is intact and
    both events were admitted by its MOTION LEG: last motion 5.5 and 9 min prior, inside
    BLE_MOTION_CONFIRM_MULTIPLIER(2) x occupancy_timeout(300s) = 10 min. The comment says the leg exists
