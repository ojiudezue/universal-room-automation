- id: XCORR-1
  title: 'Burst-demotion for isolated single-camera night alerts (was: cross-engine corroboration gate)'
  thread: perimeter
  status: pre_planning
  approval: explicit
  approved_by: operator
  approved_on: '2026-08-08'
  tags:
  - tier-2db
  - measure-before-build
  - numbers-get-knobs
  - no-fabrication-verify
  origin:
    date: '2026-08-08'
    gist: operator got 12 notifications 01:01-01:25 CDT from hot_tub; "this is what x-correlation looks
      like if we have multiple engines"
  why: 'A single engine asserting person while a CO-LOCATED engine on the same physical camera stays silent
    is strong false-positive evidence. Labelled example 2026-08-08: hot_tub frigate fired 5x in 18min;
    protect leg NEVER fired; zero adjacent cameras fired. URA correctly alerted on bad input - the input
    is the problem.'
  evidence:
  - 'hot_tub frigate _person_occupancy: 06:01:27, 06:06:10, 06:08:36, 06:10:29, 06:19:00 UTC'
  - 'hot_tub PROTECT _person_detected: zero firings in the window'
  - 'all other exterior cameras (pool_equipment, armcrest, back_yard, rear_ptz, front_side_ptz): zero'
  - 'per-camera alert counts 2 days: hot_tub 24, front_side_ptz 7, pool_equipment 5 -> hot_tub dominates'
  design_TRAP: 'DO NOT gate on corroboration generally - that would SUPPRESS REAL INTRUSIONS on single-engine
    cameras (many cameras have only ONE engine; and a real prowler may only be seen by one). The gate
    must be NARROW: only for cameras that HAVE >=2 engines (so silence from the sibling is meaningful),
    only in the deep-night window, and it must DEMOTE/delay - never silence. Aligns with the existing
    demote-never-silence invariant (INV-XP).'
  design:
  - 'REVISED: first alert ALWAYS fires at full severity (preserves intrusion guarantee).'
  - 'Demote the 2nd..Nth alert from the SAME camera within a window when ALL of: no sibling-engine corroboration,
    no adjacent-camera activity (linker adjacency), deep-night.'
  - This is the pattern that was actually diagnostic on 2026-08-08 (burst + isolation), not single-event
    corroboration.
  - 'Second half of the spam is CHANNEL FAN-OUT: 4 channels x 3 events = 12 buzzes. Demoted repeats ->
    single channel/digest (folds into CONSOL-1 contextual severity).'
  knobs:
  - name: PERIMETER_XCORR_REQUIRE_SECOND_ENGINE_NIGHT
    rung: 1
    why: enable the night corroboration gate; False = today behavior
  - name: PERIMETER_XCORR_WINDOW_S
    rung: 1
    why: how long to wait for the sibling engine before deciding
  - name: PERIMETER_XCORR_MIN_SOLO_RATIO
    rung: 1
    why: only gate cameras whose solo-firing ratio exceeds this (evidence-based, not blanket)
  parsimony:
    problem: one mis-tuned camera paged the operator 12x at 1am
    verdict: SIMPLIFY
    note: probe rejected the corroboration gate; the simple burst+isolation demotion captures the benefit
      without the false-negative risk
  next: build burst-demotion (first alert full severity, repeats demoted when isolated+uncorroborated+night);
    fold channel reduction into CONSOL-1
  refs:
  - perimeter_alert.py leg_firing_by_camera / _record_leg_fire
  - v5.59.0 disagreement telemetry
  probe_result: 'PROBE RUN 2026-08-08 (8d, 30s window) -> AUDIT_xcorr_engine_corroboration_probe.md. The
    naive corroboration gate is REJECTED: solo firing is the NORM on the exterior cameras that drive alerts
    (front_side_ptz 92% solo, back_yard 91%, pool_equipment 93%, hot_tub 77%). Gating on sibling silence
    would suppress 77-93% of exterior person detections INCLUDING REAL ONES. Engines do not share FOV/sensitivity
    per camera, so ''sibling silent'' means different things per camera - no house-wide threshold exists.
    Contrast: frigate on door cameras is near-perfectly corroborated (madrone_g6_entry 0% solo, front_door_aerial
    3%).'
  parked_alts:
  - alt: per-camera adaptive solo-rate baselining
    why: theoretically better than a global threshold
    revisit_if: burst-demotion proves insufficient after a season
- id: DIMMER-REBOOT-1
  title: Master bedroom Shelly Dimmer 2 reboots 89x since Aug 1 and returns ON (NOT thermal)
  thread: devices
  status: pre_planning
  approval: implied
  tags:
  - no-fabrication-verify
  origin:
    date: '2026-08-08'
    gist: 'operator: why is the master bedroom dimmer coming on in the morning?'
  why: 'light.shellydimmer2_24d7ebe93470 (area master_bedroom) reboots repeatedly: 89 `unavailable` events
    since Aug 1, accelerating 6/day -> 23/day, each ~33s (consistent = full device reboot, not a variable
    WiFi blip). 32 of those reboots came back ON — THAT is the ''dimmer comes on in the morning''. No
    context_user_id/parent on any transition => nothing in HA or URA commands it. Temperature is normal,
    so the cause is NOT thermal.'
  likely_causes:
  - Shelly power-on-default set to ON (or restore-last with stale value) -> every reboot turns the light
    on
  - WiFi/network instability causing reboots — memory records a prior house-wide Shelly/Sonoff off-WiFi
    event; this device is the only Shelly currently flapping
  - power quality or firmware
  next: set power-on-default OFF; then chase the reboot cause
  CORRECTION: '2026-08-08: I FIRST REPORTED THIS AS A 117-130C FIRE RISK. THAT WAS WRONG — the sensor''s
    unit_of_measurement is degF, not degC. 116.7F = 47C; peak 129.6F = 54C. That is NORMAL for a wall
    dimmer and inside the Shelly Dimmer 2 range. NO fire risk; no breaker action needed. The device''s
    `overheating` binary_sensor never firing was CORRECT, not a failed guard. Root error: asserted a mechanism
    from an unlabeled number instead of reading the unit — violates the project''s no-fabrication/verify
    rule.'
  fix:
  - 'PRIMARY: set the Shelly power-on default to OFF so a reboot cannot turn the light on (device setting,
    operator or API)'
  - 'THEN: investigate the reboot cause (WiFi signal at that box, firmware version, power quality)'
  - 'optional: NM alert if reboot count per day exceeds a threshold — a device rebooting 23x/day is a
    real signal we currently only see by asking'
- id: BOOTSANITY-1
  title: Boot-sanity allowlist guard cannot fire on a cold boot
  thread: camera
  status: pre_planning
  approval: implied
  tags:
  - no-fabrication-verify
  - mutation-drill
  origin:
    date: '2026-08-07'
    gist: found during v5.61.0 live validation — I nearly read its silence as proof of success
  why: The F1(e) guard runs at the END of PerimeterAlertManager.async_setup() and is gated on `_linker_now`
    being present — but the linker registers AFTER that setup returns, which IS the bug. So on every cold
    boot it short-circuits and never warns. Its silence is not evidence of a successful install.
  fix: 're-run the sanity check from the READY handler AFTER the install attempt (and/or on a delayed
    post-boot check). Mutation drill: neuter the install -> the sanity WARNING must fire.'
  parsimony:
    problem: the tripwire for a CRITICAL class of bug is unreachable on the path that matters
    verdict: BUILD
    note: small; but it is the detector for a house-wide-outage bug
  next: move the check into the READY handler; pin with a test that asserts the WARNING fires when install
    fails
- id: OVERRIDE-NOTIFY-1
  title: Warn before the Temp Arrester Override expires
  thread: hvac
  status: pre_planning
  approval: explicit
  approved_by: operator
  approved_on: '2026-08-07'
  tags:
  - numbers-get-knobs
  origin:
    date: '2026-08-07'
    gist: '"The only real optimization is getting a text that says your override is about to expire 5
      mins before a boundary"'
  why: 'We built the release logic but never tell the operator it is coming — the override silently vanishes
    and the setpoint drifts back. A heads-up makes it usable: re-engage in one tap instead of noticing
    an hour later that the master went cold.'
  design_note: '5-min-ahead warning is only possible for PREDICTABLE expiries. House-state transitions
    are NOT scheduled - we cannot know home_evening is coming. So: (a) pre-warn the 6h decay at T-5min;
    (b) on a grace DEFERRAL, warn immediately (''context changed; override ends in ~14 min'') - better
    than 5 min notice; (c) notify on actual release. Operator to confirm the three-part shape.'
  knobs:
  - name: ARRESTER_OVERRIDE_EXPIRY_WARN_S
    rung: 1
    why: 300 (5 min) lead time; 0 disables
  parsimony:
    problem: override releases silently; operator discovers it by feeling cold
    verdict: BUILD
    note: small, additive, rides the existing NM note path added in v5.61.0
  next: confirm the 3-part shape with operator, then build with the SNAP-1 batch or standalone
- id: ARREST-SUNSET-1
  title: Temp Arrester Override does not sunset on away/vacation (only sleep)
  thread: hvac
  status: shipped_organic
  approval: implied
  tags:
  - tier-2db
  - no-fabrication-verify
  origin:
    date: '2026-08-07'
    gist: operator turned Temp Arrester Override ON (master cold at home) 15:04 CDT; asked to watch the
      next boundary -> found the gap while verifying
  why: sunset_temp_arrester_override (hvac_override.py:606) hardcodes house_state == 'sleep'. Its SIBLING
    sunset_immune_holds (line ~487) correctly uses `house_state in DURABLE_HOUSE_STATES` = {sleep, away,
    vacation}. Both are invoked from the same call site (hvac.py:1908) with the same new_state. So going
    AWAY or VACATION does NOT release the override -> arrester stays suppressed while the house is EMPTY
    (wasted energy) and the toggle no longer matches reality.
  operator_requirement: '''the toggle has to flip itself off when a house state invalidates it. So the
    toggle always matches reality.'' - away/vacation invalidate a comfort override; current code honors
    only sleep.'
  fix: replace the hardcoded 'sleep' check with `house_state in DURABLE_HOUSE_STATES` (matching the sibling).
    Keep the 6h COMFORT_OVERRIDE_MAX_S decay as the other first-of. Anchor with a test per durable state
    + a mutation drill.
  parsimony:
    problem: override survives away/vacation -> arrester suppressed in an empty house
    verdict: BUILD
    note: one-predicate fix; sibling function already has the correct form
  next: fold into the SECC-1 build batch; Tier 2-DB (HVAC governance)
  refs:
  - domain_coordinators/hvac_override.py:584-624
  - domain_coordinators/hvac_const.py:206
  - domain_coordinators/hvac.py:1908
  refinement:
  - challenge: 'operator: "Home evening should also cancel it. Its a durable house state"'
    sharpened: verified home_evening IS in the canonical vocabulary and DURABLE_HOUSE_STATES has only
      ONE consumer (contained ripple) -> widened the allowlist
  - challenge: 'operator: "basically Arriving, and Guest are the things that should leave it alone"'
    sharpened: INVERTED allowlist->denylist. ARRESTER_HOLD_PRESERVING_STATES={arriving,guest}; everything
      else invalidates. Omission was the original bug, so enumerate only the 2 exceptions, not the 7 cancellers.
  - challenge: 'I warned home_evening cancelling might recreate the cold master right as he settles in;
      operator: "No. Predictability is better than guessing here"'
    sharpened: 'DESIGN PRINCIPLE: a temporary override releases on ANY real context change - one rule
      you can hold in your head. Rejected the heuristic that guesses when the operator still wants it.
      Do NOT re-complicate this with per-state special cases.'
  - challenge: 'operator: "Why not add home_night?"'
    sharpened: 'moot under the inversion - home_night is not in the preserve set so it already cancels.
      My earlier "do not add" was allowlist-era conservatism. Demonstrates the denylist virtue: no enumeration
      of cancellers = no omission risk.'
  - challenge: 'operator: "I think waking may not be durable. When is it?"'
    sharpened: 'VERIFIED from house_state.py: waking is the morning twin of arriving - reachable ONLY
      from SLEEP, exits only to HOME_DAY/AWAY, 60s hysteresis (same transient tier as arriving 60s; vs
      home_* 120s, guest 300s, sleep 600s, vacation 7200s). Preserve set -> {arriving, guest, waking}.'
  - challenge: verifying waking exposed that preserving transient states is DECORATIVE - an override set
      during waking/arriving dies ~60-120s later when the house settles into home_day (which invalidates)
    sharpened: 'added ARRESTER_OVERRIDE_MIN_LIFE_S=900 (15min) minimum-life grace. One-sentence contract:
      "flipping it on always buys at least 15 minutes; after that any real context change ends it." Solves
      the class without per-state cleverness (which the operator rejected). Grace never outranks the 6h
      max-age; 0 disables.'
  - challenge: 'operator: "if the house state changes before 15, when that elapses, it recognizes it should
      change immediately"'
    sharpened: 'CAUGHT A BUG IN MY OWN SPEC: the grace as written SUPPRESSED an event-driven sunset =
      DISCARDED it (nothing re-fires) -> override would silently survive to the 6h max-age. Grace must
      DEFER (record pending obligation + one-shot timer at expiry + periodic-sweep backstop), not cancel.
      Dropped-obligation class.'
  - challenge: my own design check on the discharge mechanism
    sharpened: discharge must NOT be "re-evaluate current state at expiry" - engaging during home_day
      with NO transition would then kill EVERY override at exactly 15min. Must stay TRANSITION-triggered;
      pinned by a dedicated regression-guard test.
  bug_precise: hvac_override.py:603 `if reason == 'durable_state' and house_state == 'sleep'` (INLINE
    LITERAL) vs its sibling hvac_override.py:487 `house_state in DURABLE_HOUSE_STATES` (SHARED CONSTANT).
    Both invoked from the SAME call site hvac.py:1908 with the SAME new_state, answering the SAME policy
    question. They diverge; nothing forces agreement.
  bug_class: 'DIVERGENT DUPLICATE PREDICATE (policy fork) - one policy expressed in two places, one drifts.
    THIRD instance in 2 days: v5.59.0 CRITICAL (resolver learned _smart_motion_human, dedup stripper kept
    its own narrower tuple) and SNAP-1 (media_url vs media_path). Recurring skeleton: a second site RE-IMPLEMENTS
    a rule instead of CONSUMING it.'
  guard:
  - '1. Policy exists ONCE: house_state_invalidates_arrester_hold() called by both sites.'
  - '2. Anti-fork source test: no `house_state == "` literal in hvac_override.py - the fork becomes unwritable,
    not merely absent.'
  - 3. Table-driven test parametrized FROM HOUSE_STATE_TRIGGER_VALUES over all 9 states for BOTH functions
    -> adding a 10th state FAILS until classified. Guards against reintroduction-by-omission, which is
    exactly how this bug appeared.
  - '4. Fail-safe default: unclassified state INVALIDATES (arrester regains governance) rather than holding
    a suppression forever.'
  knobs:
  - name: ARRESTER_HOLD_PRESERVING_STATES
    rung: 1
    why: '{arriving, guest, waking} - the only states that do NOT invalidate; everything else does (fail-safe
      default)'
  - name: ARRESTER_OVERRIDE_MIN_LIFE_S
    rung: 1
    why: 900 (15min) minimum life; 0 disables the grace
  - name: COMFORT_OVERRIDE_MAX_S
    rung: 1
    why: existing 6h decay - the other first-of; min-life must never outrank it
  known_limitations:
  - restart mid-grace may lose the in-memory pending-sunset obligation unless persisted - builder instructed
    to persist or explicitly document + report
  organic_open: engage the override, then confirm it releases on the next real context change (or 6h decay)
    and the switch flips OFF to match
