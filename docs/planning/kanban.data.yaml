  - 'P24: "Instinct is to fix" — APPROVED to fix. Likely needs BOTH investigation options, not one:
    (A) move the failsafe check AFTER the camera/BLE overrides at :2490/:2597, which currently re-seed
    _became_occupied_time after the check so override-held rooms can never accumulate duration; AND
    (B) re-base the freshness test on _last_pir_motion_time instead of _last_motion_time, which is
    refreshed to now() at :2332 on the same tick and makes the skip a tautology (27/27 suppressed).
    Fixing only one leaves the other leg blind. Needs its own scoped cycle + tier call.'
  - 'D3 FROZEN TRACKER: "Kill it." — APPROVED for deletion, not repair. Removes the detector in
    person_coordinator.py, its NM kind, CONF_FROZEN_TRACKER_DAYS / DEFAULT_FROZEN_TRACKER_DAYS
    (const.py:3120-3121), its config-flow field and its tests. Consistent with the earlier drop from
    the ledger migration set (M6). Rationale on record: structurally unreachable — 2.0 d threshold vs
    max 1.01 d uptime across 26 deploy-driven restarts; it cannot catch the Ezinne 3-day freeze it was
    built for, and will not at this release cadence.'
  SEQUENCING_NOTE: 'P24-fix and D3-kill both touch coordinator.py / person_coordinator.py. The
    SENSOR-CAPABILITY-1 fix-up is concurrently editing coordinator.py on sensor-cap-rebase. Queue these
    two BEHIND that merge rather than running them in parallel — worktree isolation prevents corruption
    but not merge conflicts in the same function region.'
  next: 'OPERATOR DECISION 2026-08-09: DROP D1/D3/P24 from the ledger migration set ("1 want to drop.
    Some are rare. Not a bad thing."). Ledger migration set reduces to M1 (P22), M3 (P18), M5 (D2) +
    M7 (P14, hand-built). Open sub-question the operator DID want answered: WHY D1 and P24 do not fire —
    correctly-rare vs mis-thresholded vs structurally-blind. Under investigation in
    AUDIT_detector_silence_and_restart_causes.md. D3 remains structurally unreachable regardless; whether
    to FIX (persisted timestamp) or leave it is a separate call, not blocking.'
  operator_decision_2026_08_09: 'DROP from migration. Rarity is not itself a defect — a detector guarding
    a condition that genuinely does not occur is working. This does NOT close the question of whether the
    thresholds are right; it only removes them from the ledger cycle so they stop blocking M4/M6 scoping.'
  refs:
  - docs/planning/AUDIT_ledger_golden_fixture_yield.md (the probe + orchestrator escalation)
  - custom_components/universal_room_automation/const.py:3099,3121
  DEDUPE_2026_08_09: 'Four-surface sweep: STUCK-SENSOR-1 is adjacent (shares the no-persistence root
