  title: Override arrester reverts occupant manual cooling requests with no comfort exemption
  thread: hvac
  status: shipped_organic
  shipped_version: v5.69.0
  approval: approved
  review_state: 'Cycle A built (18b491e01, 28 tests, kids-replay authentic). Tier-3 4x reviews: B SHIP;
    A/C/D DO-NOT-SHIP with DISJOINT blockers — A-CRIT-1 occupancy gate read static zone_persons config
    list not live occupancy; D-CRIT-1 DPM apply ungated + 3 hvac_predict emitters + AI-rules climate bypass
    (real R2-residual site found in coordinator.py, plan had mislocated it); C-H5 hvac.py-side consumer
    mutation-untested. Consolidated 19-finding fix-up dispatched 2026-08-10. AI-rules climate: cheap-block
    chosen (zero live climate rules), route-through-chokepoints parked.'
  origin:
    date: '2026-08-09'
    gist: 'operator: "I think manual were kids trying to cool their space and the arrester stops them"'
  why: 'Observed tonight: zone_2 preset went to `manual` at 16:49 and again at 17:14 — the kids walking
    to the thermostat in an 80F room and asking for cooling. The override arrester reverted both within
    10 and 5 minutes respectively. After 17:19 there are NO further manual writes: they gave up. The system
    trained them that the thermostat does not work.'
  sharp_problem: A manual cool request, from an occupied zone, at 80F, during recovery from a 24h absence,
    is the single highest-quality signal in the building — a human walked to a wall and said they are
    uncomfortable. The arrester treats it as noise to revert. Its only escape hatch is the separate temp_arrester_override
    switch, which the kids do not know exists and which had sunset.
  fix_direction: Exempt (or substantially delay) arrest when the zone is occupied AND the manual change
    moves toward comfort AND the temp delta is large. Arresting inside 5-10 minutes is worse than not
    arresting at all — the occupant never feels an effect, so they learn the control is broken.
