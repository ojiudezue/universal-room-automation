  - 'CONSOLIDATED FIX-UP (all 3 reviews): (1) union sighting-filter _get_shared_space_cameras + activity-check
    with Protect set [A-CRIT-1/B-L1 - THE core value]; (2) collapse sightings by device_id at record time
