- id: EVCARD-1
  title: EV charging detail card for the URA v8 Energy tab
  thread: dashboarding
  status: waiting_operator
  approval: explicit
  approved_by: operator 2026-08-09
  origin:
    date: '2026-08-09'
    gist: '"add an EV charging detail card to the Ura v8 energy tab. Style well. Detail cards are a bit
      sensor words vomit. Best judgement because of space though."'
  why: EV charging is a first-class energy behaviour (drain precedence, must-start-by, TOU exposure) with
    no dedicated surface on the v8 energy tab.
  constraints:
  - 'STYLE IS PART OF THE ASK. Existing detail cards are "sensor word vomit" — dense raw-entity dumps.
    Do NOT add another. Design for scanning: state first, numbers second, raw entities last or hidden.'
  - 'Space-constrained — operator explicitly delegated judgement on what to cut. Curate ruthlessly;
    completeness is not the goal.'
  - Reuse existing EV/EVSE entities and precedence concepts; do not invent new sensors for the card.
  next: 'REDESIGNED 2026-08-16 after operator verdict "design is poor — review the main sensors."
    Full sensor discovery this time: ev_charging_status per-EVSE attrs (is_on/power/charging/
    pause_reason_human — power WORKS while the standalone ev_charge_rate_* sensors sit unknown),
    ev_charging_plan DP state machine (must_start_by_dt, last_eval_snapshot), battery_strategy
    (next_decision_boundary, force-charge, soc), L1-charger plug binary, resume-at-SOC number,
    current_energy_rate. New card: verdict header w/ TOTAL live kW from status attrs; per-charger
    table (plug/state/kW) sourced from attrs not the dead Emporia sensors; NEW anomaly line "plugged
    but not drawing" (would have surfaced the Garage-A overnight no-charge incident); Plan line +
    must-start-by; battery-drain resume threshold when paused; Next TOU boundary w/ expected EV
    action; grid ¢/kWh; force-charge 30-min tile added. Cut: raw Emporia/SPAN entities (unavailable),
    eval snapshot internals, arbitrage/grid-cap lists when empty. Applied views[2].sections[8],
    write_committed + post_write_verified, template eval-verified live. No vehicle-side integration
    exists (BMW/Tesla sweep empty) — vehicle SOC/target impossible until one is added.
    AWAITING OPERATOR RE-REVIEW. FIX 2026-08-16: operator flagged the constant Outlets 2.9 kW — it
    is a BY-DESIGN estimate (energy_pool emits L1_ESTIMATED_POWER_W=1440 per on-socket with
    power_source "switch_status"; audit AUDIT_ev_sensor_surface.md verdict 3), not a measurement.
    Card now renders any power_source=="switch_status" value as an estimate ("~2.9 est" row,
    header "2.9 kW (~est)") so estimated never masquerades as measured; real per-plug power arrives
    when the Emporia integration recovers + per-plug wiring ships. Re-applied + render-verified.'
  applied_render_2026_08_09: '## ⏸ Paused / TOU peak/mid-peak pause / [Garage A yes|Paused|0.0 kW]
    [Garage B —|Off|0.0 kW] [Outlets (2) —|TOU peak/mid-peak pause|—] / **Plan:** Hold Only · held 53h
    — 7 lines, zero None/unavailable/unknown, all four conditional lines correctly absent.'
  fix_2026_08_09_held_label: 'Operator: "What does held 53h mean?" — it was WRONG. Verified in source:
    since is stamped on every DP state transition (energy_drain_precedence.py:265) and HOLD_ONLY CLEARS
    hold_started_at as a "clean reversion" (:269-274); DPState docstring says HOLD_ONLY = "Default;
    master switch off OR eval said no". So HOLD_ONLY is the RESTING state — nothing held — and "held
    53h" asserted the opposite of the truth (a reader would think their car had been blocked for two
    days). Replaced with a state-aware line: hold_only -> "idle — no hold on charging · unchanged 53h";
    transitioned -> "EVSEs paused for battery drain since <time>" (transitioned_at); otherwise ->
    "· holding <n>m" (hold_started_at). Verified live + storage re-read (str.replace is a silent no-op
    on a miss and the write reports success regardless).'
  ARRESTER_TILE_2026_08_10: 'Operator aside: temp override arrester onto the ura-v8 HVAC (Climate)
    tab for quick access. DONE — new section at climate view position 1 (right under the hero, above
    the thermostats): heading w/ live state badge + full-width toggle tile named "Let my manual changes
    stick" + one conditional status line (engaged-Nm-ago + 6h expiry + sunset semantics when ON;
    "flip on before adjusting setpoints" when OFF). Verified rendering live (switch currently ON,
    26m — interesting: it re-engaged today, presumably re-enabled after last night''s 6h sunset).
    Anti-word-vomit rules applied; no raw attr dump.'
  MULT_SPLIT_APPROVED_2026_08_10: 'Operator: "Clean break. Timing is fine." — BLE_CHAIN_HOLD_ENABLED
    (bool kill switch) + separately named D2 staleness multiplier; NO deprecated alias (single-user
    no-backcompat). Rides the P24/D3/dropdown batch.'
  refinement_candidates:
  - 'REDUNDANCY: the headline reason and the Outlets row currently show the same string twice
    ("TOU peak/mid-peak pause") because the outlets are the only endpoints holding a reason. Options:
    drop the reason from the endpoint row, or drop it from the headline when only one distinct reason
    exists. Left as-is pending operator eye — it may read as useful attribution rather than repetition.'
  - 'Retrofit the same conditional rendering to the sibling Battery Strategy Detail card (~30 min).'
  bug_caught_pre_ship: 'The markdown card auto-detects entities from LITERAL entity IDs in the template.
    This template reaches them through Jinja VARIABLES (states(s)), so auto-detection would have missed
    them and the card would never re-render on state change — it would sit stale until an unrelated
    repaint. Fixed by adding the explicit entity_id watch list. Caught by reading the HA dashboard
    best-practices guide, not by testing.'
  design_notes:
  - 'Anti-word-vomit rules applied: (1) narrative first — pause_reason_human leads, and nothing on the
