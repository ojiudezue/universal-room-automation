    a specific person was OBSERVED crossing an egress from outside to inside. That crossing is strong,
    causal evidence a body entered the interior population — independent of whether interior cameras/BLE
    picked them up. S1 (scope 2, gated) once egress events carry identity (scope 1), feed confirmed exterior->interior
    transitions into the interior count as a corroborating/strengthening signal — a known crossing raises
    confidence, an UNKNOWN crossing is the guest-corroboration path. Never a blind increment: it must
    reconcile with what the interior substrate already sees, not double-count a person both surfaces observe.'
