- id: STUCK-SENSOR-1
  title: Flapping mmWave evades stuck-exclusion; fix via corroboration-gated exclusion at the ROOM tier
  thread: presence
  status: shipped_organic
  shipped_version: v5.75.0
  approval: explicit
  approved_by: 'operator 2026-08-09 ("and what comes after it") — the chatter/reliability cycle that
    follows SENSOR-CAPABILITY-1, absorbing the mmwave-Tier3 D6 parked deliverable. NOTE: this approval
    does NOT extend past the SignalTrustLedger''s own GO criteria — its criterion 4 (golden-tap fixtures)
    is unmet and is a hard blocker independent of approval.'
  tags:
  - tier-2db
  - no-fabrication-verify
  - context-wide-scoping
  origin:
    date: '2026-08-09'
    gist: operator diagnosed a stuck Zigbee mmWave holding master occupancy; asked why I did not see it
  why: 'URA''s duty-cycle detector DOES catch stuck sensors and logs: ''Sensor <x> duty-cycle stuck (on-ratio
    exceeded over rolling window) — NOTIFY-ONLY, not excluded from occupancy''. It then KEEPS USING the
    stuck sensor for occupancy. Detection without consequence. Tonight that produced: master bedroom reported
    occupied while its inputs read off -> comfort fans ran in an empty bedroom (operator not home); Garage
    B occupied off a chattering ratgdo; Living Room and Study A both flagged stuck. Occupancy feeds HVAC,
    lighting and presence trust, so the blast radius is wide.'
  my_miss: 'I READ these exact warnings hours earlier and dismissed them as ''routine, not a crash'' —
    I was scanning for crashes, so a WARNING that was not a crash read as noise. The message named its
    own defect and I skimmed it. Rule: a warning that says STUCK is never routine; read content, not severity
    class.'
  gaps:
  - '1. NO CONSEQUENCE: stuck sensors are not excluded from the occupancy substrate.'
  - '2. NO SURFACE: the only signal is a WARNING log line — no sensor, no NM note, no dashboard. Invisible
    unless a human is tailing logs at the right moment.'
  - '3. NO PERSISTENCE: like the echo counter, any stuck-state tally resets on restart, and we restarted
    7+ times today.'
  fix:
  - 1. Graduate D2 to exclusion behind the house-state gate the code always planned ('exclusion graduates
    in a later cycle behind a house-state gate'). The sleeping-person objection holds for bedrooms in
    sleep/home_night; it does NOT hold when the house is away.
  - 2. Propagate stuck-sensor state to zone + house tiers — today they cannot see it at all.
  - '3. Fix the independence assumption: correlated stuck sensors must count as ONE confirmation source,
    not N. Two occupied rooms whose sensors are both flagged stuck is one signal.'
  parsimony:
    problem: a stuck sensor silently fabricates occupancy and drives fans/HVAC/lighting in empty rooms
    verdict: BUILD
    note: detection already exists; this is wiring a consequence + a surface to it, not new inference
  next: 'BLOCKED on SENSOR-CAPABILITY-1 — do not scope exclusion until capability/role are separated,
    else the corroborator must be hardcoded as PIR (the defect). Then: per-room corroborator capability
    map from AUDIT_mmwave_only_rooms_2026-07-31.md; six no-PIR rooms need a non-PIR corroborator or stay
    notify-only.'
  depends_on:
  - SENSOR-CAPABILITY-1
  CORRECTION: '2026-08-09: my first version of this card was WRONG on three counts — I asserted mechanism
    from a LOG STRING instead of reading the code (operator: ''a log line does not reality make''). Corrected
    by verification: (1) it is NOT ''detection without consequence'' — the CONTINUOUS rule DOES exclude
    (coordinator.py:1960-1967, comment ''Continuous rule DOES exclude''); (2) D2 duty-cycle being NOTIFY-ONLY
    is a DELIBERATE, well-reasoned choice, not an oversight — ''a sleeping person is ~100% mmWave duty
    cycle with zero PIR, and excluding would vacate sleeping bedrooms''; (3) it is NOT invisible — both
    rules fire an NM note via _fire_stuck_sensor_nm with per-day dedup.'
  verified_findings:
  - 'ROOM TIER: continuous rule excludes but keys off _sensor_on_since, which a FLAPPING sensor resets
    each off-tick -> flapping never accumulates -> never excluded (coordinator.py:1960-1967).'
  - 'D2 duty-cycle catches flapping but is deliberately NOTIFY-ONLY: ''a sleeping person is ~100% mmWave
    duty cycle with zero PIR, and excluding would vacate sleeping bedrooms''. Sound reasoning, not an
    oversight.'
  - Both rules DO fire an NM note (_fire_stuck_sensor_nm, per-day dedup) — this is not invisible.
  - The D2 comment names a PRIOR 'Master Bedroom empty-suite incident' — tonight is a repeat of a known
    failure mode.
  - ZONE (aggregation.py) and HOUSE (presence.py) have no stuck-sensor awareness — verified by grep.
  RETRACTION_2: '2026-08-09 (second correction, operator challenge ''the stuck sensors are not correlated
    afaik''): I claimed the stuck sensors were a CORRELATED failure (same vendor/firmware/night) and built
    a ''falsified independence assumption'' + ''closed loop'' argument on it. VERIFIED FALSE: Living Room
    = Screek Human_Presence_Sensor via esphome (direct); Study A = HOBEIAN 24Ghz via mqtt (through a coordinator).
    Different manufacturer, model, transport, topology. I inferred correlation from CO-OCCURRENCE IN A
    LOG WINDOW alone. Co-occurrence is not correlation. RETRACTED: the house-tier ''2+ rooms occupied
    = unlikely all stuck'' assumption is NOT falsified and stands; the closed-loop claim collapses with
    it.'
  solution:
  - DISCRIMINATOR IS CORROBORATION, NOT HOUSE STATE. House state fails exactly in the hard case (asleep
    during home_night). A sleeping person pins the mmWave AND a corroborator; a stuck mmWave pins only
    itself.
  - 'Exclude a duty-cycle-stuck sensor when NO independent corroborator supports occupancy: bed presence,
    recent PIR, BLE person in room, camera person. D2 already uses PIR corroboration to guard DETECTION
    — extend the same principle to EXCLUSION.'
  - 'Tonight this would have released master immediately: bed presence read OFF while occupancy read ON.'
  - 'CAVEAT: rooms whose ONLY input is a single mmWave have no corroborator and cannot be discriminated
    — for those, notify-only remains correct. This is a per-room capability question, not a global policy.'
  DEDUPE_2026_08_09: 'Chatter/motion-chatter arrived as a candidate NEW card and was folded in here
    instead (adjacency check per kanban dedupe rule): same detector, same exclusion decision, same
    corroboration discriminator. No CHATTER-1 card exists or should.'
  third_class_chatter:
  - 'CLASS 3 = CHATTER (transition-rate). A sensor oscillating at ~50% duty is invisible to BOTH shipped
    rules: every off-tick resets P22 continuous-on, and the on-ratio never reaches D2 85%. Evidence:
    Garage B ratgdo 24h = 3,769 off / 3,765 on / 6 unavailable — real oscillation, not transport.'
  - 'MOTION IS UNSCORED BY DESIGN: D2 candidates are mmwave_sensors + occupancy_sensors only (PIR excluded
    as "our corroboration source"). So a chattering PIR is never diagnosed AND it SHIELDS a stuck mmWave
    — D2 corroboration is satisfied by >=2 PIR transitions in-window, which chatter trivially supplies.
    The anchor can be the thing that is broken. Operator: ratgdo has no PIR; it supervises MyQ garage
    motion, and Zigbee/Z2M can make that flicker or go unavailable.'
  - 'UNREACHABLE ROOMS: Garage B has mmwave_sensors=None, occupancy_sensors=[] -> D2 candidate set is
    empty there. The room where the incident happened is outside the detector regardless of thresholds.'
  shipped_context:
  - 'D1-D4 ALL SHIPPED v5.35.0 (commit 0192ac2c3, 2026-07-28 23:18 CDT) + v5.35.1 hotfix + v5.35.2
    observability. Do not re-scope them.'
  - 'The shared abstraction that shipped is the NOTIFIER (_stuck_signal_nm, D4), NOT a shared detector:
    "Detection + discount + notify ONLY... never actuates, never mutates detector state". Detection is
    four bespoke impls sharing only a kind= string.'
  - 'The plan PARKED unification with an explicit trigger: "after D1..D4 ship and the shape is proven at
    four sites; separate design cycle." That trigger HAS NOW FIRED (12 days, four live sites).'
  approach: 'PATCH A CENTRAL METHOD, NOT A FIFTH DETECTOR (operator 2026-08-09: "should not do this in
    isolation or it should be a patch of a central class/method" + "do the right thing unified or not").
    Generalise _detect_duty_cycle_stuck into a per-sensor reliability scorer over ALL binary sensor kinds
    scoring on-ratio + transition-rate + unavailable-rate, emitting kind= per class through the existing
    D4 notifier. Do NOT force the census (person COUNT) and frozen-tracker (timestamp AGE) detectors into
    it — different shapes; they keep their own detection and keep sharing D4. Honest scope: one central
    scorer for binary sensors, not one function for everything.'
  FLEET_ROT_RETRACTION: '2026-08-09 (third correction, operator challenge "I don''t think a third of
    the fleet is bad"): I claimed a third of the corroborator fleet was dead, generalising B-2026-08-04-2''
    "5 of 13" — which is 5 of a 13-entry HAND-PICKED ADJACENCY LIST from one probe, not 5/13 of the
    fleet. MEASURED: 503 presence-class binary_sensors, 30 unavailable/unknown = 6.0%, clustering into
    ~15 physical devices. RETRACTED: the "fleet rot gates corroboration logic" argument. STANDS: a
    5-unit HOBEIAN cluster is down together (hypothesis, not asserted mechanism) — ops item, not a gate.'
  D0_AUDIT_DONE: '2026-08-09: docs/planning/AUDIT_mmwave_only_rooms_2026-07-31.md written (was owed
    since 07-31 as D0 of the mmwave Tier-3 cycle and never done; cycle shipped without it). Key
    results: 5 MMWAVE_ONLY rooms + Master Bedroom MMWAVE_NO_PIR = SIX rooms with zero PIR, so D2 can
    detect but NEVER corroborate there (corroborator class empty by config) — this is the structural
    cause of both the 08-09 incident and B-2026-08-04-1 spam. Master bed sensor sits in
    occupancy_sensors = it is a D2 CANDIDATE, so the ideal discriminator is being judged instead of
    consulted. Study A has an ORPHAN mmwave_sensors key no code reads (CONF_MMWAVE_SENSORS ==
    "presence_sensors"), holding an unavailable Athom entity.'
  OPERATOR_DISPOSITIONS_2026_08_09:
  - 'ATHOM (Study A): CLOSED as a no-op. Operator: "Ignore athom now. It''s a no op." URA already does
    not read it (options override every bucket); the ESPHome device entry stays. Do NOT re-raise, do NOT
    propose deleting the entry or cleaning the orphan mmwave_sensors key.'
  - 'HOBEIAN 5-unit cluster: PARKED until operator is home. Operator: "Leave hobeian until I get home.
    It''s mostly z2m hygiene." Not a URA defect and not a gate on any cycle — it is Zigbee2MQTT
    housekeeping, operator-owned, physical. Do NOT re-raise as a blocker on corroboration work; the
    measured fleet-bad rate is 6.0% and does not gate the cycle.'
  rejected:
  - PROPAGATE STUCK STATE TO ZONE/HOUSE — I recommended this and then withdrew it under challenge ('is
    this flow upwards useful?'). If the room tier excludes correctly the corrected occupancy propagates
    naturally and upper tiers are right for free. Propagation adds a cross-tier concept, new state and
    new failure modes to fix something better fixed at source. Only justified as a FALLBACK where the
    room tier genuinely cannot discriminate and upper tiers should down-weight.
  amendment_approved_2026_08_13: 'Operator approved the criterion-4 amendment (offline replay harness + hand-built supplement; runtime tap DROPPED — recorded in PLANNING_signal_trust_ledger_abstraction.md). Unblock path ACTIVE: build/ledger-golden-replay harness in flight -> then this cycle builds.'
  harness_landed_2026_08_13: 'Replay harness MERGED (fe9bfc845): P22 (13/5) + D2 (56/3, boot-settle unmodelled -> discount vs audit 13) FILLED from replay. Remaining criterion-4 work before this cycle builds: hand-built supplements for P24/P18/D1/CHATTER (operator sign-off required per amendment) + adjudicate D3 bucket (its frozen-tracker detector was DELETED 2026-08-10 — bucket likely obsolete, minimums need a plan edit) + P18 NM-ledger ingestion follow-up. Hand-building the supplements is orchestrator work, queued behind the circling/QoL wave.'
  approved_2026_08_13: 'OPERATOR APPROVED (during AWAY-BLOCK-1 incident review: "Stuck sensor is approved"). Spec confirmed to operator: it ACTUATES (corroboration-gated exclusion at room tier), not notify-only. Taxonomy caution from the incident: fan-latch is TRUE motion mis-attributed, not sensor pathology — verify during plan/build that the exclusion gate keys off the duty FLAG (which fired here) and composes with fan-aware demotion, or the build fixes stuck-class only. Remaining blocker: criterion-4 hand-built fixture supplements (orchestrator queued, pulled forward) + operator sign-off on supplements + D3-bucket obsolescence adjudication.'
  build_dispatched_2026_08_13: 'Plan rev-2 (plan review: HIGH corroborator-window-subsumed -> 900s + still-person test; P22 restore-poisoning boot guard; fixture emit-only-when-True + replay pre-deploy gate; merged-accessor pin). Build in flight (worktree). Criterion-4 CLOSED same day (signed supplements merged).'

- id: SENSOR-CAPABILITY-1
  title: Separate sensor CAPABILITY (hardware kind) from analytic ROLE — kind is currently the config bucket
  thread: presence
  status: shipped_organic
  shipped_version: v5.65.0
  approval: explicit
  approved_by: 'operator 2026-08-09 ("Approving sensor capability plan and what comes after it")'
  tags:
  - tier-3
  - institutional-context
  - no-fabrication-verify
  - context-wide-scoping
  - numbers-get-knobs
  origin:
    date: '2026-08-09'
    gist: 'operator ruling on whether bed presence moves bucket or code changes: "My instinct is code
      change so we don''t have fixed config buckets. Sensor reality should not pin use and analysis
      reality in software. It should just tell us what the hardware layer is. We could also add more
      options or detail to the kind of sensor in config"'
  why: 'VERIFIED: occupancy_substrate.py:81 _KIND_TO_CONF maps kind 1:1 onto the three CONF lists, and
    const.py:342 TIER1_KINDS = ("motion","mmwave","occupancy"). URA has exactly three sensor kinds and
    they ARE the three config buckets, so the hardware wiring declaration and the analytic role are one
    field. A bed sensor cannot declare itself a bed — it inherits "occupancy" (const.py:335 comment:
    "Combined motion+presence sensors", an ambiguity bucket), and that membership is the ONLY reason it
    is a D2 stuck-candidate rather than a corroborator.'
  root_cause_of:
  - 'Master Bedroom: the ideal discriminator (bed presence) is JUDGED instead of CONSULTED.'
  - 'Six no-PIR rooms have no corroborator NOT because they lack independent evidence but because
    "corroborator" is hardcoded to mean the motion bucket. Game Room, Jaya Bedroom, Living Room,
    Study A, Study B (MMWAVE_ONLY) + Master Bedroom (MMWAVE_NO_PIR).'
  - B-2026-08-04-1 overnight notification spam (beds/bedroom mmWave flagged for being state-normal ON).
  unlocks_without_new_hardware:
  - 'Master Bedroom already HAS an ideal corroborator: the bed — independent failure mode, physically
    unspoofable — the moment role stops being pinned to the motion bucket.'
  - Study A room_cameras + BLE become nameable corroborators for the mmWave-only class.
  design:
  - 'KEEP the three CONF lists as the WIRING layer — no config migration, additive only.'
  - 'ADD a per-entity capability descriptor (kind, trust, failure-mode class), inferred from
    device/integration where possible, operator-declarable where genuinely ambiguous (operator: "add
    more options or detail to the kind of sensor in config"). Default = today''s bucket-derived value
    so behaviour is byte-identical until a capability is declared.'
  - 'DERIVE role per question asked: candidate-for-stuck-scoring vs corroborator-for-independence vs
    creator-vs-extender for occupancy. Role is computed, never stored in config.'
  - 'Same cut as the intent/evidence axis (PLANNING_paper_and_oss_fusion_library.md sec 7/7b): bed =
    strong evidence, mmWave = weak witness. Neither is expressible today.'
  parsimony:
    problem: hardware wiring pins analytic role, so the best available corroborator in a room cannot be used as one
    verdict: BUILD
    note: 'prerequisite, not an enhancement — corroboration-gated exclusion on the current vocabulary
      MUST hardcode PIR as corroborator, which is the defect itself'
  blocks:
  - STUCK-SENSOR-1
  sibling_of:
  - SIGNAL-TRUST-LEDGER (build-gated)
  depends_on: []
  build_2026_08_09: 'BUILT (worktree commit 141e60939) then REBASED onto current develop as c82290f68
    on branch sensor-cap-rebase. STALE-BASE INCIDENT: the builder worktree was based on 57ba22942
    (v5.50.2), 214 commits behind develop, so its green suite (19f/8125p) described a codebase that no
    longer exists. Cherry-pick onto develop was CLEAN (no conflicts) and _detect_duty_cycle_stuck — the
    riskiest refactor target — was byte-unchanged between base and develop, so a rebase sufficed rather
    than a redo. Re-validated on the real baseline: 21 failed / 8517 passed / 45 skipped / 2 xfailed
    (develop baseline 21f/8494p; +23 = the new tests; failing NAMES unchanged; the A-2/A-3 strict xfails
    survived). Skill updated with a base-verification rule.'
  I1_DEVIATION_for_reviewers: 'The builder KNOWINGLY deviated from byte-identity in one place and
    flagged it: for an entity in BOTH mmwave_sensors and occupancy_sensors (the P15 defensive case),
    pre-migration list-concat DOUBLE-SCORES it (same ring appended twice per tick), which reaches the
    MIN_TICKS=20 warm-up floor in half the ticks. The build dedups to score it exactly once, per the
    plan wording. This is a real behaviour change on that path and therefore a partial I1 violation.
    Reviewer B must adjudicate: take the fix, or preserve the bug for strict byte-identity.'
  build_notes:
  - 'A mutation drill initially PASSED, exposing dead code: the strong_evidence gate was unreachable for
    kind=bed (bed is not in _STUCK_CANDIDATE_KINDS, so it exits earlier). The builder added a test for
    the reachable path (operator declares an mmwave-wired entity as strong_evidence) and re-ran to a
    named failure. The drill protocol caught a hollow anchor before review — working as intended.'
  - 'D4 uses a JSON textarea (TextSelector multiline) because HA has no dict selector. Pragmatic v1.'
  - 'Unverified claim for reviewer B: mid-flight capability override during refresh_subscriptions is
    untested; the builder argues it is safe because the capability layer is not consumed inside the
    substrate and _detect_duty_cycle_stuck re-reads room_config every tick.'
  TIER3_REVIEW_ROUND_2026_08_09:
    A: 'SHIP w/ fix-ups — HIGH-A1 (validator accepted a capability with no kind, silently no-opping the
      cycle headline use case), MED-A2 (failure_mode unvalidated). Verified by reading: _CONF_PRECEDENCE
      matches occupancy_substrate._KIND_PRECEDENCE byte-for-byte; resolve_role total across 7x3x4x3 with
      no silent None; TIER1_CAPABILITIES superset ENFORCED by construction not comment.'
    B: 'SHIP conditional — adjudicated the flagged I1 deviation as TAKE THE FIX (substrate already
      normalises multi-list entities by the same precedence and WARNs; pre-diff double-scoring reached
      MIN_TICKS in half the ticks on half the window). B-MED-1: the carve-out is the whole P15 surface,
      not just mmwave x occupancy. Verified the builder unverified claim: CONF_SENSOR_CAPABILITIES is
      NOT in OPTIONS_RELOAD_SUPPRESS_KEYS so a save triggers a standard room reload; full TIER1_KINDS
      consumer enumeration clean, no half-migrated reader.'
    C: 'SHIP — 13 per-site drills, 3 came back GREEN=untested. C-MED-1 is the 8th hollow-anchor shape:
      wiping the ENTIRE effective_corroborators construction left the suite green, so D3 load-bearing
      claim was unpinned. C also proved the I3 RUNTIME ward has teeth (widening TIER1_KINDS reddens 5
      tests) while the docstring ward is advisory only — both honest about scope.'
    D: 'DO-NOT-SHIP — D-HIGH-1 (I1 violated for hybrid entities under empty overrides) + D-MEDIUM-1 (the
      narrowing question answered YES: an override can evict an entity from BOTH loops).'
  ORCHESTRATOR_ADJUDICATION: 'B/C/D disagreed on ONE line. Resolved by reading source: _STUCK_CANDIDATE_KINDS
    = {mmwave, occupancy} excludes motion (sensor_role.py:73) and _CONF_PRECEDENCE resolves a
    motion+mmwave entity to MOTION, so CANDIDATE_FOR_STUCK returns False on the KIND CHECK ALONE —
    independent of _seen_corr. C drill 13 (delete the branch, suite green) proves it inert. So D-HIGH-1
    is a REAL behaviour change but MIS-ATTRIBUTED, and BOTH of D''s proposed fixes would have been
    NO-OPS. Real cause = precedence-aware role resolution, which B correctly judged correct on merits.
    Disposition: keep the behaviour, DELETE the dead branch and its FALSE comment, document the real
    carve-out. Confirmed independently by the builder drill 6 (precedence inversion reddens both P15
    tests via double-scoring — a different mechanism than the dedup set).'
  FIXUP_2026_08_09: 'bed359d5d, ff-merged onto sensor-cap-rebase. Fixed HIGH-A1, MED-A2, D-MEDIUM-1
    (validator now rejects an override that would leave a motion-wired entity in neither loop), C-MED-1
    (byte-identity anchor + a behavioural test driving production so bed elevation actually reaches the
    corroboration deque), C-LOW-2/D-HIGH-1 (dead branch + false comment deleted), B-MED-1 (planning
    section 10.1 rewritten + motion x mmwave and motion x occupancy analogue tests), the misfiled-hybrid
    collision WARN, and D-LOW-2. Deferred: A-LOW-3/4, A-NIT-5, C-LOW-1, B-LOW-1/2.'
  ORCHESTRATOR_VERIFIED_2026_08_09: 'Did NOT trust the reports (Tier-3 mandate). Personally: ff-merged;
    confirmed the dead branch and false comment are gone (0 occurrences); ran my OWN mutation on the
    load-bearing site (_CONF_PRECEDENCE inverted, py_compile clean) -> 7 NAMED failures incl. the
    byte-identity anchor and both new P15 analogue tests; restored and confirmed git status clean; full
    suite 21 failed / 8525 passed / 45 skipped / 2 xfailed (baseline 21/8517, +8 = the new tests, failing
    NAMES unchanged).'
  AWAITING: 'TIER-3 OPERATOR CHECKPOINT BEFORE DEPLOY (mandatory per CLAUDE.md). Not merged to develop.'
  known_gap: 'The misfiled-hybrid collision WARN has no dedicated test asserting the emit path (it fired
    incidentally in a drill). Would need _LOGGER mocking or caplog scaffolding on the coordinator logger.
    Say the word and it gets one.'
  next: 'PLAN WRITTEN 2026-08-09 (docs/planning/PLANNING_sensor_capability_vs_role.md, 477 lines).
    Tier 3, four framing-disjoint reviews, operator checkpoint before deploy. AWAITING OPERATOR GO —
    Tier 3 shared primitive, not implied-approval eligible.'
  status_note: plan complete; build gated on operator go
  refinement:
  - 'CHALLENGE (planner, vs my card sketch): the sketch read as if capability might extend TIER1_KINDS
    and the substrate DISPATCH payload. SHARPENED: keep the substrate channel TIER1_KINDS-valued and run
    capability at the CONSUMPTION site instead. Extending TIER1_KINDS touches every consumer AND trips
    _audit_provenance_invariants (presence.py:384) which RAISES on unknown keys — blast radius O(n) per
    added kind. Consumption-site resolution bounds it to O(1). This is the insight that makes the cycle
    tractable; my sketch would have made it a rewrite.'
  - 'CHALLENGE: my sketch said "inferred from device/integration where possible". SHARPENED: NO
    auto-inference in v1 — operator-declarable only, with an evidence trigger to revisit. Rationale:
    manufacturer/integration sniffing is a rare-fire path with poor observability, and the Bug Class #46
    history is lazy defaults mis-classifying silently. Note this lands closer to the operator''s own
    words ("we could also add more options or detail to the kind of sensor in config") than my sketch did.'
  - 'CHALLENGE: "kind, trust, failure-mode" as free-form fields. SHARPENED: each constrained to a small
    enumerated vocabulary (TRUST_CLASS_*, FAILURE_MODE_* at rung 1); open strings would defeat the
    role-query matrix''s testability.'
  invariant: 'I1 — with no CONF_SENSOR_CAPABILITIES declared anywhere, get_all_room_kinds, every
    SIGNAL_SUBSTRATE_KIND_CHANGED dispatch, _room_provenance, _detect_duty_cycle_stuck''s return set and
    every exposed entity attribute are BYTE-IDENTICAL to today. I2 roles never persisted across a tick.
    I3 capability MUST NOT leak into the legacy provenance channel.'
  riskiest: '_detect_duty_cycle_stuck migration. Its positional signature (motion, mmwave, occupancy) is
    itself a legacy reification of _KIND_TO_CONF. An entity present in BOTH mmwave_sensors AND
    occupancy_sensors (the P15 defensive case, occupancy_substrate.py:214-222) must be scored EXACTLY
    ONCE by resolve_role, matching today''s concatenation semantics. Reviewer C must mutation-cover that
    collision. Second: a future builder adding "bed" to _audit_provenance_invariants''s allowlist would
    silently undo I3 — the audit docstring must state the vocabulary is closed by design.'
  refs:
  - docs/planning/AUDIT_mmwave_only_rooms_2026-07-31.md (Finding 6 — root cause)
  - docs/planning/PLANNING_mmwave_corroboration_tier3.md (Amendment 4)
  - docs/planning/PLANNING_signal_trust_ledger_abstraction.md (Addendum 2026-08-09 — ledger assumed this layer)
  - custom_components/universal_room_automation/domain_coordinators/occupancy_substrate.py:81
  - custom_components/universal_room_automation/const.py:335,342
  DEDUPE_2026_08_09: 'Four-surface adjacency sweep run before creating this card. Board: adjacent to
    STUCK-SENSOR-1 (which it now BLOCKS) — kept separate because the shared surface is
    OccupancySubstrate/TIER1_KINDS, not the stuck detector, and STUCK-SENSOR-1 cannot be built
    correctly first. BACKLOG.md: B-2026-08-04-1 is downstream (its memory-baseline exemption still
    applies per-room after this lands); B-2026-08-04-2 unrelated (ops). Parked planning-doc
    deliverables: mmwave-Tier3 D4 (unrelated, still parked), D6 (absorbed into chatter work, not here).
    Catalogs: CATALOG P15 substrate kind-precedence is the primitive being changed — extend, do not
    roll new. NEW, not duplicate.'
- id: BOARD-CURRENCY-1
  title: Forcing-function ladder so the board (and vibememo) cannot lag shipped work
  thread: process
  status: shipped_organic
  approval: explicit
  approved_by: operator 2026-08-09
  tags:
  - numbers-get-knobs
  - institutional-context
  origin:
    date: '2026-08-09'
    gist: 'operator on the stale board: "A banner is not a forcing function. Is there a harder one? A
      kanban that does not keep current is fairly useless" -> then "yes deploy gate with softer backups
      as well (the other 2 or 3). We should also chain to Vibememo"'
  why: 'Board reconciliation is the ONLY step in the deploy ritual with no forcing function. deploy.sh
    refuses without tests and without a README; NOTHING refuses without a board update, so it is the
    only step running on willpower — and it rotted twice (2026-08-09: board said "build" for XCORR-1 and
    SNAP-1, both already shipped as v5.64.0/v5.63.0). meta.last_reconciled correctly read 2026-08-07 and
    nothing surfaced it. Root cause is NOT a missing rule (the skill carries three hooks covering it).'
  constraints:
  - 'A failed board/vibememo write MUST NOT abort a deploy that has already pushed — trading a stale
    board for a half-released version is strictly worse. Write AFTER the push succeeds, warn loudly on
    failure, never exit non-zero post-push.'
  - deploy.sh is URA-only (CLAUDE.md). Do not co-opt it for Shipwatch or other projects.
  - 'Every escape hatch must be explicit and logged (--no-cards), never a silent bypass.'
  ladder:
  - 'RUNG 1 (HARD — the forcing function): deploy.sh gains --cards ID[,ID...]. REFUSES to deploy when
    absent, printing current in_progress/review cards as candidates. --no-cards escape for pure-docs
    releases. On success it WRITES status: shipped_organic + shipped_version: v<version> for each named
    card and meta.last_reconciled: <today>, committed as part of the release commit. The board update
    becomes an OUTPUT of shipping, not a task.'
  - 'RUNG 2 (HARD, same gate): chain vibememo. The same --cards gate requires/emits a vibememo entry for
    the release (the WHY of the ship), so the decision trail cannot lag either. vibememo = WHY,
    kanban = WHAT/WHERE/NEXT; both are release-coupled from here.'
  - 'RUNG 3 (soft backup): KHOST-1 generator renders a loud STALE banner + warns on build when
    meta.last_reconciled is older than the newest git tag or newest README_v*.md.'
  - 'RUNG 4 (soft backup): session-start staleness check (skill enforcement #2, already exists) —
    compare meta.last_reconciled to git log before reporting status.'
  - 'RUNG 5 (soft backup): recurring overnight agentic pass reconciles the board as its first action
    before picking up overnight-agentic work. WIRED 2026-08-09 as recurring job 0e0703fc, daily 01:23.'
  RUNG5_DURABILITY_GAP: 'The 01:23 job is SESSION-ONLY — in-memory, dies when the Claude session exits,
    and auto-expires after 7 days. So it does NOT yet fully solve the KHOST-1 miss: if the session ends
    before 01:23, the overnight pass silently does not happen — the SAME failure mode as the original
    promise, just with a longer fuse. A durable fix needs a scheduler OUTSIDE the session: launchd on
    the operator Mac or a homelab cron that starts a fresh headless session. Until that exists, rung 5
    is best-effort and must not be relied on; rungs 1-2 (release-coupled, in-repo) are the load-bearing
    ones. Operator decision needed on where the durable scheduler lives.'
  scope_note: 'Rung 1 hardens only the SHIPPED transition. pre_planning->planned->in_progress stays soft
    (turn-end hook). Deliberate: every card found stale on 2026-08-09 was shipped work the board still
    called "build" — the rot is concentrated exactly where rung 1 bites. If in-flight statuses prove to
    rot too, add a second mechanism ON EVIDENCE, not by guess.'
  parsimony:
    problem: the board silently lags shipped work, so picking "next" off it can rebuild already-shipped features
    verdict: BUILD
    note: 'simplest version (banner) was REJECTED by operator as not a forcing function; the marginal
      cost of rung 1 over the banner is one gate in a script that already has one (deploy.sh:32-36)'
  knobs: none new (uses existing meta.last_reconciled)
  next: 'MERGED to develop 2026-08-09 (0b4a22592). Rungs 1+2 live in scripts/deploy.sh. ORGANIC PROOF
    OPEN: the post-push write path has never executed for real — the next release is its first true run.
    Failure there is contained (warn + exit 0, release unaffected). Rung 3 rides KHOST-1.'
  review_record_2026_08_09: 'Reviewed DO-NOT-SHIP -> fixed -> re-verified. H1 YAML reflow: safe_dump
    round-trip rewrote the real board 1296->1455 lines, re-wrapping every card''s prose at 80 cols.
    Replaced with a textual line-anchored writer (parse to VALIDATE, edit as TEXT) — NOT ruamel, which
    is not installed and would have put a pip dependency in the release path. Orchestrator independently
    re-verified on the real board: 1323->1324 lines, 2 hunks, 3 lines changed, all 28 other cards
    byte-identical, YAML valid, card count preserved. H2: --dry-run was a command echo, so step 4b would
    have debuted in production; it now runs the REAL kanban_ship + vibememo_ship against a mktemp copy
    and prints the diff. M1 (--cards swallowing a flag), M2 (gitea mirror for the reconcile commit),
    M3 (--no-verify so a hook flake cannot leave the board dirty and block the next deploy), L1/L2/L5
    fixed. L3/L4 accepted.'
  residual_fragility:
  - 'A card whose status: line is quoted (status: "planned") would not match the writer regex — the card
    is skipped with a WARN rather than silently mis-written. No such card exists today; worth a lint if
    quoting ever starts.'
  - 'No behavioral in-suite test for vibememo_ship.py (kanban side has 14). The --repo-root flag is
    exercised only by the dry-run rehearsal; a bug in default root resolution would not be caught.'
  meta_note: 'The first card this gate marks shipped will most likely be itself.'
  refs:
  - docs/planning/PLANNING_v4.7.10_deploy_sh_gitea_retrofit.md (precedent for modifying deploy.sh)
  - scripts/deploy.sh:32-36 (existing hard-gate pattern to mirror)
  - .claude/skills/ura-kanban/SKILL.md (Forcing functions section)
  sibling_of:
  - KHOST-1
  DEDUPE_2026_08_09: 'Four-surface sweep run. Board: KHOST-1 adjacent (owns rung 3, the generator) —
    linked, not merged, because rung 1 lives in release machinery not the generator. TRANSIT-DIAG-1
    matched on "diagnostic" only, unrelated. BACKLOG.md: no match. Planning docs: v4.7.10 deploy_sh
    retrofit is the precedent for HOW deploy.sh gets changed, cited. Catalogs: n/a (process, not a
    presence primitive). NEW, not duplicate.'
- id: WATCHDOG-INERT-1
  title: Three of four v5.35.0 stuck-signal detectors are effectively inert (D3 structurally unreachable)
  thread: presence
  status: shipped_organic
  shipped_version: v5.67.0
  approval: unreviewed
  tags:
  - no-fabrication-verify
  - measure-before-build
  - context-wide-scoping
  origin:
    date: '2026-08-09'
    gist: fell out of the ledger golden-fixture yield probe — the short buckets were short because the
      events never happen, which is a statement about the detectors, not about instrumentation
  why: 'MEASURED over 7.46 d recorder + 14 d URA notification_log. D3 frozen-tracker is STRUCTURALLY
    UNREACHABLE: threshold FROZEN_TRACKER_DAYS=2.0 (const.py:3121) but longest HA uptime in-window is
    1.02 d across 30 restarts (2.5 h median gap); restart re-adds trackers with fresh last_updated, so
    the counter resets before it can mature. Oldest of 1793 trackers = 1.93 d. D1 camera-stuck has never
    fired: interior max person_count>0 hold is 0.31 h vs STUCK_CAMERA_HOURS=3.0 (~10x margin). P24 fires
    ~1x/14 d. Only P22 (18 episodes) and D2 (13) are live detectors.'
  sharp_problem: 'D3 cannot catch the incident it was built for. It exists because of the Ezinne 3-day
    frozen tracker; with HA restarting every ~2.5 h a 3-day freeze is invisible to a detector measuring
    uninterrupted in-memory last_updated age.'
  root_cause_link: 'Same defect STUCK-SENSOR-1 flagged and nobody pursued — "NO PERSISTENCE: any
    stuck-state tally resets on restart, and we restarted 7+ times today." The probe proves it is fatal
    for D3 rather than merely degrading.'
  options:
  - 'FIX: measure staleness from a PERSISTED timestamp rather than in-memory last_updated, so restarts
    do not reset the counter. Restores D3 to its intended purpose.'
  - 'RE-THRESHOLD: D1 3.0 h against an observed 0.31 h max is ~10x off; either the threshold is wrong
    for this deployment or the detector is guarding a condition that does not occur here.'
  - 'DROP from the ledger migration set: migrating a detector that has never fired buys nothing and its
    golden fixture is impossible to generate by construction.'
  blocks:
  - SIGNAL-TRUST-LEDGER M4/M6 scoping
  RESTART_VERDICT_2026_08_09: 'RESOLVED — NOT a red flag. Authoritative events-table count is 26 (not
    30; my earlier figure was a heuristic overcount that also caught config-entry reloads). ALL 26 were
    clean stops preceded within 300s by an explicit homeassistant.restart: 25 map 1:1 to release commits
    across the v5.47.0->v5.64.0 train, 1 was a deliberate operator manual restart. ZERO spurious, zero
    unclean starts, zero watchdog signature. The parent-reload watchdog hazard did NOT fire (only 5
    reload_config_entry calls in-window, targeting enphase_envoy and esphome — neither is URA).
    Operator rule "if restarts are us shipping we are ok to keep going" -> WE ARE OK. It is a deploy log.'
  D3_STILL_UNREACHABLE: 'Corrected uptime stats CONFIRM it: median 3.43 h, mean 6.63 h, max 24.32 h
    (1.01 d) vs a 2.0 d threshold. Note the causality — D3 is unreachable BECAUSE we ship this often, so
    it will stay unreachable at this cadence. The fix is detector-side (persist the tally across
    restarts), not slowing releases.'
  D1_VERDICT_2026_08_09: '(i) CORRECTLY RARE — leave the thresholds alone. Interior hold distribution
    over 7.30 d: p50 0.004 h, p90 0.013 h, p99 0.044 h, max 0.27 h against a 3.0 h threshold (11x above
    max, ~68x above p99). All 7 interior candidates are live and evaluated (883 non-zero episodes);
    boot-settle is not binding and the v5.35.0 safety rails gate the census DISCOUNT not the NM, so they
    cannot explain the silence. Re-thresholding would land at ~0.3-0.5 h, below plausible real occupancy
    — the 3.0/6.0 h pair is a deliberate "impossible for a real body" bound working as designed.'
  GARAGE_CAMERA_RULING_2026_08_10: 'OPERATOR: "No — garage cameras should feed only egresses and
    exterior. I fear it will be too noisy for interior listings." DECIDED: add camera.garage_a/garage_b
    to CONF_EGRESS_CAMERAS (perimeter_alert), NOT camera_person_entities. ACCEPTED CONSEQUENCE: D1
    stuck-camera detection will never cover the garages (interior-list-only) — the 6.52h garage_b hold
    class stays invisible to D1 by explicit choice. Config apply pending.'
  D1_REAL_FINDING_coverage_not_calibration: 'sensor.garage_b_person_count held >0 for 6.52 h and WOULD
    have crossed both rules — but camera.garage_b and camera.garage_a are in NO URA camera list (not
    interior, not perimeter, not egress), while "Garage B" IS a configured URA room. Widening D1 to
    perimeter would be wrong (front_side_ptz 3.49 h, back_yard 2.97 h are legitimately long outdoors).
    OPERATOR DECISION: add the garage cameras to the interior list? Note Garage B has now surfaced three
    separate times today (chattering ratgdo, empty D2 candidate set, uncovered camera).'
  P24_VERDICT_2026_08_09: '(iii) STRUCTURALLY BLIND on its main leg — not a threshold problem. Duration
    precondition met 27 times across 7 rooms in 7.3 d (~3.7/day); the Tier-1 freshness skip suppressed
    27 of 27 (100%). That 100% is a THEOREM not a statistic: any tick reaching coordinator.py:2417-2418
    with STATE_OCCUPIED=True either just refreshed _last_motion_time = now (:2332) or is inside the
    timeout branch, so signal_age < occupancy_timeout < 2x occupancy_timeout — always fresh. The moment
    it is not, _became_occupied_time is nulled (:2373, :2384) and the guard is False. The single real
    firing (Patio, 08-05, 15.06 h session) came through the is-None branch during a grace_hold. Also:
    camera/BLE-held occupancy can NEVER accumulate failsafe duration — the overrides at :2490/:2597
    re-seed _became_occupied_time AFTER the check (Ziri Bathroom shows occupied 10.79 h but max recorded
    session 1.10 h). No staleness multiplier fixes it: k<=1 is a no-op gate firing on all 27 legit
    sessions, k>1 is unreachable. THREE OPTIONS written up: move the check after the overrides, re-base
    on _last_pir_motion_time, or accept the narrowed semantics and rewrite the NM text honestly.'
  P24_DIAGNOSABILITY_DEFECT: 'The NM row persists message="[audit]" with NO room name — identifying the
    firing room required a recorder attribute join. Cheap fix, real cost the next time one fires.'
  parsimony:
    problem: three shipped detectors do not detect; one cannot detect by construction
    verdict: BUILD
    note: 'cheap relative to value — this is dead safety machinery we believe is protecting us'
  BATCH_REVIEW_ROUND_2026_08_10: 'b9975cf30 (P24 fix + D3 kill + dropdowns + constant split): A
    DO-NOT-SHIP — CRIT-A1: rebasing freshness on _last_pir_motion_time force-vacates the SIX no-PIR
    rooms at every 4h+ session (sleeping child in Jaya''s room, nightly); the "27/27 tautological
    suppression" was, for mmWave-primary rooms, the sleeping-body protection WORKING. HIGH-A2:
    camera-held rooms force-vacated + _failsafe_fired latch locks the camera override out. A verified
    the deferred-clear surgery itself is SOUND (all readers traced, seed-if-None becomes benign no-op).
    B SHIP-w-fix — HIGH-B1: HOUSE_MANUAL instructs setting the DELETED constant at six sites (the
    EC-backout-memo class); MED-B2: dropdown strip-on-default silently deletes trust_class from an
    unchanged save. C DO-NOT-SHIP — the P24 "mutation-anchored" tests are SOURCE-GREP assertions + a
    _should_fire MIRROR (hollow-anchor instance #10): C inverted the fresh branch itself and 38/38
    stayed green; drills 4/5 (deferred clear, finalize block) also GREEN=untested; title_override and
    the 188-LoC dropdown merge have zero coverage. Builder had claimed mutation-anchored while writing
    grep-anchors AND skipped the per-site drills — both caught only because C re-ran them.'
  FIXUP_IN_FLIGHT_2026_08_10: 'Single consolidated pass: CRIT-A1 no-PIR guard (mirror
    _d2_motion_sensors_present; failsafe simply does not apply to no-PIR rooms); HIGH-A2 invariant
    "fires only when no live override AND PIR stale" + latch fix; C1/H1/H2/H3 REAL behavior tests with
    C''s drills 3/4/5 re-run to red as the gate; HIGH-B1 runbook rewrite; MED-B2 strip-only-kind.
    Escape hatch authorized: if the harness defeats C1/H1, SPLIT the batch — D3 deletion + constant
    split ride now, P24 + dropdowns follow.'
  OPERATOR_DECISIONS_2026_08_09_round2:
  - 'GARAGE CAMERAS: "Yes pls. Or maybe to the egress list?" — ANSWERED: the two lists do different
    things and only ONE gives D1 coverage. CONF_CAMERA_PERSON_ENTITIES (interior) is what D1 scores
    (camera_census.py:1787,1803) and is ALSO consumed by the census person_count and by fan_veto.py:353.
    CONF_EGRESS_CAMERAS feeds perimeter_alert.py:332 (alerting) — adding garages there would NOT make
    D1 see them. So: interior is required for the stated goal. SIDE EFFECT to weigh: interior also
    enrols the garage cameras in the census person_count (affects house occupancy / guest detection) and
