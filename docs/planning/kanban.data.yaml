    exactly how this bug appeared.
  - '4. Fail-safe default: unclassified state INVALIDATES (arrester regains governance) rather than holding
    a suppression forever.'
  knobs:
  - name: ARRESTER_HOLD_PRESERVING_STATES
    rung: 1
    why: '{arriving, guest, waking} - the only states that do NOT invalidate; everything else does (fail-safe
      default)'
  - name: ARRESTER_OVERRIDE_MIN_LIFE_S
