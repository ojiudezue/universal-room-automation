- id: ARREST-COMFORT-1
  title: Override arrester reverts occupant manual cooling requests with no comfort exemption
  thread: hvac
  status: shipped_organic
  shipped_version: v5.69.0
  approval: approved
  review_state: 'Cycle A built (18b491e01, 28 tests, kids-replay authentic). Tier-3 4x reviews: B SHIP; A/C/D DO-NOT-SHIP with DISJOINT blockers — A-CRIT-1 occupancy gate read static zone_persons config list not live occupancy; D-CRIT-1 DPM apply ungated + 3 hvac_predict emitters + AI-rules climate bypass (real R2-residual site found in coordinator.py, plan had mislocated it); C-H5 hvac.py-side consumer mutation-untested. Consolidated 19-finding fix-up dispatched 2026-08-10. AI-rules climate: cheap-block chosen (zero live climate rules), route-through-chokepoints parked.'
  origin:
    date: '2026-08-09'
    gist: 'operator: "I think manual were kids trying to cool their space and the arrester stops them"'
  why: 'Observed tonight: zone_2 preset went to `manual` at 16:49 and again at 17:14 — the kids walking
    to the thermostat in an 80F room and asking for cooling. The override arrester reverted both within
    10 and 5 minutes respectively. After 17:19 there are NO further manual writes: they gave up. The
    system trained them that the thermostat does not work.'
  sharp_problem: 'A manual cool request, from an occupied zone, at 80F, during recovery from a 24h
    absence, is the single highest-quality signal in the building — a human walked to a wall and said
    they are uncomfortable. The arrester treats it as noise to revert. Its only escape hatch is the
    separate temp_arrester_override switch, which the kids do not know exists and which had sunset.'
  fix_direction: 'Exempt (or substantially delay) arrest when the zone is occupied AND the manual change
    moves toward comfort AND the temp delta is large. Arresting inside 5-10 minutes is worse than not
    arresting at all — the occupant never feels an effect, so they learn the control is broken.'
  operator_action_taken_2026_08_09: 'temp_arrester_override switched ON and all three zones set to home
    at operator instruction. Verified: ceilings dropped 80 -> 76/77, all three cooling, runtime_exceeded
    cleared. Note the override has a 6h max life and sunsets on some house-state transitions, so this is
    relief, not a fix.'
  OPERATOR_DESIGN_2026_08_10: 'DELAY chosen over exempt. Plus three design inputs verbatim-captured:
    (1) IDENTIFICATION QUESTION (operator): "how will this situation be identified specifically to
    widen the delay/grace?" — the predicate for "occupant comfort request" needs to be explicit:
    candidate = manual setpoint change AND zone any_room_occupied/zone_persons non-empty AND change
    moves TOWARD comfort relative to current temp AND |delta| >= knob. (2) BATTERY-CONDITIONED GRACE:
    widen grace when the battery is genuinely full; return to strict below 80% SOC — resolves the
    duty-cycle/peak conflict by spending stored energy on comfort only when it is demonstrably spare
    (this is duty-cycle option (c) arriving via the arrester door). (3) GRADUATED CONCESSION ("bend
    towards the requester"): do not binary honor-or-revert. Ask 76 from 80 -> grant 76 for 15 min ->
    step to 78 for 15 min, monitoring APPROACH SPEED to setpoint throughout — a negotiation curve.
    Slow approach (unrecoverable load) should inform the step timing. Knobs: grace minutes, step size,
    step interval, SOC floor (80), delta threshold — all named, rung ladder in plan.'
  PLAN_2026_08_11: 'PLANNING_arrester_comfort_delay.md. STAGED: Cycle A = predicate + SOC-gated flat
    grace + coast-precedence guard (~95% of the kids-incident benefit); Cycle B (graduated concession +
    approach-speed observer) PARKED with evidence trigger — rare-fire state machine priced honestly.
    INV-COMFORT-DELAY falsifiable; single SOC accessor consumed by BOTH D1 and D3 (desync = sharpest
    risk, mutation must fail both); probe-first gate (AUDIT_arrester_comfort_delay.md) before build;
    kids-incident replay is the live acceptance criterion. Tier 3.'
  PLAN_REVIEWS_2026_08_11: 'Both NEEDS-REVISION (the protocol''s first subject, and it paid): R1-H1
    preset-writes clobber a granted setpoint on Bryant preset thermostats — INV-violating by
    construction, 9 emit sites unguarded; R2-H1 dual-setpoint predicate undefined (heat_cool range
    drag, None crashes, single-target unmapped); R2-H2 the plan''s own "single SOC accessor" mitigation
    was a hollow anchor in blueprint form. REV-2 committed: §3.7 S1-S9 per-site verdict table + a NEW
    emit_set_preset_mode chokepoint (mirror of emit_set_temperature) + gate on BOTH surfaces (the
    revision caught that the review''s preset-only chokepoint was itself incomplete); per-mode
    comfort-relevant-leg predicate w/ worked examples, fail-closed on None; SOC evaluated ONCE at
    grant, comfort_delay_active pure; restart-mid-grace disclosed+accepted for Cycle A; shed DOMINATES
    comfort (INV falsification #6); kill-switch semantics per knob (SOC_FLOOR=0 = deliberate
    blackout-risk acceptance w/ boot WARN); kids-replay must drive real _handle_climate_change.'
  PROBE_2026_08_11: 'D1/D2/D3 all GO. Qualifying events 44.4/wk (NOT rare — zone_2 = 43/49); SOC>=80
    at ~50% of events so the gate is genuinely load-bearing; coast co-fire 13.6/wk -> D3 required;
    multi-thermostat zones = ZERO -> grant key simplifies to zone_id (H2 ambiguity killed by
    measurement); preset-flap co-fire 18% all on the incident evenings (confirms the R1-H1 seam);
    kids incident found in the qualifying set (SOC 99-100, coast, flap co-fire TRUE) = sanity anchor.
    VOCABULARY FINDING: the arrester writes NOTHING to ura_activity_log — it acts silently; the plan''s
    ledger deliverable is also a diagnosability fix. PERISHABLE FIXTURE EXTRACTED: kids-incident
    recorder rows (purge ~08-16) committed to quality/tests/fixtures/arrester_comfort/.'
  CYCLE_B_ESCALATION_DECISION: 'Probe found Cycle-B''s evidence trigger ALREADY MET (08-08 zone_2:
    4 qualifying flips in 61 min). OPERATOR CALL: pull D4 graduated concession in-cycle, or keep
    staged? ORCHESTRATOR RECOMMENDATION: KEEP STAGED — the trigger being met justifies Cycle B NEXT,
    not simultaneous; bundling doubles a Tier-3 review surface, and Cycle A''s flat grace already
    covers the 44/wk common case. Cycle B dispatches immediately after A''s live validation.'
  next: 'Cycle A build after FAN-LAYER build slots clear (both touch hvac.py — SERIALIZE the builds;
    plan work done in parallel per operator mandate).'
  DEDUPE_2026_08_09: 'Sweep: ARREST-SUNSET-1 (shipped) is about WHEN the override sunsets;
    OVERRIDE-NOTIFY-1 is about warning before expiry. Neither touches whether the arrester should fire
    against an occupant comfort request in the first place. HVAC-PRESET-FLAP-1 is the sibling defect
    from the same trace but independent — fixing one would not fix the other. NEW.'
- id: BLE-WARM-CREATE-1
