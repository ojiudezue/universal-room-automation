    check the conjunction with exterior camera person-tracking, circling (CIRCLING-LABEL-1 shipped v5.76.0)
    and switch.ura_security_coordinator_exterior_path_tracking. That count must be accurate for its OWN
    sake, not only as a guest input. NOTE: exterior census currently reports source_agreement=single_source
    while interior reports both_agree — the exterior leg has its own accuracy gap to characterise.'
  regression_context_2026_08_16: 'Operator: "I believe we regressed census with our prior work" — CONFIRMED
    with recorder data. Daily census max: Aug 9-12 = 6-7 (4 residents, chronic over-count of 2-3); Aug
    13-14 = 4 (LOOKED perfect, but only because the _2-suffix break PINNED the count at identified); Aug
    16 = 10 for 5 people (worst on record). We regressed from wrong-and-masked to wronger-and-visible:
    the suffix repair restored the additive path to full strength and the F2 detect tuning fed it more
    detections. The additive double-count is CHRONIC and predates this week. Lesson recorded: the broken
    state read as healthy (a pinned 4 in a 4-person house looks like a perfect census).'
  measured_incident_2026_08_16_guest_7h: 'MEASURED end-to-end retrace of a live false-guest episode (operator
    flagged "5 seen, guest mode, 4 known"). Recorder: house `guest` 13:38:33 -> `home_evening` 20:40:59
    = 7h02m of false guest with 4 known residents and zero guests. Entry was CENSUS-driven (Path A): census
    hit 6 at 13:38:03, guest 30s later. Census sawtoothed 4..10 all afternoon, never resting at 4 until
    20:35:59; guest released 5 min after census finally reached 4. Confirmed constants: CENSUS_PEAK_SUSTAIN_SECONDS=15
    (latch), DEFAULT_CENSUS_HOLD_INTERIOR_MINUTES=3, CENSUS_DECAY_STEP_SECONDS=300 (-1/5min), DEFAULT_GUEST_PERSISTENCE_SECONDS=300.
    THE ASYMMETRY IS THE BUG: 15s of phantom latches a peak costing 3min hold + 5min PER EXCESS PERSON
    to clear — the observed spike to 10 (identified=4) implies ~33 min of elevated count from a 15-second
    artifact, and re-spikes arrived faster than the decay drained (peak self-refreshes when fresh == peak,
    so a recurring artifact never decays at all). Decay measured exactly: 10->9->8->7->6->5 at 18:47/18:52/18:57/19:02/19:07.
    CYCLE-1 IMPACT (verified, not assumed): D2 KILLS this entry path (guest entry becomes guest-room-only,
    Path A removed) and D2b decouples the exit from the count — this exact episode cannot recur. D1''s
    clamp does NOT get the count to 4: review A''s per-value table (identified=4, held=6) gives pre_cancel
    0/unset/4 -> 4/0; 5 -> 5/1; 6 -> 6/2; 10 -> 10/6. When the camera body total is itself inflated the
    clamp is a NO-OP. So the NUMBER stays wrong until cycle-3 dedup repair. Cycle 2 must fix the latch/decay
    asymmetry; cycle 3 must fix the camera body total.'
  exterior_intersection_findings_2026_08_16: 'Context-wide read-only investigation answering "how does
    the circling/exterior-track work intersect the exterior census". ANSWER: IT DOES NOT — zero shared
    code, two independent readers of the same cameras. (1) Exterior census `_calculate_property_census`
    camera_census.py:1501-1580 sums one `person_binary_sensor` bit PER CAMERA with NO dedup of any kind
    — one walker past 3 perimeter cams reads 3. (2) `ExteriorTrackLinker` threads sightings across cameras
    via the operator-ratified adjacency graph (TRACK_LINK_WINDOW_S=180) — same walker reads 1. THE SECURITY
    WORK IS ALREADY THE BETTER COUNTER, and it exposes the answer on a plate: `census_counts()` at exterior_track_linker.py:766-777
    returns exterior_person_tracks_active + exterior_unidentified_persons and NOTHING consumes it; the
    census''s own `property_count` also has zero readers outside camera_census.py. (3) `single_source`
    MYSTERY CLOSED: it is HARD-CODED on every branch (camera_census.py:1544/1548/1551/1555); the exterior
    path never calls `_cross_validate_platforms()` (house-only, :1404-1407). NOT a platform outage — multi-witness
    legs exist on the same cameras (perimeter_alert.py:410-500 enumerates 7 engine legs); the census simply
    never asks. No platform repair is needed or possible here. (4) Interior/exterior camera classification
    is DUPLICATED across 3 unreconciled mechanisms: config-list membership (CONF_CAMERA_PERSON_ENTITIES
    vs CONF_EGRESS_CAMERAS+CONF_PERIMETER_CAMERAS, with NO cross-exclusion validation), the linker camera-key
    allowlist, and CONF_ZONE_IS_OUTDOOR (which camera_census.py never imports = gap G9). The 2026-08-06
    playroom interior-leak hotfix hardened the LINKER only — the census has NO equivalent guard, so an
    interior cam wrongly added to CONF_PERIMETER_CAMERAS inflates the exterior headcount silently. (5)
    Pool-overhead/Balcony area conflict is real (resolver returns `balcony` for the pool-overhead primary)
    but does NOT bite either exterior surface: the linker keys on camera NAME, and the exterior census
    does no area dedup at all. Watch `armcrestash41b` (interior Study A) never fusing with `armcrest`
    — a name-PREFIX classifier would collide; none exists in shipped code. (6) Exterior is FULLY STRANDED
    from house state; the only coupling is one-way severity shaping (NM_HAZARD_EXTERIOR_PERSON_GUEST_SEVERITY
    — guest DEMOTES exterior severity; exterior never promotes guest).'
  merged_from_2026_08_16: 'Absorbed CENSUS-DEDUP-REPAIR-1 wholesale. That card covered P10/P11: repair
    the BLE-cancel and fresh-face dedup defences at source (both currently return zero, which is WHY the
    additive derivation double-counts). Kept as one cycle because the D1 clamp shipping in cycle 1 is
    a NO-OP whenever the camera body total is itself inflated — so decay-fixing without dedup-fixing would
    still leave the number wrong, and the two share every consumer and test surface.'
  suffix_migration_finding_2026_08_17: 'OPERATOR CONFIRMED: the Frigate1->Frigate2 migration WAS done;
    this aspect was missed. VERIFIED against the live registry (/Users/okosisi/ha-config/.storage/core.entity_registry
    — note CLAUDE.md documents a STALE path /Users/ojiudezue/...): all 23 `last_recognized_face` entities
    belong to the Frigate 2 config entry, ALL 23 carry the `_2` suffix, and ZERO bare-slug entities remain.
    Mechanism: F2 was added alongside F1, slugs collided, HA appended `_2`; F1 was then decommissioned
    and its entities removed, freeing the bare slug — but HA NEVER retroactively renames existing entities.
    So F2 kept `_2` permanently and the bare slug sits free and unused. ROOT ISSUE IS NOT THE SUFFIX,
    IT IS BYPASSED MACHINERY: camera_resolver.py:291 `_strip_disambiguation_suffix()` already exists FOR
    EXACTLY THIS (added 2026-08-01 from a bench finding on camera.armcrestash41b_2), but four sites construct
    entity IDs by hand and never consult it — camera_census.py:2383, :2416, :2736 (f"sensor.{base_name}_last_recognized_face",
    derived by stripping _person_occupancy off a RESOLVED binary_sensor and assuming the face entity shares
    that base — it does not) and :3023 (f"sensor.frigate_{person_slug}_last_camera", wrong on the suffix
    AND on the name: live is frigate_oji_* vs configured oji_udezue). Measured consequence: fresh-face
    -1 has fired ZERO times in 7 days and structurally cannot. FIX = registry resolution, NOT string renaming
    (renaming re-breaks on the next collision); precedent is cycle-1 D3, which replaced constructed-slug
    lookup with entity_registry.async_get_entity_id for this exact failure class. NOTE prior art at perimeter_alert.py:1879-1880
    which already hardcodes BOTH _person_detected and _person_detected_2 — a local coping hack, not a
    shared fix. PATTERN (third instance tonight, = Bug Class #53 computed-but-not-consumed applied to
    RESOLVERS): we build the right primitive and then fail to consume it at the sites that need it — cf.
    ExteriorTrackLinker.census_counts() stranded while the exterior census sums raw per-camera bits.'
  scope_clarification_2026_08_17: 'Operator scope check 2026-08-17: "Isn''t cycle 2 about interior accuracy?
    The exterior was a bonus? Or does cycle 1 fix that?" — CONFIRMED. Cycle 1 (CENSUS-GHOST-DEDUP-1) fixes
    GUEST MODE, not the interior count (its D1 clamp is a no-op when the camera body total is inflated).
    THIS cycle is the INTERIOR-ACCURACY cycle. CORE (the point): (1) decay/self-refresh separation — targets
    the measured 74.5%% of over-count time that was the decay tail with no live camera evidence; (2) the
    _2-suffix fresh-face resolution fix — fresh-face -1 has fired ZERO times in 7 days because the code
