- id: CENSUS-ACCURACY-1
  title: 'Interior census accuracy: separate census decay from guest hysteresis + fix the _2-suffix fresh-face
    resolution (exterior dashboard wiring is a minor bonus)'
  thread: presence
  status: shipped_organic
  shipped_version: v5.80.0
  approval: implied
  approved_by: 'operator 2026-08-16 ("Census and guest are diff states... Census decay is also not the
    same as Guest decay. Separate concerns.") | MERGE APPROVED operator 2026-08-16: absorbed CENSUS-DEDUP-REPAIR-1
    into this card. Rationale: both are census-side ("make the number right") and share consumers, tests
    and reviewers; splitting cost a full extra review round for little isolation benefit. Cycle chain
    is now 1 CENSUS-GHOST-DEDUP-1 (guest correctness, in review) -> 2 CENSUS-ACCURACY-1 (this) -> 3 EXTERIOR-GUEST-EGRESS-1.'
  origin:
    date: '2026-08-16'
    gist: Operator ruling after the guest-phantom incident; full context in RESEARCH_census_vs_guest_separation.md
      (aa3e39aa8).
  problem_solution:
  - 'P5 one timer, two opposite needs — census wants freshness, guest wants hysteresis; shared hold+decay
    turns a 15s phantom into 480s of evidence and clears the 300s guest gate (the mechanism behind ~50
    spurious guest entries since 07-13). S5 give each its own timing: census adopts the instant-drop branch
    ALREADY RUNNING for the exterior zone; guest keeps its own 300s dwell + 300s exit damping.'
  - P6 decay never fires for systematic errors — the peak self-refreshes when fresh == peak, so a permanently-wrong
    value renews forever while only transients decay (wrong sign on both axes). S6 remove the self-renewing
    slope; make heldness visible.
  - P7 consumers cannot distinguish a fresh count from a 20-minute-old latched one. S7 publish peak_held
    / peak_age / count_as_of — all already computed internally and discarded.
  - 'P8 the exterior census is naive (per-camera-bit sum, one walker past 3 cams reads 3) while the track-deduped
    count already exists live. ADJUDICATED 2026-08-17 (AUDIT_exterior_census_supersession.md, eb2caa3c8):
    the swap I originally scoped (RETIRE the naive sum, source persons_on_property_exterior from census_counts())
    is HARMFUL — KEEP BOTH. Reasons: (a) the deduped answer is ALREADY live on sensor.exterior_person_tracks_active
    / exterior_unidentified_persons with correct unavailable lifecycle — nothing to build to obtain it;
    (b) the linker collapses two people on adjacent cameras within TRACK_LINK_WINDOW_S=180 into ONE track,
    an UNDERCOUNT that lands on the operator security priority (display blind spot only — per-camera NM
    alerts still fire off rising edges, not the count); (c) the naive sum is a conservative security FLOOR
    worth keeping. The exterior census is FULLY STRANDED (zero trust consumers, grep-verified — only 2
    display sensors + PWA card + a dead dispatch key), so no actuation is endangered either way. S8 REVISED:
    do NOT overwrite the naive sensor. If anything, surface the linker id/unid split as its OWN first-class
    number (largely already done) and leave persons_on_property_exterior as the conservative floor. This
    makes the exterior part of cycle 2 nearly a NO-OP — the main census work is the decay/self-refresh
    separation + the _2-suffix fix.'
  - P9 outdoor presence may pollute the interior headcount (outdoor-zone filter designed, unbuilt). S9
    apply the filter using the existing CONF_ZONE_IS_OUTDOOR flag.
  - 'ABSORBED FROM CENSUS-DEDUP-REPAIR-1 (merged 2026-08-16): P10 the per-area BLE-cancel subtraction
    reports ble_cancelled_count 0 every tick while residents ARE being double-counted — cause UNKNOWN.
    Ruled out: missing areas on the counting sensors (16 of 17 Frigate person-count/occupancy _2 sensors
    have effective areas; only the screened ASH41B lacks one). S10 PROBE FIRST using the diagnostics shipping
    in cycle 1 (pre-cancel scalar, _last_ble_by_area, _last_ble_cancel_enabled) which for the first time
    can distinguish ran-and-cancelled-zero from never-ran. No plan until the probe answers it.'
  - 'ABSORBED FROM CENSUS-DEDUP-REPAIR-1 (merged 2026-08-16): P11 the fresh-face -1 per-camera defense
    is inert because face recognition produces ~0 identities (face_recognized_persons empty with 4 known
    residents home). S11 gated on the EXTERNAL Frigate detect-stream + enrollment chain (homelab-side)
    — not fixable in URA code. Track the dependency; re-measure after the face pipeline produces.'
  - 'P12 (folded in per operator 2026-08-17) the two exterior counts serve DIFFERENT consumers and neither
    is wired to the dashboard correctly. S12 small deliverable: dashboard shows the DEDUPED count (exterior_person_tracks_active)
    as the headline "people outside" with the NAIVE sum (persons_on_property_exterior) as a degraded-mode
    FALLBACK (guard G1: never show 0 when the linker is inactive/booting) and a DIVERGENCE indicator (naive
    >> deduped = lingering/circling; deduped=0 & naive>0 = linker-not-ready health signal). Security/alerting
    stays on the never-miss floor + per-camera NM events; guest ingress/egress consumes identity, not
    a count. This is dashboard wiring only — does NOT touch the census producer and does NOT overwrite
    either sensor (per the KEEP-BOTH ruling).'
  why: 'Operator separation-of-concerns ruling: census = measurement (accuracy + freshness); guest = policy
    state (explicit entry/exit + hysteresis). Today guest is a function of a decaying measurement, which
    is the root architectural error. NOTE: the v4.7.18 plan scoped this separation (CensusHoldDecayService
    + presence peek()) and it was never built — every cycle since has patched measurement accuracy instead.'
  constraints:
  - 'MOSTLY COMPOSITION, NOT CONSTRUCTION — already built and just needs composing: the instant-drop branch
    (running for exterior), peak_held/peak_age, ExteriorTrackLinker.census_counts(), CONF_ZONE_IS_OUTDOOR,
    guest dwell/exit damping, the raw subtractive derivation.'
  - 'Do NOT conflate with the guest-census correctness cycle (CENSUS-GHOST-DEDUP-1): that one CAPS and
    RE-ROUTES; it does not repair or re-time anything. Decay and dedup repair are THIS card.'
  - 'MERGED CARD — the dedup repair (P10/P11) is probe-gated: AUDIT_census_accuracy_probe.md must land
    first and its Q1 (why per-area BLE-cancel returns zero) must identify a specific broken link. If the
    probe cannot establish the mechanism, the dedup repair does NOT get built on speculation — re-split
    it rather than guess.'
  next: 'RESCOPED by operator 2026-08-17 to DECAY + SUFFIX FIX (dedup repair dropped — probe measured
    it buys ~0). Plan: (1) decay/self-refresh separation, targeting the measured 74.5% of elevated time
    that had camera_unrecognized==0; (2) registry-resolution fix for the four bypassed entity-ID construction
    sites. Camera-area COVERAGE gap is a config task for the operator, not a build. Tier 2-DB plan review
    before build.'
  refs:
  - docs/planning/RESEARCH_census_vs_guest_separation.md
  - docs/planning/PLANNING_v4.7.18_census_service_shared_refactor.md
  - 'CARD: EXTERIOR-GUEST-EGRESS-1 (exterior->guest, split out of P8)'
