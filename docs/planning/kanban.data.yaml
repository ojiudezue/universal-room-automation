- id: GUEST-ROOM-CONFIG-1
  title: 'Guest-room designation was wrong: a BATHROOM was flagged is_guest_room (unflagged 2026-08-17)'
  thread: presence
  status: done
  shipped_version: v5.79.0
  approval: explicit
  approved_by: operator 2026-08-17 ("Findlay down guest bathroom. Misconfiguration" / "Unflag")
  origin:
    date: '2026-08-17'
    gist: Operator flagged the Down Guest Bathroom designation as a misconfiguration while reviewing which
      rooms should carry the guest role.
  problem_solution:
  - 'Problem: a downstairs guest BATHROOM was marked as a "guest room". Because the check that excludes
    known residents was broken, ANY 30-minute stay in that bathroom would have flipped the whole house
    into guest mode — and a bathroom gets used often, including at night.'
  - 'Solution: unmark the bathroom. The only rooms that can trigger guest mode are now the two actual
    guest bedrooms. (Details and the flow-API gotcha are in the card notes and refs.)'
  why: 'Config correctness, and a prerequisite for D2 being safe: D2 makes the guest-room gate the SOLE
    arm for GUEST, so the designated set becomes load-bearing.'
  constraints:
  - 'INCIDENT NOTE (orchestrator, disclose don''t bury): the FIRST exploratory options-flow call submitted
    basic_setup with schema defaults and thereby triggered the ROOM-NAME-DESYNC write-through, RENAMING
    the entry from "Down Guest Bathroom" to "Guest Bedroom 1 Bathroom" and materialising data->options.
    Values preserved and the rename arguably fixes a title/room_name desync, but it was an unintended
    live-config mutation from a flow I had not read first. config_flow.py:9193 should have been read BEFORE
    calling, not after. No-Fabrication applies to APIs, not just to code claims.'
  - 'API GOTCHA worth remembering: URA''s basic_setup options step signals SUCCESS via async_abort(reason="reconfigure_successful")
    — deliberately, so the update listener does not fire twice (config_flow.py:9205-9209). The MCP tool
    surfaces that as an ERROR. The naive reaction is to retry, and retrying a write that already succeeded
    is how config gets double-applied. Partial input IS safe: the step does merged_options = {**entry.options,
    **user_input}.'
  next: 'None — done. Verified live: designated set = Guest Bedroom 1, Upstairs Guestroom.'
  refs:
  - custom_components/universal_room_automation/config_flow.py:9193
  - custom_components/universal_room_automation/const.py:386
  created: 2026-08-17 21:20
  updated: 2026-08-17 23:30
  refinement_status: initial
