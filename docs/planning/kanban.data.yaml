- id: XCORR-1
  title: 'Burst-demotion for isolated single-camera night alerts (was: cross-engine corroboration gate)'
  thread: perimeter
  status: shipped_organic
  approval: explicit
  approved_by: operator
  approved_on: '2026-08-08'
  tags:
  - tier-2db
  - measure-before-build
  - numbers-get-knobs
  - no-fabrication-verify
  origin:
    date: '2026-08-08'
    gist: operator got 12 notifications 01:01-01:25 CDT from hot_tub; "this is what x-correlation looks
      like if we have multiple engines"
  why: 'A single engine asserting person while a CO-LOCATED engine on the same physical camera stays silent
    is strong false-positive evidence. Labelled example 2026-08-08: hot_tub frigate fired 5x in 18min;
    protect leg NEVER fired; zero adjacent cameras fired. URA correctly alerted on bad input - the input
    is the problem.'
  evidence:
  - 'hot_tub frigate _person_occupancy: 06:01:27, 06:06:10, 06:08:36, 06:10:29, 06:19:00 UTC'
  - 'hot_tub PROTECT _person_detected: zero firings in the window'
  - 'all other exterior cameras (pool_equipment, armcrest, back_yard, rear_ptz, front_side_ptz): zero'
  - 'per-camera alert counts 2 days: hot_tub 24, front_side_ptz 7, pool_equipment 5 -> hot_tub dominates'
  design_TRAP: 'DO NOT gate on corroboration generally - that would SUPPRESS REAL INTRUSIONS on single-engine
    cameras (many cameras have only ONE engine; and a real prowler may only be seen by one). The gate
    must be NARROW: only for cameras that HAVE >=2 engines (so silence from the sibling is meaningful),
    only in the deep-night window, and it must DEMOTE/delay - never silence. Aligns with the existing
    demote-never-silence invariant (INV-XP).'
  design:
  - 'REVISED: first alert ALWAYS fires at full severity (preserves intrusion guarantee).'
  - 'Demote the 2nd..Nth alert from the SAME camera within a window when ALL of: no sibling-engine corroboration,
    no adjacent-camera activity (linker adjacency), deep-night.'
  - This is the pattern that was actually diagnostic on 2026-08-08 (burst + isolation), not single-event
    corroboration.
  - 'Second half of the spam is CHANNEL FAN-OUT: 4 channels x 3 events = 12 buzzes. Demoted repeats ->
    single channel/digest (folds into CONSOL-1 contextual severity).'
  knobs:
  - name: PERIMETER_XCORR_REQUIRE_SECOND_ENGINE_NIGHT
    rung: 1
    why: enable the night corroboration gate; False = today behavior
  - name: PERIMETER_XCORR_WINDOW_S
    rung: 1
    why: how long to wait for the sibling engine before deciding
  - name: PERIMETER_XCORR_MIN_SOLO_RATIO
    rung: 1
    why: only gate cameras whose solo-firing ratio exceeds this (evidence-based, not blanket)
  parsimony:
    problem: one mis-tuned camera paged the operator 12x at 1am
    verdict: SIMPLIFY
    note: probe rejected the corroboration gate; the simple burst+isolation demotion captures the benefit
      without the false-negative risk
  next: build burst-demotion (first alert full severity, repeats demoted when isolated+uncorroborated+night);
    fold channel reduction into CONSOL-1
  refs:
  - perimeter_alert.py leg_firing_by_camera / _record_leg_fire
  - v5.59.0 disagreement telemetry
  probe_result: 'PROBE RUN 2026-08-08 (8d, 30s window) -> AUDIT_xcorr_engine_corroboration_probe.md. The
    naive corroboration gate is REJECTED: solo firing is the NORM on the exterior cameras that drive alerts
    (front_side_ptz 92% solo, back_yard 91%, pool_equipment 93%, hot_tub 77%). Gating on sibling silence
    would suppress 77-93% of exterior person detections INCLUDING REAL ONES. Engines do not share FOV/sensitivity
    per camera, so ''sibling silent'' means different things per camera - no house-wide threshold exists.
    Contrast: frigate on door cameras is near-perfectly corroborated (madrone_g6_entry 0% solo, front_door_aerial
    3%).'
  parked_alts:
  - alt: per-camera adaptive solo-rate baselining
    why: theoretically better than a global threshold
    revisit_if: burst-demotion proves insufficient after a season
- id: DIMMER-REBOOT-1
  title: Master bedroom Shelly Dimmer 2 reboots 89x since Aug 1 and returns ON (NOT thermal)
  thread: devices
  status: pre_planning
  approval: implied
  tags:
  - no-fabrication-verify
  origin:
    date: '2026-08-08'
    gist: 'operator: why is the master bedroom dimmer coming on in the morning?'
  why: 'light.shellydimmer2_24d7ebe93470 (area master_bedroom) reboots repeatedly: 89 `unavailable` events
    since Aug 1, accelerating 6/day -> 23/day, each ~33s (consistent = full device reboot, not a variable
    WiFi blip). 32 of those reboots came back ON — THAT is the ''dimmer comes on in the morning''. No
    context_user_id/parent on any transition => nothing in HA or URA commands it. Temperature is normal,
    so the cause is NOT thermal.'
  likely_causes:
  - Shelly power-on-default set to ON (or restore-last with stale value) -> every reboot turns the light
    on
  - WiFi/network instability causing reboots — memory records a prior house-wide Shelly/Sonoff off-WiFi
    event; this device is the only Shelly currently flapping
  - power quality or firmware
  next: set power-on-default OFF; then chase the reboot cause
  CORRECTION: '2026-08-08: I FIRST REPORTED THIS AS A 117-130C FIRE RISK. THAT WAS WRONG — the sensor''s
    unit_of_measurement is degF, not degC. 116.7F = 47C; peak 129.6F = 54C. That is NORMAL for a wall
    dimmer and inside the Shelly Dimmer 2 range. NO fire risk; no breaker action needed. The device''s
    `overheating` binary_sensor never firing was CORRECT, not a failed guard. Root error: asserted a mechanism
    from an unlabeled number instead of reading the unit — violates the project''s no-fabrication/verify
    rule.'
  fix:
  - 'PRIMARY: set the Shelly power-on default to OFF so a reboot cannot turn the light on (device setting,
    operator or API)'
  - 'THEN: investigate the reboot cause (WiFi signal at that box, firmware version, power quality)'
  - 'optional: NM alert if reboot count per day exceeds a threshold — a device rebooting 23x/day is a
    real signal we currently only see by asking'
