    set under the same kill switch.'
  - 'A-HIGH-1 (Review A): enumerate_platform_cameras groups by device_id; Protect NVR devices host MULTIPLE
    physical cameras (staircase+garagehallway) -> collapse to 1 row/1 area -> wrong attribution / lost
    coverage. Existing _scan_device_entities uses stem_filter; enumerate doesn''t. FIX: group by (device_id,
    stem) or emit one row per (device_id, area).'
  - 'A-HIGH-2 (Review A): cross-leg area fallback can import a FOREIGN camera''s area (correlation ladder
    pulls siblings from a different physical camera). FIX: restrict fallback to same-integration legs
    / require primary area.'
  - 'A-MED 1-4, A-LOW 1-3: scalar checkpoint_areas -> per-char tuple; egress adopts protect entities regardless
    of role; kill-switch not byte-identical (attr always created); double registry walk; by_area double-count.'
  - 'B-H1 (Review B): DOUBLE-FIRE per physical camera - union subscribes BOTH the Protect and Frigate
    leg of the same camera; set() dedups by entity_id not physical camera -> 2 sightings per crossing
