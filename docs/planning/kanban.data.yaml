  probe_calibration_2026_08_19: 'CADENCE PROBE (PROBE_mmwave_healthy_cadence.md) RESOLVED decision #1
    with data. KEY REFINEMENT: the un-fakeable criterion is the BURST (K sub-floor events/window), NOT
