    headline + naive fallback + divergence). The original "swap the exterior headcount" is DEAD — KEEP
    BOTH per AUDIT_exterior_census_supersession.md. Dedup repair also DROPPED (probe: buys ~0; it is camera-area
    coverage = an operator config task, not a build).'
