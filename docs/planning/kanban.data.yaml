- id: CENSUS-GHOST-DEDUP-1
  title: 'Census double-counts residents as unidentified (4 known + 2 ghost bodies = 6) — BLE-cancel exists, is enabled, cancels nothing'
  thread: presence
  status: planned
  approval: implied
  origin:
    date: '2026-08-16'
    gist: 'Operator home with family of 4; census read 6 (identified 4 + unidentified 2). Operator: "only 4 of us — 2 are ghosts or unrecognized versions of us and should decay right?"'
  why: 'Cameras detect person-bodies but recognize NO faces (face_recognized_persons: [] with 4 known people home), so residents own bodies land in the unidentified bucket alongside their own BLE-identified selves = systematic double-count, and the house flips to GUEST state on its own occupants. The machinery built for exactly this — census_ble_cancel (per-area min(camera_raw_max, ble_here) subtraction, camera_census.py ~:2770-2822, kill switch ON in live config) — reported ble_cancelled_count 0 and area_contributions {} while camera_unrecognized was 2.'
  investigation_state_2026_08_16: 'RULED OUT: missing areas on the counting sensors (16 of 17 Frigate person-count/occupancy _2 sensors have effective areas; only the screened ASH41B lacks one, and it never detects). NOT YET EXPLAINED: why area_contributions is empty and cancelled_total 0 while unrecognized is 2 — suggests the contributions arrived via the unassigned_raw (null-area) path, which invariant I3 makes uncancellable BY DESIGN, or the enhanced-census path is not the one producing this count. No BLE-cancel INFO log lines observed at all.'
  next: 'Investigate (read-only first): instrument or trace which entities produce the unrecognized contributions and what area each resolves to at runtime; confirm whether the enhanced path runs. Then decide: fix area resolution, relax I3 for known-resident areas, or make face recognition carry the identity (KP chain). Do NOT guess-fix.'
  parked_alts:
  - 'Wait for face recognition to solve it (Frigate/Protect enrollment) — real but slower; the dedup should not DEPEND on faces working'
  refs: [docs/planning/PLANNING_census_overcount_dedup_decay.md]
  research_2026_08_16: 'RESEARCH_guest_actuation_and_census.md (8f55b243d) — root cause found: the ENHANCED census path (default ON) is ADDITIVE (total = identified + camera_unrecognized) and OVERWRITES the RAW subtractive path (total = max(camera, identified)). With face recognition at ~0, both dedup defenses return zero (fresh-face -1 AND per-area BLE-cancel), so residents are counted twice. Live: 10 = 4 + 6 for ~5 real people; camera_unrecognized == frigate_count exactly. Guest composition is a plain OR whose asymmetries are backwards (confidence gates the census path only; inside GUEST the OR degenerates to the ungated guest-room path).'
  minimal_set_2026_08_16: 'OPERATOR-SCOPED MINIMAL SET = G1 + G4 only. G1 subtractive clamp (~10 LoC, no knob) because the count feeds away-inference/sleep-wake/NM/dashboards, not just guest. G4 invert composition so GUEST ROOMS LEAD and census corroborates (~5 LoC precedence, both operands already computed) because it survives the NEXT count regression — census has regressed twice in four days. G6 (persistence on raw not held) DEFERRED with trigger: build it only if a phantom or transient sustains guest mode after G1+G4 ship. G2 observability rides G1 as its acceptance instrument. G7 confidence->high REJECTED as useless: confidence already reads high (it measures platform agreement, not correctness).'
  next: 'Plan G1+G4 as one small cycle (Tier 2 / 2-DB per standing policy — census is a shared primitive). Acceptance MUST be discriminating: compare census against known ground-truth headcount, never against identified_count (the criterion that hid this bug).'
  guest_room_config_2026_08_16: 'Guest-room set audited when G4 (guest-rooms-lead) was proposed — only ONE of three can currently signal. (a) Guest Bedroom 1: WORKS. (b) Upstairs Guestroom: BROKEN — the listener slugifies the room name to binary_sensor.upstairs_guestroom_occupied but the real entity is binary_sensor.upstairs_guest_bedroom_occupied, so it subscribes to nothing and can never fire (slugify-guessing class; needs the code fix, presence.py:_discover_guest_rooms ~:4708). (c) Down Guest Bathroom: OPERATOR UNFLAGGED 2026-08-16 ("You are correct. Should not be") — bathrooms are transit space; 30min continuous occupancy is not a guest signal and would only ever fire on a stuck sensor. Staged as a flush-watcher rider for the next restart. OPEN: should Guest Bedroom 2 be flagged? (operator decision, not assumed).'


