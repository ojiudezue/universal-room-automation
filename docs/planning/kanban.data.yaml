    gist: 'Split out of CENSUS-DECAY-SEPARATION-1 P8 after the exterior investigation showed exterior->headcount
      and exterior->guest are different-risk problems. Operator''s own framing: "We would need to know
      the transition from outside to inside via an egress right? And that the person is unknown and then
      correlate with other guest signals - carefully."'
  problem_solution:
  - P1 the egress detector cannot say WHO. `EgressDirectionTracker` (transit_validator.py:829-1140) ALREADY
    resolves direction correctly — egress cam then interior cam within EGRESS_ENTRY_WINDOW_SECONDS =>
    `entry`; reverse => `exit`; else `ambiguous` + cooldown — and already fires `ura_person_egress_event`
    with a confidence (0.9/0.8 multi-platform, 0.4/0.3 ambiguous) and persists via database.log_entry_exit_event.
    BUT `person_id` is HARD-CODED None at :1106 and :1121, so the event can say "someone came inside"
    and never "an UNKNOWN person came inside" — which is the entire load-bearing predicate for the operator's
    guest rule. S1 plumb an identity verdict (known / unknown / indeterminate) onto the event.
  - P2 interior adjacency is unmodelled — `_get_interior_cameras_near()` (transit_validator.py:1130-1140)
    returns ALL interior cameras with an explicit "without explicit adjacency mapping from the user" comment,
    so an `entry` can be confirmed by a camera on the far side of the house. S2 model interior adjacency
    for egress-adjacent cameras only (hand-build the table first per measure-before-you-build, mirroring
    the ratified EXTERIOR_ADJACENCY_GRAPH).
  - 'P3 the exterior track and the egress crossing are never joined — the linker has NO reference to `ura_person_egress_event`
    and the egress tracker never reads tracks; a track that approaches an egress camera and vanishes just
    closes on `idle_timeout` and is never continued inside. S3 hand off: an approach-classified track
    terminating at an egress, followed by an `entry` verdict in-window, is an ARRIVAL with a carried identity
    verdict.'
  - 'P4 guest must not be thresholded off exterior presence. S4 exterior arrival is a CORROBORATOR only
    — it may raise confidence in, or shorten the dwell for, a guest-room-gated entry; it may NEVER solo-arm
    guest. Operator: "Never ''someone is outside therefore guest''".'
  why: 'Completes the operator''s (b) concern — the transition INTO guest — with a causal mechanism rather
    than a count threshold. Deliberately split from the cycle-2 headcount swap because the risk profiles
    differ sharply: the headcount swap is read-only composition of an existing better number, whereas
    this would create the FIRST exterior->house-state trust edge (today the coupling is strictly one-way:
    guest demotes exterior severity, exterior never promotes guest). Marginal-benefit ruling: the simple
    half captures the security/accuracy value now; this half buys guest-detection quality and is priced
    separately.'
  constraints:
