- id: HVAC-PRESET-FLAP-1
  title: HVAC zone preset flaps home<->away every 5-15 min during occupied evenings (survives Writer-B removal)
  thread: hvac
  status: shipped_organic
  shipped_version: v5.73.0
  approval: unreviewed
  tags:
  - no-fabrication-verify
  - measure-before-build
  - context-wide-scoping
  origin:
    date: '2026-08-09'
    gist: 'operator: "The hvac zone is being set to away and there are/were people upstairs" — then
      "I''ve been seeing this issue from the moment we walked in", which falsified the first three
      mechanisms I proposed'
  why: 'MEASURED: nine home<->away preset cycles on zone_2 in two hours of confirmed occupancy, all
    inside coast mode. Presence was correct throughout. Writer B removal (v5.56.0) did NOT stop it —
    see P1P3 for the falsification. Real comfort cost: upstairs held at 79-80F with two kids in it after
    a 24h absence on a 96F day, because the away preset ceiling (hi=80) equalled the current temp, so
    the thermostat read "cooling" while doing nothing.'
  DUTY_CYCLE_DEFINITION_2026_08_09: 'PRECISE, read from source (hvac_const.py:392-394):
    DUTY_CYCLE_WINDOW_SECONDS = 20*60 (20-min ROLLING window); DUTY_CYCLE_SHED = 0.50;
    DUTY_CYCLE_COAST = 0.75. So coast permits 15 MINUTES OF COMPRESSOR RUNTIME PER 20-MINUTE WINDOW.
    Accumulates only while hvac_action in (heating, cooling); crossing the cap sets runtime_exceeded
    -> preset forced away (hvac.py:1445); window reset clears it -> preset returns to the house-state
    value. Cooling stops during the away phase so accumulation pauses. Enforcement exists ONLY in
    shed/coast (normal mode: `else: continue`, no cap at all); the only exemption is house_state=sleep.'
  RETRACTION_2_max_runtime_minutes: 'I earlier reported "max_runtime_minutes: 120 is the coast cap" and
    then "you hit the cap almost exactly when you noticed". BOTH WRONG. max_runtime_minutes is computed
    in energy.py:6907 from TIME REMAINING IN THE CURRENT TOU PERIOD — an unrelated field on the same
    sensor that I grabbed because the name looked right. It is not the duty cap, and its 120->60 change
    was the TOU period shortening, not the limiter tightening.'
  RETRACTION_3_two_writers: 'I framed this as "two URA writers disagreeing with no arbitration". WRONG.
    There is ONE mechanism. The home write is not another actor pushing back — it is the same
    effective_preset computation returning the house-state value once runtime_exceeded clears at window
    reset. The observed ~10-min alternation is simply 75% duty expressed at 5-min tick granularity.
    THE LIMITER IS CYCLING BECAUSE IT IS A DUTY-CYCLE LIMITER. This is the feature working as designed,
    and it invalidates the "arbitration rule" fix direction I proposed.'
  REFRAMED_PROBLEM: 'If there is a defect it is NOT the cycling. Three narrower candidates, none Tier 3:
    (1) MECHANISM — duty cycling by toggling a user-visible comfort preset makes an energy action look
    like a presence failure; that misreading cost three hours tonight and taught the kids the thermostat
    is broken. (2) OFF-PHASE SETPOINT — away carries hi=80, so on an 80F evening the off phase parks at
    AMBIENT. A duty cycle off-phase should hold a small offset (~2F), not abandon the room. This may be
    config, not code, and is the cheapest candidate. (3) COAST DUTY VALUE — is 75%/20min right when the
    zone is occupied? Pure tuning.'
  MEASURE_FIRST_GATE: 'Operator: "Measure first for sure." AUDIT_hvac_duty_cycle_frequency.md in flight:
    how often runtime_exceeded fires per day/zone, how much of it is while OCCUPIED, EPISODE structure
    (10 flips in one evening != 10 flips over two weeks), and whether the rate is recent. Known confound
    stated up front: the reason ledger only exists from v5.56.0 (2026-08-06), so an apparent jump may be
    instrumentation appearing rather than behaviour changing — the probe must say "cannot determine" if
    so. Also checking whether we now spend MORE HOURS IN COAST than before, which would make this an
    energy-side regression rather than an HVAC one. NO BUILD UNTIL THIS RETURNS.'
  LEDGER_RETRACTION_2026_08_09: 'I carded a "reason ledger reads empty / diagnosability regression"
    finding. IT WAS FALSE and is fully RETRACTED. The v5.56.0 reason ledger works exactly as designed —
    my extraction script read a column named `details` when the actual column is `details_json`. I
    nearly filed a defect against our own tooling because of a typo in a throwaway query. Operator
    caught it: "Make sure you read all the JSON. Don''t want to fix what''s not broken." Rule earned:
    when an instrument built for exactly this question returns nothing, suspect the query before the
    instrument.'
  MECHANISM_PROVEN_2026_08_09: 'Two URA writers alternating with NO arbitration between them. From the
    ledger, zone_2, every row carrying persons=[ziri, jaya]:
      23:34 home->away reason=runtime_exceeded       runtime=True
      23:24 away->home reason=house_state_transition runtime=False
      23:19 home->away reason=runtime_exceeded       runtime=True
      23:04 away->home reason=house_state_transition runtime=False
      22:54 home->away reason=runtime_exceeded       runtime=True
    The coast duty-limiter (hvac.py:2470-2492, active only in shed/coast, cap max_runtime_minutes=120)
    forces away on trip; the house-state preset logic writes home back because the zone is occupied and
    house=home_evening; the duty window rolls, runtime re-accumulates, it trips again. runtime_exceeded
    toggles True/False in lockstep with the flips. Neither writer yields to the other.
    CONTRAST proving the ledger discriminates: at 19:54/19:59 UTC with nobody home the reason reads
    vacant_past_grace with persons=[] — different cause, correctly labelled.
    NOTE: the reason LADDER (hvac.py:1577) establishes precedence for LABELLING a single change; it does
    NOT arbitrate between two writers that disagree across ticks. That is the gap.'
  my_process_failure: 'I proposed three mechanisms in sequence from snapshots — "URA says home, device
    says away", then "the 120-min cap fired", then "it is coast" — and each fit the instant I was
    looking at and died on the next fact. The history query I ran FOURTH should have been FIRST; I had
    last_changed timestamps in the opening read and looked past them. Rule: for any "it keeps doing X"
    complaint, pull the state history BEFORE proposing a mechanism.'
  next: 'Mechanism proven; this is now a DESIGN question, not a diagnosis. Decide the arbitration rule
    between the coast duty-limiter and occupied-zone comfort. Candidates: (a) exempt the limiter when
    the zone is occupied AND recovering from a large delta — the recovery load is legitimate, not a
    fault; (b) let the limiter win but hold it (stop re-writing home each window) so it stops flapping —
    steady discomfort beats oscillation; (c) consult battery SOC — it was 94% with solar_class
    "excellent" while the limiter throttled comfort to avoid a peak the battery could have covered.
    (c) is the one worth thinking hardest about.'
  refs:
  - docs/planning/kanban.data.yaml card P1P3 (the falsification)
  - custom_components/universal_room_automation/domain_coordinators/hvac.py:1569-1610 (reason ladder), :1660-1675 (ledger row), :2470-2492 (coast duty limiter)
  DEDUPE_2026_08_09: 'Four-surface sweep: P1P3 is the PARENT (closed, spawned this). STUCK-SENSOR-1 is a
    different flap (mmWave sensor stuck, not HVAC preset) — no merge. ARREST-SUNSET-1 shipped and is
    about override sunset, not oscillation. OVERRIDE-NOTIFY-1 is expiry warning. BACKLOG has no HVAC
    preset-flap item. NEW.'
  toggle_retirement_2026_08_14: 'Operator renamed the kill-switch -> "Coast Preset Preservation" (rides v5.75.0) and adjudicated it TEMPORARY CONTAINMENT, not a policy knob (nobody legitimately prefers the lying preset; the 2F offset Number is the real knob). RETIRE the switch when L3 (occupied-coast founding case) AND L4 (arrester echo flat) organically validate: Tier-1 removal (single-user no-backcompat) or demote to rung-1 constant. This closes the card fully when it fires.'

- id: ARREST-COMFORT-1
  title: Override arrester reverts occupant manual cooling requests with no comfort exemption
  thread: hvac
  status: shipped_organic
  shipped_version: v5.69.0
  approval: approved
  review_state: 'Cycle A built (18b491e01, 28 tests, kids-replay authentic). Tier-3 4x reviews: B SHIP; A/C/D DO-NOT-SHIP with DISJOINT blockers — A-CRIT-1 occupancy gate read static zone_persons config list not live occupancy; D-CRIT-1 DPM apply ungated + 3 hvac_predict emitters + AI-rules climate bypass (real R2-residual site found in coordinator.py, plan had mislocated it); C-H5 hvac.py-side consumer mutation-untested. Consolidated 19-finding fix-up dispatched 2026-08-10. AI-rules climate: cheap-block chosen (zero live climate rules), route-through-chokepoints parked.'
  origin:
    date: '2026-08-09'
    gist: 'operator: "I think manual were kids trying to cool their space and the arrester stops them"'
  why: 'Observed tonight: zone_2 preset went to `manual` at 16:49 and again at 17:14 — the kids walking
    to the thermostat in an 80F room and asking for cooling. The override arrester reverted both within
    10 and 5 minutes respectively. After 17:19 there are NO further manual writes: they gave up. The
    system trained them that the thermostat does not work.'
  sharp_problem: 'A manual cool request, from an occupied zone, at 80F, during recovery from a 24h
    absence, is the single highest-quality signal in the building — a human walked to a wall and said
    they are uncomfortable. The arrester treats it as noise to revert. Its only escape hatch is the
    separate temp_arrester_override switch, which the kids do not know exists and which had sunset.'
  fix_direction: 'Exempt (or substantially delay) arrest when the zone is occupied AND the manual change
    moves toward comfort AND the temp delta is large. Arresting inside 5-10 minutes is worse than not
    arresting at all — the occupant never feels an effect, so they learn the control is broken.'
  operator_action_taken_2026_08_09: 'temp_arrester_override switched ON and all three zones set to home
    at operator instruction. Verified: ceilings dropped 80 -> 76/77, all three cooling, runtime_exceeded
    cleared. Note the override has a 6h max life and sunsets on some house-state transitions, so this is
    relief, not a fix.'
  OPERATOR_DESIGN_2026_08_10: 'DELAY chosen over exempt. Plus three design inputs verbatim-captured:
    (1) IDENTIFICATION QUESTION (operator): "how will this situation be identified specifically to
    widen the delay/grace?" — the predicate for "occupant comfort request" needs to be explicit:
    candidate = manual setpoint change AND zone any_room_occupied/zone_persons non-empty AND change
    moves TOWARD comfort relative to current temp AND |delta| >= knob. (2) BATTERY-CONDITIONED GRACE:
    widen grace when the battery is genuinely full; return to strict below 80% SOC — resolves the
    duty-cycle/peak conflict by spending stored energy on comfort only when it is demonstrably spare
    (this is duty-cycle option (c) arriving via the arrester door). (3) GRADUATED CONCESSION ("bend
    towards the requester"): do not binary honor-or-revert. Ask 76 from 80 -> grant 76 for 15 min ->
    step to 78 for 15 min, monitoring APPROACH SPEED to setpoint throughout — a negotiation curve.
    Slow approach (unrecoverable load) should inform the step timing. Knobs: grace minutes, step size,
    step interval, SOC floor (80), delta threshold — all named, rung ladder in plan.'
  PLAN_2026_08_11: 'PLANNING_arrester_comfort_delay.md. STAGED: Cycle A = predicate + SOC-gated flat
    grace + coast-precedence guard (~95% of the kids-incident benefit); Cycle B (graduated concession +
    approach-speed observer) PARKED with evidence trigger — rare-fire state machine priced honestly.
    INV-COMFORT-DELAY falsifiable; single SOC accessor consumed by BOTH D1 and D3 (desync = sharpest
    risk, mutation must fail both); probe-first gate (AUDIT_arrester_comfort_delay.md) before build;
    kids-incident replay is the live acceptance criterion. Tier 3.'
  PLAN_REVIEWS_2026_08_11: 'Both NEEDS-REVISION (the protocol''s first subject, and it paid): R1-H1
    preset-writes clobber a granted setpoint on Bryant preset thermostats — INV-violating by
    construction, 9 emit sites unguarded; R2-H1 dual-setpoint predicate undefined (heat_cool range
    drag, None crashes, single-target unmapped); R2-H2 the plan''s own "single SOC accessor" mitigation
    was a hollow anchor in blueprint form. REV-2 committed: §3.7 S1-S9 per-site verdict table + a NEW
    emit_set_preset_mode chokepoint (mirror of emit_set_temperature) + gate on BOTH surfaces (the
    revision caught that the review''s preset-only chokepoint was itself incomplete); per-mode
    comfort-relevant-leg predicate w/ worked examples, fail-closed on None; SOC evaluated ONCE at
    grant, comfort_delay_active pure; restart-mid-grace disclosed+accepted for Cycle A; shed DOMINATES
    comfort (INV falsification #6); kill-switch semantics per knob (SOC_FLOOR=0 = deliberate
    blackout-risk acceptance w/ boot WARN); kids-replay must drive real _handle_climate_change.'
  PROBE_2026_08_11: 'D1/D2/D3 all GO. Qualifying events 44.4/wk (NOT rare — zone_2 = 43/49); SOC>=80
    at ~50% of events so the gate is genuinely load-bearing; coast co-fire 13.6/wk -> D3 required;
    multi-thermostat zones = ZERO -> grant key simplifies to zone_id (H2 ambiguity killed by
    measurement); preset-flap co-fire 18% all on the incident evenings (confirms the R1-H1 seam);
    kids incident found in the qualifying set (SOC 99-100, coast, flap co-fire TRUE) = sanity anchor.
    VOCABULARY FINDING: the arrester writes NOTHING to ura_activity_log — it acts silently; the plan''s
    ledger deliverable is also a diagnosability fix. PERISHABLE FIXTURE EXTRACTED: kids-incident
    recorder rows (purge ~08-16) committed to quality/tests/fixtures/arrester_comfort/.'
  CYCLE_B_ESCALATION_DECISION: 'Probe found Cycle-B''s evidence trigger ALREADY MET (08-08 zone_2:
    4 qualifying flips in 61 min). OPERATOR CALL: pull D4 graduated concession in-cycle, or keep
    staged? ORCHESTRATOR RECOMMENDATION: KEEP STAGED — the trigger being met justifies Cycle B NEXT,
    not simultaneous; bundling doubles a Tier-3 review surface, and Cycle A''s flat grace already
    covers the 44/wk common case. Cycle B dispatches immediately after A''s live validation.'
  next: 'Cycle A build after FAN-LAYER build slots clear (both touch hvac.py — SERIALIZE the builds;
    plan work done in parallel per operator mandate).'
