    already proved the gap. Cheapest high-value undone roadmap item.
  origin: '2026-08-18 roadmap-undone review (AUDIT_roadmap_undone_worthwhile.md #1)'
  next: 'Plan: chatter detector + ura_unhealthy_sensors sensor + sensor_health table + NM "replace this
    sensor" hook. Tier 2. Institutional-context grep first (chatter->0 files today).'
  refs: AUDIT_roadmap_undone_worthwhile.md; INCIDENT_chatter_class_missed_by_watchdog_2026-08-09
  phase_2026_08_18: 'IN PROGRESS (operator approved all 3 to execute 2026-08-18): planning (Tier 2, institutional-context-first)'
  pivot_2026_08_18: 'MAJOR PIVOT (operator, after 2 reviews DO-NOT-SHIP + quarantine-code consult). The
    surface+notify build is insufficient; move to a QUARANTINE/TRUST model mirroring the actuator D2.11
    flap-quarantine. DECISIONS: (1) QUARANTINE-ALWAYS (no corroboration gate on detection). (2) UNTRUST
    != drop — quarantine removes the sensor VOTE from the occupancy fusion; occupancy = fusion of REMAINING
    trusted inputs (if another working sensor/BLE/camera says present, stays present; if only the chattering
    sensor claimed present, correctly goes vacant). No force-vacant, no interlock. (3) The DEFINITION
    is the key + the safety: chatter = PHYSICS-BASED (transition faster than the sensor hardware off-delay/debounce
    floor) OR implausibly-SUSTAINED rate beyond any real occupancy episode — NEVER a raw transitions/min
    threshold (that would false-quarantine a busy room). Edge-count via a STATE-CHANGE LISTENER (A1 CRIT:
    tick-sampling cannot measure the rate). (4) Auto-release when quiet for a stability window + recovery
    NM (D2.11 pattern). Keep the surface (UnavailableEntitiesSensor reason=chattering) + NM (fire_stuck_signal)
    from the current build. REUSE the room-tier sensor-exclusion path (cf STUCK-SENSOR-1 / SENSOR-CAPABILITY-1)
    — do NOT invent a parallel exclusion. GATING FEASIBILITY QUESTION for the re-plan: does a room-tier
    "exclude a sensor vote from occupancy fusion" mechanism EXIST today, or is it the thing STUCK-SENSOR-1
    is blocked on building? Reverses the old non-goal. Now Tier 2-DB (occupancy/trust-hierarchy).'
  program_unification_2026_08_18: 'PROGRAM UNIFICATION (operator 2026-08-18): chatter, stuck-on, and flapping-mmWave
    are ASPECTS of ONE sensor-trust/exclusion program — a shared ROOM-TIER "untrust a sensor vote / exclude
    from occupancy fusion" primitive with multiple DETECTORS on top. Detectors differ by gate: CHATTER
    = physics-based, quarantine-always, NO corroboration -> NOT blocked on SENSOR-CAPABILITY-1; STUCK/flapping-mmWave
    = corroboration-gated -> blocked on SENSOR-CAPABILITY-1. Shared primitive = D1; chatter detector can
    land independently; stuck detector sequences after capability work. Do NOT build parallel exclusions.
    Members: SENSOR-HEALTH-SURFACING-1 (chatter), STUCK-SENSOR-1 (stuck/flapping mmWave), SENSOR-CAPABILITY-1
    (capability/role -> corroborator selection).'
  program: sensor-trust-exclusion
  definition_confirmed_2026_08_18: 'CHATTER DEFINITION GROUNDED + HAND-CHECKED + operator-confirmed. Chatter
    = >=K sub-T_floor impossibility events (interval below the device-family hardware blind-time) in-window,
    on BLIND-TIME-GATED sensors ONLY (PIR/mmWave/opener). PROVENANCE GATE excludes camera/AI (frame-cadence,
    no blind-time -> CHATTER-CAMERA-CONFIDENCE-FLAP-1), aggregates (union-rate; target the member), bed
    multi-state (SENSOR-MULTISTATE-FAULT-1) — justified: the un-fakeable criterion is UNDEFINED without
    a single hardware blind-time. T_floor from device-family blind-time (1-3s band), NEVER learned from
    the suspect itself (circular). Burst-of-K (not single event; K counts IMPOSSIBILITY events not transitions
    -> still never a raw rate). D0 GO-with-amendments: catches ratgdo (58,713 tx/7d, sustained 2-3s) +
