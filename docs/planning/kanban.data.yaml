- id: CENSUS-FACE-MISS-WATCH-1
  thread: presence
  status: inbox
  approval: unreviewed
  created: 2026-08-18 00:34
  updated: 2026-08-18 01:10
  refinement_status: initial
  title: Census face-lookup misses ~12/tick on an empty house — investigate on occupancy
  problem_solution:
  - 'Problem: after the v5.80.0 D2 fresh-face fix, the census reports face_lookup_missing_count = 12 per
    tick even with the house EMPTY (no faces to look up). It fails CLOSED so the count stays correct (no
    wrong -1 credit), but 12 cameras'' face entities not resolving is more than expected and may mean
    the _2/registry resolution still misses some cameras (possibly the interior-cam naming inconsistency,
    or cameras with no face sensor being probed anyway).'
  - 'Solution: on occupancy (Wed), check WHICH cameras miss and why — is the face path probing cameras
    that have no face sensor (benign, make it not count them) or failing to resolve a face sensor that
    exists (a real resolution gap to fix)? Discriminate before acting.'
  why: The v5.80.0 fresh-face fix is supposed to REVIVE face dedup; a high miss rate could mean it only
    partially works. Not a correctness risk (fail-closed) but the fix's value depends on faces resolving.
  constraints:
  - 'WATCH only — do not chase now (operator: card investigations, march the cycles). Interpret on occupancy.'
  next: 'On occupancy: confirm the count DROPS when residents are recognized. If it stays high with recognized
    residents present, investigate resolution. Optional: split the counter (absent vs no-face-now).'
  refs:
  - docs/readmes/README_v5.80.0.md
  - reference_frigate1_retired_2suffix_permanent.md
  interpretation_2026_08_18: 'EXPLAINED: face_lookup_missing_count increments when a camera''s face sensor
    reads unavailable/unknown/empty/none = "NO recognized face right now" (camera_census.py:2502), NOT
    only when the entity is absent. On an EMPTY house no camera has a recognized face, so ~every checked
    camera counts -> 12 is EXPECTED and BENIGN (fail-closed correct: no face => no -1 credit). It does
    NOT indicate a naming/resolution bug. THE DISCRIMINATING TEST IS OCCUPANCY: if the count STAYS high
    while residents are home AND being face-recognized, THAT is a real resolution gap. Minor observability
    nit: the counter conflates "entity absent" with "no face now" — could split into two counters for
    a clean health signal. Downgraded from concern to expected-on-empty; re-check on occupancy.'
- id: FRIGATE-LEG-NAMING-1
  thread: security
  status: inbox
  approval: unreviewed
  title: Frigate live/dead leg naming is INCONSISTENT across cameras — bare _person_occupancy is live
    F2 on interior, dead F1 on perimeter
  created: 2026-08-18 02:05
  updated: 2026-08-18 02:25
  refinement_status: initial
  problem_solution:
  - 'Problem: after Frigate 1 was retired, the INTERIOR cameras were renamed (dead F1 -> _person_occupancy_f1retired,
    live F2 -> bare _person_occupancy) but the PERIMETER cameras were NOT (live F2 stayed _person_occupancy_2,
    dead F1 kept the bare name and froze on 08-13). So the SAME bare `_person_occupancy` name means the
    LIVE camera feed on some cameras and a DEAD frozen feed on others. Any code that identifies the live
    Frigate leg by name pattern will silently use the DEAD leg for one group.'
  - 'Solution: standardise the naming (rename perimeter to match interior, or vice versa) OR make URA
    resolve the live leg by recency/registry never by name. Verify URA''s resolver + the census/perimeter
    paths pick the LIVE leg for BOTH groups (on perimeter it currently subscribes the dead F1 corpse alongside
    live F2 = skews agreement telemetry).'
  why: A name that means opposite things on different cameras is a latent silent-failure generator — it
    already caused me to misread interior cams as "Protect-only" and underlies the census/perimeter corroboration
    work.
  constraints:
  - Renaming entities has blast radius (every consumer of the old name). Prefer recency/registry resolution
    in code if renaming is risky. Verify against the cycle-2 D2 face fix (does it pick the live leg for
    interior cams, whose binary leg is bare while their face leg is still _2?).
  next: 'LATENT LOW (no live bug). Future: make _prefer_canonical tiebreak by recency not name. No action
    now.'
  refs:
  - reference_frigate1_retired_2suffix_permanent.md (corrected)
  - camera_resolver.py:214
  - PERIMETER-PHANTOM-XCORR-1
  audit_verdict_2026_08_18: 'AUDIT (AUDIT_frigate_dead_leg_correctness.md): NO dead-leg reads. The dead
    F1 legs are FULLY REMOVED from the registry (404), not frozen-present — so the naming inconsistency
    causes NO live correctness bug. Every read site is registry/state-gated; an absent dead name -> None.
    Census SAFE (live leg both groups). Perimeter SAFE. DOWNGRADED to LATENT LOW: the only residual is
    _prefer_canonical (camera_resolver.py:335) preferring the BARE name over _N — a name-based liveness
    assumption. No collision today (dead leg gone). IF an F1 perimeter leg ever reappears alongside live
    _2, census would pin to the frozen leg. Fix (future, not urgent): tiebreak by last_updated recency,
    not canonical name.'
- id: PERIMETER-PHANTOM-XCORR-1
  title: Perimeter person alerts fire with no person in the snapshot, sent twice, and not cross-checked
    across NVRs
  thread: security
  status: inbox
  approval: unreviewed
  created: 2026-08-17 23:58
  updated: 2026-08-18 02:40
  refinement_status: refined
  problem_solution:
  - 'Problem: a single perimeter camera crying "person" pages at FULL severity (CRITICAL when the house
    is away) even when no other camera watching the area agreed — because the alert records which cameras
    fired but throws that agreement away when deciding how loud to be. Verified by hand: both 08-16 alerts
    were single-source with empty snapshots.'
  - 'Solution (Tier 3, NARROW remit per operator): make the already-recorded cross-camera/NVR agreement
    MATTER to the notification severity — a single-source detection DEMOTES (floor LOW, never silenced,
    so a lone-camera real threat still pages); corroborated detections keep/raise severity. Where a camera
    has only one NVR, fall back to the existing track-linker spatial confidence. Plus the dashboard work
    to surface corroboration / single-vs-multi source. NOTHING ELSE — not a perimeter-detection redesign.'
  why: 'Perimeter alerts are a security surface — false alarms train the operator to ignore them (alert
    fatigue), and a double-send doubles the noise. Cross-NVR correlation is the same principle the operator
    just mandated for cycle-3 face ID: never trust a single camera.'
  constraints:
  - 'SECURITY-relevant — treat false-negative risk carefully: a cross-check must SUPPRESS phantoms without
    dropping a real intruder seen by only one NVR (a real person may be in only one camera''s view). So
    cross-correlation raises CONFIDENCE / severity, it does not gate the alert to zero.'
  operator_note: 'Operator 2026-08-17: "either phantom detections or the snapshot was delayed. Are they
    properly cross correlated? I believe Camera <silver?> does this for free." (term "Camera silver" unclear
    — operator believes an NVR/product already does cross-correlation natively; needs clarification.)'
  evidence: '4 iMessage screenshots (IMG_6989-6992, 2026-08-16 alerts). Sensors: binary_sensor.hot_tub_person_occupancy_2
    + binary_sensor.front_side_ptz_person_occupancy_2 — note the _2 Frigate-2 migration suffix, same class
    as the census fix.'
  next: 'Plan the Tier-3 narrow cycle: wire _sensor_engine agreement -> severity (single-source demote
    floor LOW, corroborated keep/raise; single-NVR cameras fall back to track-linker confidence) + dashboard
    surfacing. Separately: BB dummy-Apple-ID fix for the loopback (BB-side, operator); street-mask/OSD/friendly-name
    as small separate UX items.'
  refs:
  - custom_components/universal_room_automation/perimeter_alert.py
  - EXTERIOR-GUEST-EGRESS-1 (cross-NVR theme)
  code_verified_2026_08_17: 'CODE CHECKED (perimeter_alert.py). FINDINGS: (1) Multi-leg logic (:449-558)
    is COVERAGE + DEDUP, not corroboration — it subscribes to every integration on a camera (Frigate base
    + _2 + Protect) and dedups them; legs are OR''d, so ANY single leg firing alerts. NO corroboration
    gate. This is CORRECT for the "don''t gate to zero" rule (a real intruder in one camera must still
    alert). (2) SEVERITY GAP (the real bug): severity = house_state × track_class × camera_class (:1131-1160).
    NO confidence/corroboration axis. A single-source phantom when AWAY fires at full CRITICAL — same
    as an all-NVRs-agree real threat. (3) The agreement data EXISTS but is DISCARDED: per-leg engine tags
    recorded as "disagreement telemetry" (:537-538, _sensor_engine) but never read by the severity resolver
    = Bug Class #53 computed-but-not-consumed. (4) The linker DOES escalate/demote (:1162-1187) but that
    is cross-CAMERA spatial (person moving across property), NOT cross-NVR (multi-integration agreement
    on ONE camera); and the demote requires camera_count>=2 (:1167), so a single-camera phantom is NEVER
    demoted.'
  tags:
  - tier-3
  tier: Tier 3 — narrow remit
  db_verified_2026_08_17: 'BY-HAND DB VERIFY (recorder, 2026-08-16 windows): BOTH alerts were DEFINITIVELY
    SINGLE-SOURCE. At 15:15:56 UTC ONLY binary_sensor.hot_tub_person_occupancy_2 fired — no other NVR.
    At 15:21:16 UTC ONLY front_side_ptz_person_occupancy_2 fired — no other NVR (garage_a fired 15:20:13,
    unrelated area). Positive proof of the single-source diagnosis. CONTRAST: a REAL event on 08-17 15:12-15:13
    shows front_side_ptz firing repeatedly ALONGSIDE master_hallway/upstairs_hall/staircase/garagehallway
    = multi-camera corroboration existed for a real person. So the machinery CAN corroborate; the 08-16
    alerts genuinely had none. NUANCE for the build: cross-NVR corroboration is only POSSIBLE where multiple
    NVRs overlap on a camera (e.g. the pool overhead 4 integrations). hot_tub and front_side_ptz appear
    single-NVR (Frigate-2 only) — for those the severity signal must fall back to the track-linker (spatial)
    confidence, since no NVR-agreement signal exists.'
  double_send_corrected_2026_08_17: 'CORRECTION (operator): the "double-send" is NOT a URA dedup bug.
    BlueBubbles texts the operator through his OWN number, so each message shows once as SENT and once
    as RECEIVED on the same thread = own-number loopback. URA sends ONCE. Fix is BB-side (dedicated/dummy
    Apple ID on the host Mac), not URA. Removed from URA scope.'
  remit_2026_08_17: 'OPERATOR SCOPE 2026-08-17: "Tier 3 work with a very narrow remit to make thrown away
    corroboration matter to notifications. And any dashboard work." So: (1) wire the existing _sensor_engine
    agreement telemetry (:537-538) into the severity resolver (:1131-1160) — demote single-source (floor
    LOW), keep/raise corroborated; (2) dashboard surfacing of corroboration state. Tier 3 because it is
    security-relevant, touches the NM/severity shared primitive, and threads a value into a decision site.
    Remit is NARROW — do not expand into detection tuning, street-masking, OSD, or friendly-names (those
    are separate small UX items, NOT this Tier-3 cycle).'
  corroboration_definition_correction_2026_08_17: 'CORRECTION (operator caught orchestrator over-claim).
    The 08-17 "multi-camera corroboration" claim was WRONG: front_side_ptz (exterior) co-fired with master_hallway/upstairs_hall/staircase/garagehallway
    (INTERIOR) — but those interior cameras are NOT in EXTERIOR_ADJACENCY_GRAPH (const.py:1773, 12 exterior
    cams only), so the linker CANNOT group them. They were INDEPENDENT co-occurring detections (interior
    movement + an exterior trigger), not a corroborated track. NOT a bad path grouping (the graph excludes
    interior cams) — but the orchestrator wrongly read co-occurrence as corroboration. PRECISE DEFINITION
    for the build: corroboration for a PERIMETER alert = (a) multi-NVR agreement on the SAME camera, OR
    (b) adjacent EXTERIOR camera confirmation via EXTERIOR_ADJACENCY_GRAPH. INTERIOR cameras are NEVER
    a corroboration source for a perimeter alert. Do not let a co-firing interior sensor raise a perimeter
    detection confidence.'
  dual_nvr_disagreement_proof_2026_08_17: 'CORRECTION + STRONG PROOF (operator: "Nah Unifi and frigate
    2"). hot_tub + front_side_ptz are DUAL-NVR, both legs LIVE: Protect (_person_detected, ~120-150 changes,
    last 02:50) + Frigate-2 (_person_occupancy_2, last 02:50). (Third leg _person_occupancy = Frigate-1
    base, DEAD since 08-13 16:37 F1 retirement — stale corpse leg.) URA SUBSCRIBES BOTH (camera_resolver.py:214-216
    _PERSON_SUFFIXES includes _person_occupancy AND _person_detected). ON 08-16 THE TWO NVRS DISAGREED:
    hot_tub Frigate-2 on 15:15:56 -> off 15:15:58 (2-SECOND blip), Protect NEVER fired; front Frigate-2
    on 15:21:16->15:22:05, Protect NEVER fired. So URA had the live disagreement (1 of 2 NVRs) and PAGED
    CRITICAL anyway — the _sensor_engine agreement telemetry was recorded and DISCARDED by the severity
    resolver. This is the exact Tier-3 gap with a concrete live proof case. NOT a coverage gap (both subscribed+live).
    RETIRES the earlier "single-NVR fallback" nuance for these cams — they are dual-NVR with a real agreement
    signal; the track-linker fallback only matters for GENUINELY single-NVR cameras. NOTE for build: a
    2-second single-NVR blip that the co-watching NVR refused to confirm is the textbook demote case.'
