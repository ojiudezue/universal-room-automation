- id: EXTERIOR-DWELL-LOITER-1
  title: Circling classification has no dwell/loiter predicate — a 20-minute stationary watcher reads
    as pass_by
  thread: security
  status: parked
  approval: explicit
  approved_by: operator 2026-08-16 ("Card the security finding. May need more investigation before planning.
    Connect it to our work on Linker and this.") — carded for INVESTIGATION FIRST, not straight to planning.
  tags:
  - security
  - measure-before-build
  - no-fabrication-verify
  origin:
    date: '2026-08-16'
    gist: Surfaced by the exterior track-vs-census investigation while answering the operator's question
      on how the circling work intersects exterior census accuracy. Operator had just made exterior count
      accuracy a first-class SECURITY goal, not merely a guest input.
  problem_solution:
  - 'P1 `ExteriorTrackLinker.classify()` (exterior_track_linker.py:705-750) is PURELY TOPOLOGICAL. `circling`
    iff revisit_count >= 1 OR (camera_count >= EXTERIOR_TRACK_CLASSIFY_CIRCLING_CAMERAS AND non-monotonic
    path); `approach` iff egress-adjacent or camera_count >= EXTERIOR_TRACK_CLASSIFY_APPROACH_CAMERAS;
    else `pass_by`. `duration_s` IS computed and IS persisted in the episode attrs — but it NEVER gates
    a classification. Consequence: a person stationary at ONE camera for 20 minutes has revisit_count=0
    and camera_count=1, so it classifies `pass_by` and draws DIGEST severity, while a resident walking
    the dog past three cameras can out-rank it. S1 (candidate, NOT yet a plan) add a dwell predicate so
    sustained single-camera presence can reach `circling`/a new `loiter` class.'
  - P2 severity is keyed on (label, house_state, classification) via NM_HAZARD_EXTERIOR_TRACK_SEVERITY_MAP
    (const.py:1842-1875), so ANY new class is a severity-table change with NM blast radius — a new row
    set, not a one-line predicate. S2 scope the table change explicitly alongside the predicate; treat
    the map as the real interface.
  why: 'Loitering is the canonical security signal the current classifier is structurally blind to, and
    the blindness is not an oversight in the data (duration_s is right there) but in the predicate. Directly
    connected to the shipped linker work: CIRCLING-LABEL-1 (v5.76.0) fixed dispatch on circling TRANSITIONS,
    and CIRCLING-SEVERITY-1 tunes the severity map — both assume the CLASS ITSELF is assigned correctly.
    This card questions that assumption, so it is upstream of both.'
  constraints:
  - INVESTIGATION BEFORE PLANNING (operator). Do not write a planning doc off this card's hypothesis.
  - Any dwell threshold is a NUMBER and gets a knob with a rung — likely rung 1 (module constant) alongside
    the existing EXTERIOR_TRACK_* family, since changing it should require review.
  - 'False-positive cost is real and asymmetric: a dwell predicate that fires on a parked delivery driver,
    a gardener, or a stationary camera artifact converts a quiet DIGEST into a CRITICAL page. Measure
    before choosing.'
  next: PARKED pending prerequisites (camera-role gating + revived face-ID + track stitching). Face-ID
    revival is shared with CENSUS-ACCURACY-1 _2-suffix fix — revisit this card once that ships and face-ID
    is live.
  refs:
  - custom_components/universal_room_automation/exterior_track_linker.py:705-750
  - custom_components/universal_room_automation/const.py:1842-1875
  - docs/planning/AUDIT_memory_handbuild_compactor_exterior_track.md
  - docs/planning/PLANNING_circling_severity.md
  - docs/planning/PLANNING_circling_label_transition_dispatch.md
  - docs/planning/PROBE_exterior_dwell_loiter.md (491195ed9)
  probe_outcome_2026_08_17: 'PROBE DONE (PROBE_exterior_dwell_loiter.md, 491195ed9). RECOMMENDATION: DON''T
    build a raw duration predicate now. 623 person tracks / 11 days. Hypothesis PARTLY confirmed: dwell
    DOES leak into pass_by (41 tracks >5min, 4 >20min, max 70min) BUT circling already holds 71 of 133
    tracks >300s (median 407s), so loitering is only partly invisible. KILLER FINDING: of the 56 newly-catchable
    tracks (camera_count==1, >300s), 19 (34%) are INTERIOR cameras (master_hallway, upstairs_hall, staircase,
    playroom, family_room = residents INSIDE), and most perimeter ones are own back_yard/pool. Face-ID
    is DEAD (2/623 identified) so there is NO resident-vs-stranger signal. A raw predicate would convert
    quiet DIGESTs into CRITICAL pages on the household itself. Also 300s sits exactly on the TRACK_CLOSE_IDLE_S=300
    fragmentation seam (107 same-camera pairs <=600s gap) so duration_s is a LOWER BOUND. PREREQUISITES
    before any dwell predicate: (1) camera-role gating (interior/own-yard/perimeter-approach); (2) resident/stranger
    signal — REVIVE FACE-ID (this is the SAME _2-suffix fix in CENSUS-ACCURACY-1, so there is a real dependency)
    OR an allowlist; (3) track stitching across the idle-close seam. THEN threshold >=600s on perimeter-approach
    cameras only. Merit CONFIRMED but gated on prerequisites — parked, not dropped.'
