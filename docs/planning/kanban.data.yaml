  - 'B-H4: kill switch + checkpoint-areas knob latent unless reload-allowlisted (ties to RELOAD-WATCHDOG-HAZARD).
    FIX: signal-driven teardown+re-init on options change, no parent reload.'
  - 'CONVERGENCE: A-CRIT-1 == B-L1 (validate_transition filters via _get_shared_space_cameras hand-list
